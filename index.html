<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --cream: #f3e7cf;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            background: var(--brown);
            color: var(--cream);
            font-family: 'Neue Haas Grotesk', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        .defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* ---------- Lagen: grond, botjes, zand, effecten ---------- */

        #pit,
        #sand,
        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        #pit  { z-index: 0; }
        #sand { z-index: 2; }
        #fx   { z-index: 3; }

        #field {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* ---------- Botjes ---------- */

        .bone {
            position: absolute;
            display: grid;
            place-items: center;
            text-decoration: none;
            color: var(--neon);
            pointer-events: none;
            outline: none;
            transform: rotate(var(--rot, 0deg));
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .bone svg {
            grid-area: 1 / 1;
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.45));
        }

        .b-out {
            fill: #3a2210;
            stroke: #3a2210;
            stroke-width: 8;
            stroke-linejoin: round;
        }

        .b-in {
            fill: #f3e7cf;
            transition: fill 0.25s ease;
        }

        .num {
            grid-area: 1 / 1;
            font-size: calc(var(--w, 150px) * 0.3);
            line-height: 1;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transform: rotate(calc(var(--rot, 0deg) * -1));
            transition: opacity 0.5s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.25s ease;
        }

        .bone.revealed {
            pointer-events: auto;
            cursor: pointer;
        }

        .bone.revealed .num {
            opacity: 1;
        }

        .bone.revealed:hover,
        .bone.revealed:focus-visible {
            transform: rotate(0deg) scale(1.1);
        }

        .bone.revealed:hover .num,
        .bone.revealed:focus-visible .num {
            transform: rotate(0deg);
            color: #fff;
        }

        .bone.revealed:hover .b-in,
        .bone.revealed:focus-visible .b-in {
            fill: var(--neon);
        }

        /* ---------- Titel ---------- */

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
            font-size: clamp(2.8rem, 9.5vw, 11rem);
            font-weight: 400;
            line-height: 0.88;
            letter-spacing: -0.045em;
            text-transform: uppercase;
            color: var(--neon);
            white-space: nowrap;
        }

        .title span {
            display: inline;
        }

        .title .l1 {
            display: block;
        }

        /* ---------- Onderin (zelfde stijl als de edities) ---------- */

        .status {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
            color: var(--cream);
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }

        .nav-link {
            font-family: inherit;
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            line-height: 1.2;
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: opacity 0.25s ease;
            outline: none;
            pointer-events: auto;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* Telefoon */
        @media (max-width: 899px) {
            .title {
                font-size: 17vw;
            }

            .title span {
                display: block;
            }

            .status,
            .nav-link {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <!-- Botvorm, één keer gedefinieerd -->
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <g id="bone-shape">
                <rect x="40" y="26" width="120" height="28"/>
                <circle cx="34" cy="26" r="19"/>
                <circle cx="34" cy="54" r="19"/>
                <circle cx="166" cy="26" r="19"/>
                <circle cx="166" cy="54" r="19"/>
            </g>
        </defs>
    </svg>

    <canvas id="pit"></canvas>
    <div id="field"></div>
    <canvas id="sand"></canvas>
    <canvas id="fx"></canvas>

    <h1 class="title" id="title"><span class="l1">Dog Days</span> <span class="l2">Are Not</span> <span class="l3">Over</span></h1>

    <div class="status" id="status" aria-live="polite"></div>

    <nav class="nav-links" aria-label="Controls">
        <button type="button" class="nav-link" id="bury">↻ Bury again</button>
    </nav>

    <script>
        (function () {
            'use strict';

            var COUNT = 10;
            var DELAY = 1200;      // milliseconden stilhouden voor het graven begint
            var GROW = 0.05;       // hoe snel het gat groeit (pixels per milliseconde)

            var SURF = [107, 68, 35];   // #6b4423, het zand aan de oppervlakte
            var PIT  = [80, 49, 24];    // iets donkerder, vochtig zand onder het oppervlak

            var sand = document.getElementById('sand');
            var pit = document.getElementById('pit');
            var fx = document.getElementById('fx');
            var sctx = sand.getContext('2d', { willReadFrequently: true });
            var pctx = pit.getContext('2d');
            var fctx = fx.getContext('2d');
            var field = document.getElementById('field');
            var title = document.getElementById('title');
            var statusEl = document.getElementById('status');
            var buryBtn = document.getElementById('bury');

            var TAU = Math.PI * 2;
            var W = 0, H = 0, s = 1, maxR = 120, lastW = 0, lastH = 0;
            var bones = [];
            var particles = [];
            var pending = 0;
            var ptr = { active: false, x: 0, y: 0, sx: 0, sy: 0, t0: 0, done: false };
            var touching = false;
            var started = false;
            var needCheck = false, lastCheck = 0, fxDirty = false, lastT = 0;
            var isTouch = window.matchMedia('(pointer: coarse)').matches;

            function two(n) { return (n < 10 ? '0' : '') + n; }
            function byte(v) { return v < 0 ? 0 : v > 255 ? 255 : v | 0; }

            function mulberry32(a) {
                return function () {
                    a |= 0; a = a + 0x6D2B79F5 | 0;
                    var t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            /* ---------- Botjes aanmaken ---------- */

            for (var i = 0; i < COUNT; i++) {
                var a = document.createElement('a');
                a.className = 'bone';
                a.href = 'editie-' + two(i + 1) + '.html';
                a.setAttribute('aria-label', 'Edition ' + two(i + 1));
                a.innerHTML =
                    '<svg viewBox="0 0 200 80" aria-hidden="true">' +
                        '<use href="#bone-shape" class="b-out"/>' +
                        '<use href="#bone-shape" class="b-in"/>' +
                    '</svg>' +
                    '<span class="num">' + two(i + 1) + '</span>';
                field.appendChild(a);
                bones.push({ el: a, cx: 0, cy: 0, w: 0, h: 0, rot: 0, state: 0, queue: [], tick: 0 });
            }

            bones.forEach(function (b) {
                // Toetsenbord: bot wordt direct opgegraven
                b.el.addEventListener('focus', function () {
                    started = true;
                    startReveal(b);
                });
            });

            /* ---------- Zand tekenen ---------- */

            // Zandkorreltjes per pixel, met lichte en donkere korrels
            function makeTile(base, seed, size) {
                var t = document.createElement('canvas');
                t.width = t.height = size;
                var c = t.getContext('2d');
                var img = c.createImageData(size, size);
                var d = img.data;
                var rng = mulberry32(seed);

                for (var i = 0; i < d.length; i += 4) {
                    var n = (rng() + rng() + rng()) / 3 - 0.5;
                    var k = 1 + n * 0.9;
                    var r = rng();
                    if (r < 0.02) k += 0.5 + rng() * 0.45;          // lichte korrel
                    else if (r < 0.055) k -= 0.32 + rng() * 0.3;    // donkere korrel
                    var warm = 1 + (rng() - 0.5) * 0.08;
                    d[i]     = byte(base[0] * k * warm);
                    d[i + 1] = byte(base[1] * k);
                    d[i + 2] = byte(base[2] * k * (2 - warm));
                    d[i + 3] = 255;
                }
                c.putImageData(img, 0, 0);

                // Kleine klontjes van twee pixels
                for (var j = 0; j < size * size * 0.0025; j++) {
                    c.globalAlpha = 0.3 + rng() * 0.3;
                    c.fillStyle = rng() > 0.5 ? 'rgb(168,120,70)' : 'rgb(30,16,6)';
                    c.fillRect(rng() * size, rng() * size, 2, 2);
                }
                c.globalAlpha = 1;
                return t;
            }

            function blotches(c, n, seed, alpha) {
                var rng = mulberry32(seed);
                for (var i = 0; i < n; i++) {
                    var x = rng() * W, y = rng() * H, r = 90 + rng() * 200;
                    var light = rng() > 0.5;
                    var g = c.createRadialGradient(x, y, 0, x, y, r);
                    g.addColorStop(0, light ? 'rgba(190,140,85,' + alpha + ')' : 'rgba(20,10,3,' + (alpha * 1.4) + ')');
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    c.fillStyle = g;
                    c.fillRect(x - r, y - r, r * 2, r * 2);
                }
            }

            function pebbles(c, n, seed) {
                var rng = mulberry32(seed);
                for (var i = 0; i < n; i++) {
                    var x = rng() * W, y = rng() * H, r = 1.2 + rng() * 2.6;
                    c.fillStyle = rng() > 0.5 ? 'rgba(175,128,78,0.45)' : 'rgba(25,12,4,0.4)';
                    c.beginPath();
                    c.ellipse(x, y, r, r * 0.7, rng() * 3, 0, TAU);
                    c.fill();
                }
            }

            function ripples(c, strength) {
                c.lineCap = 'round';
                for (var y = 20; y < H; y += 36) {
                    for (var pass = 0; pass < 2; pass++) {
                        c.beginPath();
                        for (var x = -10; x <= W + 10; x += 12) {
                            var yy = y + Math.sin(x / 90 + y / 40) * 5 + Math.sin(x / 37) * 2 + pass * 3;
                            if (x === -10) c.moveTo(x, yy); else c.lineTo(x, yy);
                        }
                        c.strokeStyle = pass === 0 ? 'rgba(20,10,3,' + (0.12 * strength) + ')' : 'rgba(195,145,90,' + (0.1 * strength) + ')';
                        c.lineWidth = pass === 0 ? 2 : 1.5;
                        c.stroke();
                    }
                }
            }

            function paintSurface() {
                sctx.save();
                sctx.setTransform(s, 0, 0, s, 0, 0);
                sctx.globalCompositeOperation = 'source-over';
                sctx.globalAlpha = 1;
                sctx.clearRect(0, 0, W, H);
                sctx.fillStyle = sctx.createPattern(makeTile(SURF, 3, 320), 'repeat');
                sctx.fillRect(0, 0, W, H);
                blotches(sctx, 70, 5, 0.1);
                pebbles(sctx, 320, 9);
                ripples(sctx, 1);
                sctx.restore();
            }

            function paintPit() {
                pctx.save();
                pctx.setTransform(s, 0, 0, s, 0, 0);
                pctx.fillStyle = pctx.createPattern(makeTile(PIT, 17, 320), 'repeat');
                pctx.fillRect(0, 0, W, H);
                blotches(pctx, 60, 21, 0.09);
                pebbles(pctx, 240, 33);
                ripples(pctx, 0.5);
                pctx.restore();
            }

            /* ---------- Opmaak ---------- */

            function band(list, x0, y0, x1, y1, cols, rng, mobile) {
                var n = list.length;
                var rows = Math.ceil(n / cols);
                var cw = (x1 - x0) / cols;
                var ch = Math.max(40, (y1 - y0) / rows);

                list.forEach(function (b, i) {
                    var r = Math.floor(i / cols), c = i % cols;
                    var inRow = Math.min(cols, n - r * cols);
                    var off = (cols - inRow) * cw / 2;
                    var w = Math.min(cw * 0.78, ch * 1.2);
                    var h = w * 0.4;
                    var jx = (cw - w) / 2 * 0.5 * (rng() * 2 - 1);
                    var jy = (ch - h) / 2 * 0.3 * (rng() * 2 - 1);
                    var rot = (rng() * 2 - 1) * (mobile ? 18 : 22);

                    b.w = w;
                    b.h = h;
                    b.rot = rot;
                    b.cx = x0 + off + cw * (c + 0.5) + jx;
                    b.cy = y0 + ch * (r + 0.5) + jy;

                    b.el.style.width = w + 'px';
                    b.el.style.height = h + 'px';
                    b.el.style.left = (b.cx - w / 2) + 'px';
                    b.el.style.top = (b.cy - h / 2) + 'px';
                    b.el.style.setProperty('--w', w + 'px');
                    b.el.style.setProperty('--rot', rot.toFixed(1) + 'deg');
                });
            }

            function layout() {
                var mobile = W < 900;
                var tr = title.getBoundingClientRect();
                var x0 = W * 0.04, x1 = W * 0.96;
                var cols = mobile ? 2 : 5;
                var rng = mulberry32(11);

                band(bones.slice(0, 5), x0, 28, x1, tr.top - 14, cols, rng, mobile);
                band(bones.slice(5), x0, tr.bottom + 14, x1, H - 62, cols, rng, mobile);
            }

            function resetBones() {
                pending = 0;
                bones.forEach(function (b) {
                    b.state = 0;
                    b.queue = [];
