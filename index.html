<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --cream: #f3e7cf;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
        }

        body {
            background: #2a170a;
            color: var(--cream);
            font-family: 'Neue Haas Grotesk', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        .defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        #pit,
        #sand,
        #fx {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        #pit  { z-index: 0; }
        #sand { z-index: 2; }
        #fx   { z-index: 3; }

        #field {
            position: fixed;
            inset: 0;
            z-index: 1;
        }

        /* ---------- Botjes ---------- */

        .bone {
            position: absolute;
            display: grid;
            place-items: center;
            text-decoration: none;
            color: var(--neon);
            pointer-events: none;
            outline: none;
            transform: rotate(var(--rot, 0deg));
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .bone svg {
            grid-area: 1 / 1;
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
            filter: drop-shadow(0 4px 5px rgba(0, 0, 0, 0.55));
        }

        .b-out {
            fill: #1d0f05;
            stroke: #1d0f05;
            stroke-width: 8;
            stroke-linejoin: round;
        }

        .b-in {
            fill: #f3e7cf;
            transition: fill 0.25s ease;
        }

        .num {
            grid-area: 1 / 1;
            font-size: calc(var(--w, 150px) * 0.3);
            line-height: 1;
            letter-spacing: -0.03em;
            font-variant-numeric: tabular-nums;
            opacity: 0;
            transform: rotate(calc(var(--rot, 0deg) * -1));
            transition: opacity 0.5s ease, transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1), color 0.25s ease;
        }

        .bone.revealed {
            pointer-events: auto;
            cursor: pointer;
        }

        .bone.revealed .num {
            opacity: 1;
        }

        .bone.revealed:hover,
        .bone.revealed:focus-visible {
            transform: rotate(0deg) scale(1.1);
        }

        .bone.revealed:hover .num,
        .bone.revealed:focus-visible .num {
            transform: rotate(0deg);
            color: #fff;
        }

        .bone.revealed:hover .b-in,
        .bone.revealed:focus-visible .b-in {
            fill: var(--neon);
        }

        /* ---------- Uitroepteken boven het zand ---------- */

        #marks {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
        }

        .mark {
            position: absolute;
            transform: translate(-50%, -50%);
            color: var(--neon);
            font-family: 'Neue Haas Grotesk', sans-serif;
            font-weight: 400;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .mark.on {
            opacity: 1;
        }

        /* ---------- Titel ---------- */

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            pointer-events: none;
            text-align: center;
            font-size: clamp(2.8rem, 9.5vw, 11rem);
            font-weight: 400;
            line-height: 0.88;
            letter-spacing: -0.045em;
            text-transform: uppercase;
            color: var(--neon);
            white-space: nowrap;
        }

        .title span {
            display: inline;
        }

        .title .l1 {
            display: block;
        }

        /* ---------- Onderin ---------- */

        .status {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            line-height: 1.2;
            white-space: nowrap;
            pointer-events: none;
            color: var(--cream);
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 6;
            pointer-events: none;
        }

        .nav-link {
            font-family: inherit;
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            line-height: 1.2;
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: opacity 0.25s ease;
            outline: none;
            pointer-events: auto;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        @media (max-width: 899px) {
            .title {
                font-size: 17vw;
            }

            .title span {
                display: block;
            }

            .status,
            .nav-link {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <g id="bone-shape">
                <rect x="40" y="26" width="120" height="28"/>
                <circle cx="34" cy="26" r="19"/>
                <circle cx="34" cy="54" r="19"/>
                <circle cx="166" cy="26" r="19"/>
                <circle cx="166" cy="54" r="19"/>
            </g>
        </defs>
    </svg>

    <canvas id="pit"></canvas>
    <div id="field"></div>
    <canvas id="sand"></canvas>
    <canvas id="fx"></canvas>
    <div id="marks" aria-hidden="true"></div>

    <h1 class="title" id="title"><span class="l1">Dog Days</span> <span class="l2">Are Not</span> <span class="l3">Over</span></h1>

    <div class="status" id="status" aria-live="polite"></div>

    <nav class="nav-links" aria-label="Controls">
        <button type="button" class="nav-link" id="bury">↻ Bury again</button>
    </nav>

    <script>
        (function () {
            'use strict';

            var COUNT = 10;
            var DELAY = 900;       // milliseconden stilhouden voor het graven begint
            var GROW = 0.05;       // hoe snel het gat groeit (pixels per milliseconde)

            var SURF = [107, 68, 35];   // #6b4423: het zand aan de oppervlakte
            var PIT  = [46, 27, 13];    // veel donkerder zand onder het oppervlak

            var sand = document.getElementById('sand');
            var pit = document.getElementById('pit');
            var fx = document.getElementById('fx');
            var sctx = sand.getContext('2d', { willReadFrequently: true });
            var pctx = pit.getContext('2d');
            var fctx = fx.getContext('2d');
            var field = document.getElementById('field');
            var marks = document.getElementById('marks');
            var title = document.getElementById('title');
            var statusEl = document.getElementById('status');
            var buryBtn = document.getElementById('bury');

            var TAU = Math.PI * 2;
            var W = 0, H = 0, s = 1, maxR = 120, lastW = 0, lastH = 0;
            var bones = [];
            var particles = [];
            var pending = 0;
            var ptr = { active: false, sx: 0, sy: 0, t0: 0, done: false };
            var down = false;
            var started = false;
            var needCheck = false, lastCheck = 0, fxDirty = false, lastT = 0;
            var isTouch = window.matchMedia('(pointer: coarse)').matches;

            function two(n) { return (n < 10 ? '0' : '') + n; }
            function clampByte(v) { return v < 0 ? 0 : v > 255 ? 255 : v | 0; }

            function mulberry32(a) {
                return function () {
                    a |= 0; a = a + 0x6D2B79F5 | 0;
                    var t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            /* ---------- Botjes aanmaken ---------- */

            for (var bi = 0; bi < COUNT; bi++) {
                var link = document.createElement('a');
                link.className = 'bone';
                link.href = 'editie-' + two(bi + 1) + '.html';
                link.setAttribute('aria-label', 'Edition ' + two(bi + 1));
                link.innerHTML =
                    '<svg viewBox="0 0 200 80" aria-hidden="true">' +
                        '<use href="#bone-shape" class="b-out"/>' +
                        '<use href="#bone-shape" class="b-in"/>' +
                    '</svg>' +
                    '<span class="num">' + two(bi + 1) + '</span>';
                field.appendChild(link);

                var mark = document.createElement('div');
                mark.className = 'mark';
                mark.textContent = '!';
                marks.appendChild(mark);

                bones.push({ el: link, mark: mark, cx: 0, cy: 0, w: 0, h: 0, rot: 0, state: 0, queue: [], tick: 0 });
            }

            bones.forEach(function (b) {
                // Toetsenbord: bot wordt direct opgegraven
                b.el.addEventListener('focus', function () {
                    started = true;
                    startReveal(b);
                });
            });

            /* ---------- Zand tekenen ---------- */

            function makeTile(base, seed, size) {
                var t = document.createElement('canvas');
                t.width = t.height = size;
                var c = t.getContext('2d');
                var img = c.createImageData(size, size);
                var d = img.data;
                var rng = mulberry32(seed);

                for (var i = 0; i < d.length; i += 4) {
                    var n = (rng() + rng() + rng()) / 3 - 0.5;
                    var k = 1 + n * 0.9;
                    var r = rng();
                    if (r < 0.02) k += 0.5 + rng() * 0.45;
                    else if (r < 0.055) k -= 0.32 + rng() * 0.3;
                    var warm = 1 + (rng() - 0.5) * 0.08;
                    d[i]     = clampByte(base[0] * k * warm);
                    d[i + 1] = clampByte(base[1] * k);
                    d[i + 2] = clampByte(base[2] * k * (2 - warm));
                    d[i + 3] = 255;
                }
                c.putImageData(img, 0, 0);

                for (var j = 0; j < size * size * 0.0025; j++) {
                    c.globalAlpha = 0.3 + rng() * 0.3;
                    c.fillStyle = rng() > 0.5 ? 'rgb(150,105,60)' : 'rgb(15,8,3)';
                    c.fillRect(rng() * size, rng() * size, 2, 2);
                }
                c.globalAlpha = 1;
                return t;
            }

            function blotches(c, n, seed, alpha) {
                var rng = mulberry32(seed);
                for (var i = 0; i < n; i++) {
                    var x = rng() * W, y = rng() * H, r = 90 + rng() * 200;
                    var light = rng() > 0.5;
                    var g = c.createRadialGradient(x, y, 0, x, y, r);
                    g.addColorStop(0, light ? 'rgba(190,140,85,' + alpha + ')' : 'rgba(20,10,3,' + (alpha * 1.4) + ')');
                    g.addColorStop(1, 'rgba(0,0,0,0)');
                    c.fillStyle = g;
                    c.fillRect(x - r, y - r, r * 2, r * 2);
                }
            }

            function pebbles(c, n, seed) {
                var rng = mulberry32(seed);
                for (var i = 0; i < n; i++) {
                    var x = rng() * W, y = rng() * H, r = 1.2 + rng() * 2.6;
                    c.fillStyle = rng() > 0.5 ? 'rgba(175,128,78,0.45)' : 'rgba(25,12,4,0.4)';
                    c.beginPath();
                    c.ellipse(x, y, r, r * 0.7, rng() * 3, 0, TAU);
                    c.fill();
                }
            }

            function paintSurface() {
                sctx.save();
                sctx.setTransform(s, 0, 0, s, 0, 0);
                sctx.globalCompositeOperation = 'source-over';
                sctx.globalAlpha = 1;
                sctx.clearRect(0, 0, W, H);
                sctx.fillStyle = sctx.createPattern(makeTile(SURF, 3, 320), 'repeat');
                sctx.fillRect(0, 0, W, H);
                blotches(sctx, 70, 5, 0.1);
                pebbles(sctx, 320, 9);
                sctx.restore();
            }

            function paintPit() {
                pctx.save();
                pctx.setTransform(s, 0, 0, s, 0, 0);
                pctx.fillStyle = pctx.createPattern(makeTile(PIT, 17, 320), 'repeat');
                pctx.fillRect(0, 0, W, H);
                blotches(pctx, 60, 21, 0.09);
                pebbles(pctx, 240, 33);
                pctx.restore();
            }

            /* ---------- Opmaak ---------- */

            function band(list, x0, y0, x1, y1, cols, rng, mobile) {
                var n = list.length;
                var rows = Math.ceil(n / cols);
                var cw = (x1 - x0) / cols;
                var ch = Math.max(40, (y1 - y0) / rows);

                list.forEach(function (b, i) {
                    var r = Math.floor(i / cols), c = i % cols;
                    var inRow = Math.min(cols, n - r * cols);
                    var off = (cols - inRow) * cw / 2;
                    var w = Math.min(cw * 0.78, ch * 1.2);
                    var h = w * 0.4;
                    var jx = (cw - w) / 2 * 0.5 * (rng() * 2 - 1);
                    var jy = (ch - h) / 2 * 0.3 * (rng() * 2 - 1);
                    var rot = (rng() * 2 - 1) * (mobile ? 18 : 22);

                    b.w = w;
                    b.h = h;
                    b.rot = rot;
                    b.cx = x0 + off + cw * (c + 0.5) + jx;
                    b.cy = y0 + ch * (r + 0.5) + jy;

                    b.el.style.width = w + 'px';
                    b.el.style.height = h + 'px';
                    b.el.style.left = (b.cx - w / 2) + 'px';
                    b.el.style.top = (b.cy - h / 2) + 'px';
                    b.el.style.setProperty('--w', w + 'px');
                    b.el.style.setProperty('--rot', rot.toFixed(1) + 'deg');

                    b.mark.style.left = b.cx + 'px';
                    b.mark.style.top = b.cy + 'px';
                    b.mark.style.fontSize = Math.max(28, h * 1.1) + 'px';
                });
            }

            function layout() {
                var mobile = W < 900;
                var tr = title.getBoundingClientRect();
                var x0 = W * 0.04, x1 = W * 0.96;
                var cols = mobile ? 2 : 5;
                var rng = mulberry32(11);

                band(bones.slice(0, 5), x0, 28, x1, tr.top - 14, cols, rng, mobile);
                band(bones.slice(5), x0, tr.bottom + 14, x1, H - 62, cols, rng, mobile);
            }

            function resetBones() {
                pending = 0;
                bones.forEach(function (b) {
                    b.state = 0;
                    b.queue = [];
                    b.el.classList.remove('revealed');
                    b.mark.classList.remove('on');
                });
            }

            function setup() {
                W = window.innerWidth;
                H = window.innerHeight;
                lastW = W;
                lastH = H;
                s = Math.min(window.devicePixelRatio || 1, 1.5);
                maxR = Math.max(80, Math.min(170, Math.min(W, H) * 0.15));

                sand.width = pit.width = fx.width = Math.round(W * s);
                sand.height = pit.height = fx.height = Math.round(H * s);
                fctx.setTransform(s, 0, 0, s, 0, 0);

                paintPit();
                paintSurface();
                sctx.setTransform(s, 0, 0, s, 0, 0);

                particles = [];
                ptr.active = false;
                started = false;
                resetBones();
                layout();
                checkAll();
            }

            /* ---------- Uitroepteken boven een begraven bot ---------- */

            function updateMarks(x, y) {
                bones.forEach(function (b) {
                    var on = false;
                    if (b.state === 0 && x !== null) {
                        var th = b.rot * Math.PI / 180;
                        var dx = x - b.cx, dy = y - b.cy;
                        var lx = dx * Math.cos(th) + dy * Math.sin(th);
                        var ly = -dx * Math.sin(th) + dy * Math.cos(th);
                        on = Math.abs(lx) < b.w * 0.55 && Math.abs(ly) < b.h * 0.8;
                    }
                    b.mark.classList.toggle('on', on);
                });
            }

            /* ---------- Graven ---------- */

            function circle(c, x, y, r) {
                c.beginPath();
                c.arc(x, y, r, 0, TAU);
                c.fill();
            }

            function dig(x, y, r) {
                sctx.save();
                sctx.setTransform(s, 0, 0, s, 0, 0);

                // Schaduw rond het gat (alleen waar nog zand ligt)
                sctx.globalCompositeOperation = 'source-atop';
                var g = sctx.createRadialGradient(x, y, r * 0.8, x, y, r * 1.45);
                g.addColorStop(0, 'rgba(10,5,2,0.10)');
                g.addColorStop(1, 'rgba(10,5,2,0)');
                sctx.fillStyle = g;
                circle(sctx, x, y, r * 1.45);

                // Het gat zelf, met een grillige rand
                sctx.globalCompositeOperation = 'destination-out';
                sctx.fillStyle = '#000';
                circle(sctx, x, y, r * 0.9);
                for (var i = 0; i < 9; i++) {
                    var an = Math.random() * TAU;
                    circle(sctx, x + Math.cos(an) * r * 0.7, y + Math.sin(an) * r * 0.7, r * (0.22 + Math.random() * 0.12));
                }
                sctx.restore();
            }

            var GRAIN = ['#8a5d35', '#a0733f', '#b88a55', '#c49a63', '#6b4423', '#4f3018'];

            function spawn(x, y, r, n) {
                for (var i = 0; i < n; i++) {
                    var an = Math.random() * TAU;
                    var rim = Math.random() < 0.6;
                    var d = rim ? r * (0.8 + Math.random() * 0.2) : Math.random() * r * 0.5;
                    var sp = 1 + Math.random() * 3.2;
                    var clump = Math.random() < 0.12;
                    particles.push({
                        x: x + Math.cos(an) * d,
                        y: y + Math.sin(an) * d,
                        vx: Math.cos(an) * sp + (Math.random() - 0.5),
                        vy: Math.sin(an) * sp * 0.6 - (2 + Math.random() * 3.5),
                        life: 0,
                        max: 30 + Math.random() * 35,
                        size: clump ? 3.5 + Math.random() * 2 : 1.4 + Math.random() * 2.2,
                        c: GRAIN[(Math.random() * GRAIN.length) | 0]
                    });
                }
            }

            function land(q) {
                sctx.save();
                sctx.setTransform(s, 0, 0, s, 0, 0);
                sctx.globalCompositeOperation = 'source-atop';
                sctx.fillStyle = q.c;
                sctx.fillRect(q.x, q.y, q.size, q.size);
                sctx.restore();
            }

            /* ---------- Botjes onthullen ---------- */

            function clearAt(px, py) {
                var X = Math.round(px * s), Y = Math.round(py * s);
                if (X < 0 || Y < 0 || X >= sand.width || Y >= sand.height) return false;
                return sctx.getImageData(X, Y, 1, 1).data[3] < 40;
            }

            function startReveal(b) {
                if (b.state) return;
                b.state = 1;
                b.tick = 0;
                b.queue = [];
                b.mark.classList.remove('on');
                var th = b.rot * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
                var rr = b.w * 0.24;
                [0, -0.075, 0.075, -0.15, 0.15, -0.225, 0.225, -0.3, 0.3].forEach(function (o) {
                    b.queue.push([b.cx + o * b.w * cs, b.cy + o * b.w * sn, rr]);
                });
                pending++;
                fxDirty = true;
            }

            function stepReveals() {
                bones.forEach(function (b) {
                    if (b.state !== 1) return;
                    b.tick++;
                    if (b.tick % 2) return;
                    var p = b.queue.shift();
                    if (p) {
                        dig(p[0], p[1], p[2]);
                        spawn(p[0], p[1], p[2], 6);
                    }
                    if (!b.queue.length) {
                        b.state = 2;
                        b.el.classList.add('revealed');
                        pending--;
                        needCheck = true;
                        lastCheck = 0;
                    }
                });
            }

            function checkAll() {
                var found = 0;
                bones.forEach(function (b) {
                    if (b.state === 0) {
                        var th = b.rot * Math.PI / 180;
                        var cs = Math.cos(th), sn = Math.sin(th);
                        var n = 0;
                        [-0.3, -0.15, 0, 0.15, 0.3].forEach(function (o) {
                            if (clearAt(b.cx + o * b.w * cs, b.cy + o * b.w * sn)) n++;
                        });
                        if (n >= 3) startReveal(b);
                    }
                    if (b.state === 2) found++;
                });
                updateStatus(found);
            }

            function updateStatus(found) {
                if (!started && found === 0) {
                    statusEl.textContent = isTouch ? 'Press and drag to dig' : 'Hold still or click and drag to dig';
                } else if (found >= COUNT) {
                    statusEl.textContent = 'All found. Pick an edition';
                } else {
                    statusEl.textContent = found + ' / ' + COUNT + ' bones found';
                }
            }

            /* ---------- Animatie ---------- */

            function loop(now) {
                requestAnimationFrame(loop);
                var dt = Math.min(40, now - (lastT || now)) / 16.7;
                lastT = now;

                if (!particles.length && !ptr.active && !fxDirty && pending <= 0) return;

                fctx.clearRect(0, 0, W, H);

                if (ptr.active && (!ptr.done || down)) {
                    var held = now - ptr.t0;
                    if (held < DELAY) {
                        if (held > 150) {
                            var p = held / DELAY;
                            fctx.lineWidth = 2.5;
                            fctx.lineCap = 'round';
                            fctx.strokeStyle = 'rgba(243,231,207,0.35)';
                            fctx.beginPath();
                            fctx.arc(ptr.sx, ptr.sy, 18, 0, TAU);
                            fctx.stroke();
                            fctx.strokeStyle = '#ff2fa8';
                            fctx.beginPath();
                            fctx.arc(ptr.sx, ptr.sy, 18, -Math.PI / 2, -Math.PI / 2 + p * TAU);
                            fctx.stroke();
                        }
                    } else {
                        started = true;
                        var r = Math.min(maxR, 20 + (held - DELAY) * GROW);
                        dig(ptr.sx, ptr.sy, r);
                        spawn(ptr.sx, ptr.sy, r, 6);
                        needCheck = true;
                        if (r >= maxR && !down) {
                            ptr.done = true;
                            lastCheck = 0;
                        }
                    }
                }

                if (pending > 0) stepReveals();

                for (var i = particles.length - 1; i >= 0; i--) {
                    var q = particles[i];
                    q.life += dt;
                    if (q.life >= q.max) {
                        if (Math.random() < 0.5) land(q);
                        particles.splice(i, 1);
                        continue;
                    }
                    q.vy += 0.18 * dt;
                    q.x += q.vx * dt;
                    q.y += q.vy * dt;
                    fctx.globalAlpha = Math.min(1, (1 - q.life / q.max) * 1.4);
                    fctx.fillStyle = q.c;
                    fctx.fillRect(q.x, q.y, q.size, q.size);
                }
                fctx.globalAlpha = 1;
                fxDirty = particles.length > 0 || ptr.active || pending > 0;

                if (needCheck && now - lastCheck > 140) {
                    lastCheck = now;
                    needCheck = false;
                    checkAll();
                }
            }

            /* ---------- Invoer ---------- */

            function onBone(e) {
                var t = e.target;
                return !!(t && t.closest && t.closest('.bone.revealed, .nav-link'));
            }

            function startDwell(x, y, instant) {
                ptr.active = true;
                ptr.done = false;
                ptr.sx = x;
                ptr.sy = y;
                ptr.t0 = performance.now() - (instant ? DELAY : 0);
                fxDirty = true;
            }

            window.addEventListener('pointermove', function (e) {
                updateMarks(e.clientX, e.clientY);

                if (onBone(e)) {
                    if (!down) ptr.active = false;
                    return;
                }
                if (down) {
                    // Slepen: het gat volgt de cursor
                    if (!ptr.active) startDwell(e.clientX, e.clientY, true);
                    ptr.sx = e.clientX;
                    ptr.sy = e.clientY;
                    fxDirty = true;
                    return;
                }
                if (e.pointerType === 'touch') return;
                if (!ptr.active) {
                    startDwell(e.clientX, e.clientY, false);
                } else {
                    var dx = e.clientX - ptr.sx, dy = e.clientY - ptr.sy;
                    if (dx * dx + dy * dy > 196) startDwell(e.clientX, e.clientY, false);
                }
            });

            window.addEventListener('pointerdown', function (e) {
                updateMarks(e.clientX, e.clientY);
                if (onBone(e)) return;
                down = true;
                startDwell(e.clientX, e.clientY, true);
            });

            function release(e) {
                down = false;
                needCheck = true;
                if (e.pointerType === 'touch') {
                    ptr.active = false;
                    updateMarks(null, null);
                } else {
                    startDwell(e.clientX, e.clientY, false);
                }
            }
            window.addEventListener('pointerup', release);
            window.addEventListener('pointercancel', release);

            document.documentElement.addEventListener('mouseleave', function () {
                ptr.active = false;
                down = false;
                updateMarks(null, null);
            });

            buryBtn.addEventListener('click', function () {
                paintSurface();
                particles = [];
                ptr.active = false;
                down = false;
                started = false;
                resetBones();
                fctx.clearRect(0, 0, W, H);
                checkAll();
            });

            var resizeTimer = 0;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function () {
                    if (Math.abs(window.innerWidth - lastW) > 2 || Math.abs(window.innerHeight - lastH) > 120) {
                        setup();
                    }
                }, 150);
            });

            /* ---------- Start ---------- */

            setup();
            requestAnimationFrame(loop);

            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function () {
                    layout();
                    checkAll();
                });
            }
        })();
    </script>
</body>
</html>
