<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editie 02</title>
    <style>
        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #faf8f7;
            font-family: 'Neue Haas Grotesk', sans-serif;
            color: #5c3925;
        }

        body {
            position: relative;
            padding: 1.2rem;
        }

        header {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            z-index: 2;
        }

        .editie-badge,
        .site-name {
            font-size: 0.9rem;
            font-weight: 400;
            color: #5c3925;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            line-height: 1;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 2rem;
        }

        .gallery {
            width: 100%;
            height: calc(100% - 2rem);
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            grid-template-rows: repeat(4, minmax(0, 1fr));
            gap: 0.6rem;
            max-width: 92vw;
            max-height: 88vh;
        }

        .photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            overflow: hidden;
        }

        .nav {
            position: absolute;
            left: 1.2rem;
            bottom: 1.2rem;
            z-index: 2;
        }

        .nav a {
            color: #ff1493;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-weight: 400;
            margin-right: 1.8rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 0.8rem;
            }

            header {
                top: 0.8rem;
                left: 0.8rem;
                gap: 0.4rem;
            }

            .editie-badge,
            .site-name {
                font-size: 0.72rem;
                letter-spacing: 0.08em;
            }

            .gallery {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                gap: 0.4rem;
                max-width: 100%;
                max-height: 100%;
                margin-top: 1.4rem;
            }

            .nav {
                left: 0.8rem;
                bottom: 0.8rem;
            }

            .nav a {
                font-size: 0.72rem;
                margin-right: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 02</div>
        <div class="site-name">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="gallery">
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image:url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=900&q=80');"></div>
        </div>
    </main>

    <div class="nav">
        <a href="editie-01.html">← Editie 01</a>
        <a href="editie-03.html">Editie 03 →</a>
    </div>
</body>
</html>
