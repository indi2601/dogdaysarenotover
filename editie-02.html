
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --blue: #50F6D8;
            --background: #FFFFFF;
            --paw: clamp(90px, 15vmin, 190px);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        header {
            position: fixed;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
            z-index: 20;
        }

        .editie-badge,
        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        .paws {
            position: relative;
        }

        .paw {
            display: block;
            width: var(--paw);
            height: var(--paw);
            overflow: visible;
            pointer-events: none;
            animation: fadeIn 0.6s ease-out backwards;
            transform-origin: center;
            transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .paw image,
        .paw .toes {
            pointer-events: auto;
        }

        .paw .toes {
            fill: var(--blue);
        }

        /* Geen outline bij hover */
        .paw .outline {
            display: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .paw:nth-child(1)  { animation-delay: 0.1s; }
        .paw:nth-child(2)  { animation-delay: 0.2s; }
        .paw:nth-child(3)  { animation-delay: 0.3s; }
        .paw:nth-child(4)  { animation-delay: 0.4s; }
        .paw:nth-child(5)  { animation-delay: 0.5s; }
        .paw:nth-child(6)  { animation-delay: 0.6s; }
        .paw:nth-child(7)  { animation-delay: 0.7s; }
        .paw:nth-child(8)  { animation-delay: 0.8s; }
        .paw:nth-child(9)  { animation-delay: 0.9s; }
        .paw:nth-child(10) { animation-delay: 1s; }
        .paw:nth-child(11) { animation-delay: 1.1s; }

        /* Desktop: pad start lager en loopt omhoog */
        @media (min-width: 701px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .paws {
                position: absolute;
                top: 5.5rem;
                bottom: 4.5rem;
                left: 2vw;
                right: 2vw;
            }

            .paw {
                position: absolute;
                left: var(--x);
                top: var(--y);
                transform: rotate(var(--r));
            }

            @media (hover: hover) {
                .paw:hover {
                    transform: rotate(0deg) scale(3.3);
                    z-index: 10;
                    outline: none;
                }

                .paw:focus,
                .paw:focus-visible {
                    outline: none;
                }
            }
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.7rem, 1.3vw, 0.95rem);
            font-weight: 400;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* Mobiel: zigzagpad dat van onder naar boven loopt */
        @media (max-width: 700px) {
            body {
                min-height: 100vh;
                padding-top: 5rem;
            }

            .paws {
                display: flex;
                flex-direction: column-reverse;
                align-items: center;
                gap: 0;
                padding: 2rem 0 1rem;
            }

            .paw {
                width: 62vw;
                height: 62vw;
                margin-bottom: -4vw;
            }

            .paw:nth-child(odd) {
                align-self: flex-start;
                margin-left: 4vw;
                transform: rotate(-10deg);
            }

            .paw:nth-child(even) {
                align-self: flex-end;
                margin-right: 4vw;
                transform: rotate(10deg);
            }

            .nav-links {
                position: relative;
                left: auto;
                right: auto;
                bottom: auto;
                padding: 1.5rem 0 1rem;
                margin: 0 clamp(0.8rem, 3vw, 1.5rem);
            }

            .nav-link {
                font-size: clamp(0.7rem, 1.3vw, 0.95rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .paw {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>
