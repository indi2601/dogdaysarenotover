<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            /* Formaat van een pootje in rust */
            --paw: clamp(90px, 15vmin, 190px);
        }

        body {
            min-height: 100vh;
            background-color: #faf8f7;
            color: var(--brown);
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
            z-index: 20;
        }

        .editie-badge,
        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Onzichtbare SVG met de pootvormen */
        .defs {
            position: absolute;
            width: 0;
            height: 0;
        }

        .paw {
            width: var(--paw);
            height: var(--paw);
            overflow: visible;
            pointer-events: none;
            transition: transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: fadeIn 0.6s ease-out backwards;
        }

        /* Alleen de pootvorm zelf reageert op de muis */
        .paw image,
        .paw .toes {
            pointer-events: auto;
        }

        .paw .toes {
            fill: var(--brown);
        }

        .paw .outline {
            fill: none;
            stroke: var(--brown);
            stroke-width: 4;
            stroke-linejoin: round;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .paw:nth-child(1) { animation-delay: 0.1s; }
        .paw:nth-child(2) { animation-delay: 0.25s; }
        .paw:nth-child(3) { animation-delay: 0.4s; }
        .paw:nth-child(4) { animation-delay: 0.55s; }
        .paw:nth-child(5) { animation-delay: 0.7s; }
        .paw:nth-child(6) { animation-delay: 0.85s; }
        .paw:nth-child(7) { animation-delay: 1.0s; }
        .paw:nth-child(8) { animation-delay: 1.15s; }

        /* Desktop: pad van pootjes over het scherm, geen scroll */
        @media (min-width: 701px) {
            html,
            body {
                height: 100vh;
                overflow: hidden;
            }

            .paws {
                position: absolute;
                top: 4rem;
                bottom: 3.5rem;
                left: 2vw;
                right: 2vw;
            }

            .paw {
                position: absolute;
                left: var(--x);
                top: var(--y);
                transform: rotate(var(--r)) scale(1);
            }

            @media (hover: hover) {
                .paw:hover {
                    transform: rotate(0deg) scale(3.3);
                    z-index: 10;
                }

                .paw:hover .outline {
                    opacity: 1;
                }
            }
        }

        .nav-links {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Mobiel: pad in zigzag omhoog, pagina scrolt */
        @media (max-width: 700px) {
            .paws {
                display: flex;
                flex-direction: column;
                padding: 3.5rem 0 2rem;
            }

            .paw {
                width: 62vw;
                height: 62vw;
                margin-bottom: -4vw;
            }

            .paw:nth-child(odd) {
                align-self: flex-start;
                margin-left: 4vw;
                transform: rotate(-10deg);
            }

            .paw:nth-child(even) {
                align-self: flex-end;
                margin-right: 4vw;
                transform: rotate(10deg);
            }

            .nav-links {
                position: static;
                padding-top: 1rem;
            }

            .nav-link {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <!-- Alleen het grote kussentje: hier komt de foto in -->
            <clipPath id="pad-clip">
                <path d="M50 48 C30 48 16 66 16 80 C16 92 26 98 38 96 C45 95 55 95 62 96 C74 98 84 92 84 80 C84 66 70 48 50 48 Z"/>
            </clipPath>

            <g id="toes-shape">
                <ellipse cx="12" cy="42" rx="8" ry="11" transform="rotate(-25 12 42)"/>
                <ellipse cx="34" cy="20" rx="9" ry="13" transform="rotate(-8 34 20)"/>
                <ellipse cx="66" cy="20" rx="9" ry="13" transform="rotate(8 66 20)"/>
                <ellipse cx="88" cy="42" rx="8" ry="11" transform="rotate(25 88 42)"/>
            </g>

            <!-- Hele poot voor de outline -->
            <g id="paw-shape">
                <path d="M50 48 C30 48 16 66 16 80 C16 92 26 98 38 96 C45 95 55 95 62 96 C74 98 84 92 84 80 C84 66 70 48 50 48 Z"/>
                <use href="#toes-shape"/>
            </g>
        </defs>
    </svg>

            <use href="#toes-shape" class="toes"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:49%;   --y:54%; --r:68deg;" role="img" aria-label="Dog 5">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8821.jpeg" x="16" y="46" width="68" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
            <use href="#toes-shape" class="toes"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:60.5%; --y:28%; --r:74deg;" role="img" aria-label="Dog 6">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8822.jpeg" x="16" y="46" width="68" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>

        <svg class="paw" viewBox="-6 -6 112 112" style="--x:72%;   --y:50%; --r:80deg;" role="img" aria-label="Dog 7">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8879.jpeg" x="16" y="46" width="68" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
            <use href="#toes-shape" class="toes"/>

        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:83%;   --y:26%; --r:86deg;" role="img" aria-label="Dog 8">

        </svg>
    </main>

    <nav class="nav-links">
        <a href="editie-01.html" class="nav-link">← Edition 01</a>
        <a href="editie-03.html" class="nav-link">Edition 03 →</a>
    </nav>
</body>
</html>
