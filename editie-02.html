<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            /* Formaat van een hartje in rust */
            --heart: clamp(110px, 20vmin, 230px);
        }

        body {
            min-height: 100vh;
            background-color: #faf8f7;
            color: var(--brown);
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
            z-index: 20;
        }

        .editie-badge,
        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Onzichtbare SVG met de hartvorm (clip-path) */
        .defs {
            position: absolute;
            width: 0;
            height: 0;
        }

        /* Desktop: hartjes kriskras over het scherm, geen scroll */
        @media (min-width: 701px) {
            html,
            body {
                height: 100vh;
                overflow: hidden;
            }

            .hearts {
                position: absolute;
                top: 4rem;
                bottom: 3.5rem;
                left: 2vw;
                right: 2vw;
            }

            .heart {
                position: absolute;
                left: var(--x);
                top: var(--y);
                transform: rotate(var(--r)) scale(1);
            }

            @media (hover: hover) {
                .heart:hover {
                    transform: rotate(0deg) scale(2.3);
                    z-index: 10;
                }
            }
        }

        .heart {
            width: var(--heart);
            aspect-ratio: 102 / 94;
            clip-path: url(#heart-clip);
            background: rgba(255, 20, 147, 0.12);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: fadeIn 0.6s ease-out backwards;
        }

        .heart img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .heart:nth-child(1) { animation-delay: 0.1s; }
        .heart:nth-child(2) { animation-delay: 0.15s; }
        .heart:nth-child(3) { animation-delay: 0.2s; }
        .heart:nth-child(4) { animation-delay: 0.25s; }
        .heart:nth-child(5) { animation-delay: 0.3s; }
        .heart:nth-child(6) { animation-delay: 0.35s; }
        .heart:nth-child(7) { animation-delay: 0.4s; }
        .heart:nth-child(8) { animation-delay: 0.45s; }

        .nav-links {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Mobiel: hartjes onder elkaar, pagina scrolt */
        @media (max-width: 700px) {
            .hearts {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.2rem;
                padding: 3.5rem 0 4rem;
            }

            .heart {
                width: 78vw;
                transform: rotate(calc(var(--r) / 2));
            }

            .nav-links {
                position: static;
                padding-top: 1rem;
            }

            .nav-link {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <clipPath id="heart-clip" clipPathUnits="objectBoundingBox">
                <path transform="scale(0.009804 0.010638) translate(1 1)"
                      d="M50 92 L8 50 A29.7 29.7 0 0 1 50 8 A29.7 29.7 0 0 1 92 50 Z"/>
            </clipPath>
        </defs>
    </svg>

    <header>
        <div class="editie-badge">Edition 02</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main class="hearts">
        <div class="heart" style="--x:5%;  --y:16%; --r:-14deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8804.jpeg" alt="Dog 1" loading="lazy"></div>
        <div class="heart" style="--x:24%; --y:48%; --r:10deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8806.jpeg" alt="Dog 2" loading="lazy"></div>
        <div class="heart" style="--x:42%; --y:12%; --r:8deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8817.jpeg" alt="Dog 3" loading="lazy"></div>
        <div class="heart" style="--x:60%; --y:50%; --r:-12deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8818.jpeg" alt="Dog 4" loading="lazy"></div>
        <div class="heart" style="--x:78%; --y:14%; --r:15deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8821.jpeg" alt="Dog 5" loading="lazy"></div>
        <div class="heart" style="--x:8%;  --y:64%; --r:12deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8822.jpeg" alt="Dog 6" loading="lazy"></div>
        <div class="heart" style="--x:42%; --y:66%; --r:-8deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8879.jpeg" alt="Dog 7" loading="lazy"></div>
        <div class="heart" style="--x:80%; --y:62%; --r:-10deg;"><img src="https://indi2601.github.io/dogdaysarenotover/IMG_8819.jpeg" alt="Dog 8" loading="lazy"></div>
    </main>

    <nav class="nav-links">
        <a href="editie-01.html" class="nav-link">← Edition 01</a>
        <a href="editie-03.html" class="nav-link">Edition 03 →</a>
    </nav>
</body>
</html>
