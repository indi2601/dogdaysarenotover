<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --background: #FFFFFF;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        /* Onzichtbare SVG met de pootvorm */
        .defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* Het speelveld: pootjes en foto's worden door het script geplaatst */
        .stage {
            position: relative;
        }

        /* Pootje */
        .paw {
            position: absolute;
            display: block;
            overflow: visible;
            outline: none;
            cursor: pointer;
            opacity: 0;
            animation: stepIn 0.5s ease-out forwards;
        }

        .paw .shape {
            fill: var(--neon);
        }

        .paw .hit {
            fill: transparent;
            pointer-events: all;
        }

        /* Foto: volledig, niet bijgesneden */
        .shot {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .shot img {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }

        .shot.revealed {
            opacity: 1;
        }

        @keyframes stepIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Desktop: geen scroll */
        @media (min-width: 701px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .stage {
                position: absolute;
                top: 1.5rem;
                bottom: 4.5rem;
                left: 3vw;
                right: 3vw;
            }
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* Mobiel: zigzagpad dat van onder naar boven loopt, tik om te onthullen */
        @media (max-width: 700px) {
            .nav-links {
                position: relative;
                left: auto;
                right: auto;
                bottom: auto;
                padding: 1.5rem 0 1.5rem;
                margin: 0 clamp(0.8rem, 3vw, 1.5rem);
            }

            .nav-link {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .paw {
                animation: none;
                opacity: 1;
            }

            .shot {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <g id="paw-shape">
                <path d="M50 44 C28 44 10 64 10 80 C10 93 22 99 36 97 C44 96 56 96 64 97 C78 99 90 93 90 80 C90 64 72 44 50 44 Z"/>
                <ellipse cx="10" cy="38" rx="7.5" ry="10" transform="rotate(-25 10 38)"/>
                <ellipse cx="32" cy="16" rx="8.5" ry="12" transform="rotate(-8 32 16)"/>
                <ellipse cx="68" cy="16" rx="8.5" ry="12" transform="rotate(8 68 16)"/>
                <ellipse cx="90" cy="38" rx="7.5" ry="10" transform="rotate(25 90 38)"/>
            </g>
        </defs>
    </svg>

    <main class="stage" id="stage"></main>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-01.html" class="nav-link">← Edition 01</a>
        <a href="editie-03.html" class="nav-link">Edition 03 →</a>
    </nav>

    <script>
        (function () {
            var BASE = 'https://indi2601.github.io/dogdaysarenotover/';

            // Foto's in de volgorde van het pad (van onder naar boven)
            var FILES = [
                'IMG_8804.jpeg', 'IMG_8806.jpeg', 'IMG_8817.jpeg', 'IMG_8818.jpeg',
                'IMG_8821.jpeg', 'IMG_8822.jpeg', 'IMG_8879.jpeg', 'IMG_8819.jpeg',
                'IMG_8936.jpeg', 'IMG_8942.jpeg', 'IMG_8945.jpeg'
            ];

            var RESET_DELAY = 3500;   // milliseconden tot alles terugspringt naar pootjes
            var N = FILES.length;

            var stage = document.getElementById('stage');
            var paws = [];
            var shots = [];

            FILES.forEach(function (file, i) {
                var shot = document.createElement('figure');
                shot.className = 'shot';
                var img = document.createElement('img');
                img.src = BASE + file;
                img.alt = 'Dog ' + (i + 1);
                shot.appendChild(img);
                stage.appendChild(shot);
                shots.push(shot);

                var svgNS = 'http://www.w3.org/2000/svg';
                var paw = document.createElementNS(svgNS, 'svg');
                paw.setAttribute('class', 'paw');
                paw.setAttribute('viewBox', '-25 -25 150 150');
                paw.setAttribute('tabindex', '0');
                paw.setAttribute('role', 'img');
                paw.setAttribute('aria-label', 'Dog ' + (i + 1));
                paw.style.animationDelay = (0.1 + i * 0.22).toFixed(2) + 's';
                paw.innerHTML =
                    '<rect class="hit" x="-25" y="-25" width="150" height="150"/>' +
                    '<use href="#paw-shape" class="shape"/>';
                stage.appendChild(paw);
                paws.push(paw);
            });

            /* ---------- Plaatsing ---------- */

            function place(el, cx, cy, w, h) {
                el.style.left = (cx - w / 2) + 'px';
                el.style.top = (cy - h / 2) + 'px';
                el.style.width = w + 'px';
                el.style.height = h + 'px';
            }

            function layout() {
                var mobile = window.innerWidth <= 700;
                var W = stage.clientWidth;
                var i, s, p, cx, cy, ang;

                if (mobile) {
                    // Zigzag van onder naar boven; foto aan de andere kant van het pootje
                    var rowH = W * 0.38;
                    var S = W * 0.42;
                    var pawSize = Math.max(34, W * 0.1);
                    var padV = 24;
                    var Hm = N * rowH + padV * 2;
                    stage.style.height = Hm + 'px';

                    for (i = 0; i < N; i++) {
                        var left = (i % 2 === 0);
                        cy = Hm - padV - rowH * (i + 0.5);
                        var pawX = left ? W * 0.2 : W * 0.8;
                        var shotX = left ? W * 0.72 : W * 0.28;
                        ang = left ? 14 : -14;

                        place(paws[i], pawX, cy, pawSize * 1.5, pawSize * 1.5);
                        paws[i].style.transform = 'rotate(' + ang + 'deg)';
                        place(shots[i], shotX, cy, S, S);
                    }
                    return;
                }

                // Desktop: diagonaal pad van linksonder naar rechtsboven
                stage.style.height = '';
                var H = stage.clientHeight;

                var sx = W * 0.10, sy = H * 0.72;
                var ex = W * 0.90, ey = H * 0.30;
                var tx = ex - sx, ty = ey - sy;
                var L = Math.sqrt(tx * tx + ty * ty);
                var ux = tx / L, uy = ty / L;      // looprichting
                var nx = -uy, ny = ux;             // loodrecht, wijst naar rechtsonder

                var size = Math.max(20, Math.min(30, W * 0.02));   // pootgrootte
                var off = size * 0.9;                              // afstand tot de looplijn
                var box = Math.min(W * 0.14, H * 0.2);             // foto-vak
                var dist = (box / 2) * (Math.abs(nx) + Math.abs(ny)) + off + 12;
                var rot = Math.atan2(uy, ux) * 180 / Math.PI + 90;

                for (i = 0; i < N; i++) {
                    p = i / (N - 1);
                    var px = sx + tx * p;
                    var py = sy + ty * p;
                    s = (i % 2 === 0) ? -1 : 1;    // even: links boven, oneven: rechts onder

                    cx = px + nx * s * off;
                    cy = py + ny * s * off;
                    place(paws[i], cx, cy, size * 1.5, size * 1.5);
                    paws[i].style.transform = 'rotate(' + rot.toFixed(1) + 'deg)';

                    var fx = px + nx * s * dist;
                    var fy = py + ny * s * dist;
                    fx = Math.max(box / 2 + 6, Math.min(W - box / 2 - 6, fx));
                    fy = Math.max(box / 2 + 6, Math.min(H - box / 2 - 6, fy));
                    place(shots[i], fx, fy, box, box);
                }
            }

            /* ---------- Onthullen ---------- */

            var shown = 0;
            var locked = false;

            function reveal(i) {
                if (locked || shots[i].classList.contains('revealed')) return;
                shots[i].classList.add('revealed');
                shown++;
                if (shown === N) {
                    locked = true;
                    setTimeout(reset, RESET_DELAY);
                }
            }

            function reset() {
                shots.forEach(function (s) { s.classList.remove('revealed'); });
                shown = 0;
                locked = false;
            }

            paws.forEach(function (paw, i) {
                paw.addEventListener('pointerover', function () { reveal(i); });
                paw.addEventListener('focus', function () { reveal(i); });
                paw.addEventListener('click', function () { reveal(i); });
            });

            layout();

            var t = 0;
            window.addEventListener('resize', function () {
                clearTimeout(t);
                t = setTimeout(layout, 80);
            });

            // Mobiel: begin onderaan, waar het pad begint
            if (window.innerWidth <= 700) {
                window.addEventListener('load', function () {
                    window.scrollTo(0, document.documentElement.scrollHeight);
                });
            }
        })();
    </script>
</body>
</html>
