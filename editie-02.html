<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --gap: clamp(0.8rem, 2vw, 1.5rem);
            --brown: #6b4423;
        }

        body {
            min-height: 100vh;
            background-color: #faf8f7;
            color: var(--brown);
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
        }

        .editie-badge,
        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            min-height: calc(100vh - 2 * clamp(0.8rem, 3vw, 2rem));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 0;
        }

        /* Desktop: 2 rijen van 4 foto's */
        .photo-grid {
            display: flex;
            flex-direction: column;
            gap: var(--gap);
            width: 90vw;
            max-width: 1200px;
        }

        .photo-row {
            display: flex;
            gap: var(--gap);
            /* hoogte = breedte van één vierkante foto in rust */
            height: calc((min(90vw, 1200px) - 3 * var(--gap)) / 4);
        }

        .photo {
            flex: 1 1 0;
            min-width: 0;
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.1) 0%, rgba(255, 20, 147, 0.05) 100%);
            border: 2px solid var(--brown);
            border-radius: 4px;
            overflow: hidden;
            transition: flex-grow 0.4s ease;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Hover: foto groeit, de rest wordt opzij geduwd (alleen met muis) */
        @media (hover: hover) and (min-width: 901px) {
            .photo:hover {
                flex-grow: 2;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .photo {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .photo:nth-child(1) { animation-delay: 0.1s; }
        .photo:nth-child(2) { animation-delay: 0.15s; }
        .photo:nth-child(3) { animation-delay: 0.2s; }
        .photo:nth-child(4) { animation-delay: 0.25s; }

        .nav-links {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
        }

        .nav-link {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Tablet: 2 kolommen, 4 rijen */
        @media (max-width: 900px) {
            .photo-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: var(--gap);
                max-width: 600px;
            }

            .photo-row {
                display: contents;
            }

            .photo {
                aspect-ratio: 1;
            }
        }

        /* Mobiel: kleinere tussenruimte */
        @media (max-width: 500px) {
            .photo-grid {
                gap: clamp(0.5rem, 1vw, 1rem);
                width: 92vw;
            }

            main {
                padding: 3.5rem 0 4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 02</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="photo-grid">
            <div class="photo-row">
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/04fe8f9de2676820da3e58e1112ad91993f8e493/IMG_8804.HEIC" alt="Hond 1" loading="lazy"></div>
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8806.heic" alt="Hond 2" loading="lazy"></div>
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8817.heic" alt="Hond 3" loading="lazy"></div>
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8818.heic" alt="Hond 4" loading="lazy"></div>
            </div>
            <div class="photo-row">
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8819.heic" alt="Hond 5" loading="lazy"></div>
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8879.heic" alt="Hond 6" loading="lazy"></div>
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8822.HEIC" alt="Hond 7" loading="lazy"></div>
                <div class="photo"><img src="https://raw.githubusercontent.com/indi2601/dogdaysarenotover/refs/heads/main/IMG_8821.heic" alt="Hond 8" loading="lazy"></div>
            </div>
        </div>
    </main>

    <nav class="nav-links">
        <a href="editie-01.html" class="nav-link">← Editie 01</a>
        <a href="editie-03.html" class="nav-link">Editie 03 →</a>
    </nav>
</body>
</html>
