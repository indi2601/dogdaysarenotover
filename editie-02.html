<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --background: #FFFFFF;
            /* Formaat van één vak: past altijd in 4 kolommen x 3 rijen zonder scrollen */
            --S: min(calc(94vw / 4), calc((100vh - 6rem) / 3));
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        /* Onzichtbare SVG met de pootvormen */
        .defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* Een vak per pootje */
        .slot {
            position: relative;
            display: grid;
            place-items: center;
        }

        .paw {
            --tx: var(--dx, 0);
            --ty: var(--dy, 0);
            --tr: var(--dr, 0deg);

            display: block;
            width: var(--S);
            height: var(--S);
            overflow: visible;
            pointer-events: none;
            outline: none;
            transform-origin: center;
            transform:
                translate(calc(var(--tx) * var(--S)), calc(var(--ty) * var(--S)))
                rotate(var(--tr))
                scale(0.6);
            transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: fadeIn 0.6s ease-out backwards;
        }

        /* Alleen de pootvorm zelf reageert op de muis */
        .paw .pad,
        .paw .toes,
        .paw .photo {
            pointer-events: auto;
        }

        .paw .pad,
        .paw .toes {
            fill: var(--neon);
        }

        .paw .photo {
            opacity: 0;
            transition: opacity 0.45s ease;
        }

        /* Onthuld: foto blijft staan, pootje draait recht en wordt groter */
        .paw.revealed {
            transform: translate(0, 0) rotate(0deg) scale(0.96);
        }

        .paw.revealed .photo {
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .slot:nth-child(1)  .paw { animation-delay: 0.1s; }
        .slot:nth-child(2)  .paw { animation-delay: 0.3s; }
        .slot:nth-child(3)  .paw { animation-delay: 0.5s; }
        .slot:nth-child(4)  .paw { animation-delay: 0.7s; }
        .slot:nth-child(5)  .paw { animation-delay: 0.9s; }
        .slot:nth-child(6)  .paw { animation-delay: 1.1s; }
        .slot:nth-child(7)  .paw { animation-delay: 1.3s; }
        .slot:nth-child(8)  .paw { animation-delay: 1.5s; }
        .slot:nth-child(9)  .paw { animation-delay: 1.7s; }
        .slot:nth-child(10) .paw { animation-delay: 1.9s; }
        .slot:nth-child(11) .paw { animation-delay: 2.1s; }

        /* Desktop: pad over het scherm, geen scroll */
        @media (min-width: 701px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .trail {
                position: absolute;
                top: 1.5rem;
                bottom: 4.5rem;
                left: 3vw;
                right: 3vw;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* Mobiel: zigzagpad dat van onder naar boven loopt, tik om te onthullen */
        @media (max-width: 700px) {
            :root {
                --S: 68vw;
            }

            .trail {
                display: flex;
                flex-direction: column-reverse;
                padding: 1.5rem 0 0.5rem;
            }

            .slot {
                width: 100%;
                height: var(--S);
            }

            .slot:nth-child(odd) .paw {
                --tx: -0.2;
                --ty: 0;
                --tr: -12deg;
            }

            .slot:nth-child(even) .paw {
                --tx: 0.2;
                --ty: 0;
                --tr: 12deg;
            }

            .nav-links {
                position: relative;
                left: auto;
                right: auto;
                bottom: auto;
                padding: 1.5rem 0 1.5rem;
                margin: 0 clamp(0.8rem, 3vw, 1.5rem);
            }

            .nav-link {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .paw,
            .paw .photo {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <clipPath id="pad-clip">
                <path d="M50 44 C28 44 10 64 10 80 C10 93 22 99 36 97 C44 96 56 96 64 97 C78 99 90 93 90 80 C90 64 72 44 50 44 Z"/>
            </clipPath>

            <path id="pad-shape" d="M50 44 C28 44 10 64 10 80 C10 93 22 99 36 97 C44 96 56 96 64 97 C78 99 90 93 90 80 C90 64 72 44 50 44 Z"/>

            <g id="toes-shape">
                <ellipse cx="10" cy="38" rx="7.5" ry="10" transform="rotate(-25 10 38)"/>
                <ellipse cx="32" cy="16" rx="8.5" ry="12" transform="rotate(-8 32 16)"/>
                <ellipse cx="68" cy="16" rx="8.5" ry="12" transform="rotate(8 68 16)"/>
                <ellipse cx="90" cy="38" rx="7.5" ry="10" transform="rotate(25 90 38)"/>
            </g>
        </defs>
    </svg>

    <!-- Het pad: pootje 1 staat onderaan, pootje 11 bovenaan.
         dx / dy = verschuiving naast de looplijn (in vakgroottes), dr = looprichting -->
    <main class="trail">
        <!-- Onderste rij: van links naar rechts -->
        <div class="slot" style="grid-column:1; grid-row:3; --dx:0.02; --dy:0.14; --dr:68deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 1">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8804.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:2; grid-row:3; --dx:0; --dy:-0.1; --dr:84deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 2">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8806.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:3; grid-row:3; --dx:0.02; --dy:0.1; --dr:96deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 3">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8817.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:4; grid-row:3; --dx:-0.04; --dy:-0.06; --dr:50deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 4">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8818.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>

        <!-- Middelste rij: van rechts naar links -->
        <div class="slot" style="grid-column:4; grid-row:2; --dx:0.04; --dy:0.06; --dr:-32deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 5">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8821.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:3; grid-row:2; --dx:0; --dy:-0.12; --dr:-82deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 6">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8822.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:2; grid-row:2; --dx:-0.02; --dy:0.1; --dr:-96deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 7">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8879.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:1; grid-row:2; --dx:0; --dy:-0.1; --dr:-70deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 8">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8819.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>

        <!-- Bovenste rij: weer van links naar rechts -->
        <div class="slot" style="grid-column:1; grid-row:1; --dx:0.02; --dy:0.08; --dr:24deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 9">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8936.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:2; grid-row:1; --dx:0; --dy:-0.1; --dr:84deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 10">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8942.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
        <div class="slot" style="grid-column:3; grid-row:1; --dx:0.02; --dy:0.1; --dr:96deg;">
            <svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog 11">
                <use href="#pad-shape" class="pad"/>
                <image class="photo" href="https://indi2601.github.io/dogdaysarenotover/IMG_8945.jpeg" x="10" y="44" width="80" height="54" preserveAspectRatio="xMidYMid slice" clip-path="url(#pad-clip)"/>
                <use href="#toes-shape" class="toes"/>
            </svg>
        </div>
    </main>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-01.html" class="nav-link">← Edition 01</a>
        <a href="editie-03.html" class="nav-link">Edition 03 →</a>
    </nav>

    <script>
        (function () {
            var paws = Array.prototype.slice.call(document.querySelectorAll('.paw'));
            var RESET_DELAY = 3500;   // milliseconden tot alles terugspringt naar pootjes
            var shown = 0;
            var locked = false;

            function reveal(p) {
                if (locked || p.classList.contains('revealed')) return;
                p.classList.add('revealed');
                shown++;
                if (shown === paws.length) {
                    locked = true;
                    setTimeout(reset, RESET_DELAY);
                }
            }

            function reset() {
                paws.forEach(function (p) { p.classList.remove('revealed'); });
                shown = 0;
                locked = false;
            }

            paws.forEach(function (p) {
                p.addEventListener('pointerover', function () { reveal(p); });
                p.addEventListener('focus', function () { reveal(p); });
                p.addEventListener('click', function () { reveal(p); });
            });

            // Mobiel: begin onderaan, waar het pad begint
            if (window.matchMedia('(max-width: 700px)').matches) {
                window.addEventListener('load', function () {
                    window.scrollTo(0, document.documentElement.scrollHeight);
                });
            }
        })();
    </script>
</body>
</html>
