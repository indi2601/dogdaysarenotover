<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 02</title>
    <style>
        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #faf8f7;
            font-family: 'Neue Haas Grotesk', sans-serif;
            color: #6b4423;
        }

        body {
            position: relative;
            padding: 1.2rem;
        }

        header {
            position: absolute;
            top: 1.2rem;
            left: 1.2rem;
            display: flex;
            align-items: baseline;
            gap: 0.8rem;
            z-index: 2;
        }

        .editie-badge {
            font-size: 0.9rem;
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .site-name {
            font-size: 0.9rem;
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 2rem;
        }

        .gallery {
            width: 100%;
            height: calc(100% - 2rem);
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.6rem;
            max-width: 90vw;
            max-height: 90vh;
        }

        .photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 2px;
            box-shadow: none;
            border: none;
            overflow: hidden;
        }

        .nav {
            position: absolute;
            left: 1.2rem;
            bottom: 1.2rem;
            z-index: 2;
        }

        .nav a {
            color: #ff1493;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 400;
            margin-right: 2rem;
        }

        .nav a:last-child {
            margin-right: 0;
        }

        @media (max-width: 640px) {
            body {
                padding: 0.8rem;
            }

            header {
                top: 0.8rem;
                left: 0.8rem;
                gap: 0.4rem;
            }

            .editie-badge, .site-name {
                font-size: 0.72rem;
                letter-spacing: 0.08em;
            }

            main {
                padding-top: 1.5rem;
            }

            .gallery {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 0.4rem;
                max-width: 100%;
                max-height: 100%;
            }

            .nav {
                left: 0.8rem;
                bottom: 0.8rem;
            }

            .nav a {
                font-size: 0.75rem;
                margin-right: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 02</div>
        <div class="site-name">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="gallery">
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/a0b0e0a0-0b0b-0c0c-0d0d-0e0e0f0f0g0g');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/b1b1b1b1-1c1c-1d1d-1e1e-1f1f1g1g1h1h');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/c2c2c2c2-2d2d-2e2e-2f2f-2g2g2h2h2i2i');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/d3d3d3d3-3e3e-3f3f-3g3g-3h3h3i3i3j3j');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/a0b0e0a0-0b0b-0c0c-0d0d-0e0e0f0f0g0g');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/b1b1b1b1-1c1c-1d1d-1e1e-1f1f1g1g1h1h');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/c2c2c2c2-2d2d-2e2e-2f2f-2g2g2h2h2i2i');"></div>
            <div class="photo" style="background-image: url('https://images.githubusercontent.com/user-attachments/assets/d3d3d3d3-3e3e-3f3f-3g3g-3h3h3i3i3j3j');"></div>
        </div>
    </main>

    <div class="nav">
        <a href="editie-01.html">← Editie 01</a>
        <a href="editie-03.html">Editie 03 →</a>
    </div>
</body>
</html>
