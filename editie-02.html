<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            min-height: 100vh;
            background-color: #faf8f7;
            color: #6b4423;
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
        }

        .editie-badge {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            min-height: calc(100vh - 2 * clamp(0.8rem, 3vw, 2rem));
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 0;
        }

        /* Desktop: 4 foto's naast elkaar, 2 rijen */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: clamp(0.8rem, 2vw, 1.5rem);
            width: 90vw;
            max-width: 1200px;
        }

        .photo {
            aspect-ratio: 1;
            background: linear-gradient(135deg, rgba(255, 20, 147, 0.1) 0%, rgba(255, 20, 147, 0.05) 100%);
            border: 2px solid #d4a5a5;
            border-radius: clamp(0.5rem, 1vw, 1rem);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .photo {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .photo:nth-child(1) { animation-delay: 0.1s; }
        .photo:nth-child(2) { animation-delay: 0.15s; }
        .photo:nth-child(3) { animation-delay: 0.2s; }
        .photo:nth-child(4) { animation-delay: 0.25s; }
        .photo:nth-child(5) { animation-delay: 0.3s; }
        .photo:nth-child(6) { animation-delay: 0.35s; }
        .photo:nth-child(7) { animation-delay: 0.4s; }
        .photo:nth-child(8) { animation-delay: 0.45s; }

        footer {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: #6b4423;
            opacity: 0.6;
        }

        .nav-links {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
        }

        .nav-link {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Tablet: 2 kolommen, 4 rijen */
        @media (max-width: 900px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
                max-width: 600px;
            }
        }

        /* Mobiel: 2 kolommen, kleinere tussenruimte */
        @media (max-width: 500px) {
            .photo-grid {
                gap: clamp(0.5rem, 1vw, 1rem);
                width: 92vw;
            }

            main {
                padding: 3.5rem 0 4rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 02</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="photo-grid">
            <div class="photo"></div>
            <div class="photo"></div>
            <div class="photo"></div>
            <div class="photo"></div>
            <div class="photo"></div>
            <div class="photo"></div>
            <div class="photo"></div>
            <div class="photo"></div>
        </div>
    </main>

    <footer>
        Editie 02/2026
    </footer>

    <nav class="nav-links">
        <a href="editie-01.html" class="nav-link">← Editie 01</a>
        <a href="editie-03.html" class="nav-link">Editie 03 →</a>
    </nav>
</body>
</html>
