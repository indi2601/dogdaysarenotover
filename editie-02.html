<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 02</title>
    <style>
        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #faf8f7;
            font-family: 'Neue Haas Grotesk', sans-serif;
            color: #6b4423;
        }

        body {
            position: relative;
            padding: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        main {
            width: 100%;
            height: calc(100% - 2.4rem);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.6rem;
            max-width: 800px;
            max-height: 880px;
        }

        .photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            border-radius: 0;
            box-shadow: none;
            border: none;
        }

        .nav {
            position: absolute;
            left: 1.2rem;
            bottom: 1.2rem;
            z-index: 2;
        }

        .nav a {
            color: #ff1493;
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 400;
            margin-right: 2rem;
        }

        @media (max-width: 640px) {
            body {
                padding: 0.8rem;
            }

            .gallery {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 0.4rem;
                max-width: 100%;
                max-height: 100%;
            }

            .nav {
                left: 0.8rem;
                bottom: 0.8rem;
            }

            .nav a {
                font-size: 0.75rem;
                margin-right: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="gallery">
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1517849845537-4d257902454a?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1537151625747-768eb6cf92b2?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1587300003388-59208cc962cb?auto=format&fit=crop&w=900&q=80');"></div>
            <div class="photo" style="background-image: url('https://images.unsplash.com/photo-1548199973-03cce0bbc87b?auto=format&fit=crop&w=900&q=80');"></div>
        </div>
    </main>

    <div class="nav">
        <a href="editie-01.html">← Editie 01</a>
    </div>
</body>
</html>
