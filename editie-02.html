<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --background: #FFFFFF;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        /* Onzichtbare SVG met de pootvormen */
        .defs {
            position: absolute;
            width: 0;
            height: 0;
            overflow: hidden;
        }

        /* Een vak per pootje en per foto: foto's blijven binnen hun eigen vak */
        .slot {
            position: relative;
        }

        /* Pootje */
        .paw {
            --ox: var(--dx, 0);
            --oy: var(--dy, 0);
            --or: var(--dr, 0deg);
            --s: 1;

            position: absolute;
            left: 50%;
            top: 50%;
            width: 40%;
            aspect-ratio: 1;
            overflow: visible;
            outline: none;
            cursor: pointer;
            transform:
                translate(calc(-50% + var(--ox) * 100%), calc(-50% + var(--oy) * 100%))
                rotate(var(--or))
                scale(var(--s));
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s ease;
            animation: stepIn 0.5s ease-out backwards;
        }

        .paw .shape {
            fill: var(--neon);
        }

        .paw .hit {
            fill: transparent;
            pointer-events: all;
        }

        /* Foto */
        .shot {
            position: absolute;
            inset: 5% 6%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .shot img {
            display: block;
            flex: 0 1 auto;
            min-height: 0;
            max-width: 100%;
            max-height: calc(100% - 1.2rem);
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .shot figcaption {
            font-size: 0.62rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--neon);
            line-height: 1;
        }

        /* Onthuld: foto blijft staan, pootje verdwijnt */
        .slot.revealed .paw {
            --s: 0.5;
            opacity: 0;
            pointer-events: none;
        }

        .slot.revealed .shot {
            opacity: 1;
        }

        @keyframes stepIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* Desktop: pad over het scherm, geen scroll */
        @media (min-width: 701px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .trail {
                position: absolute;
                top: 1.5rem;
                bottom: 4.5rem;
                left: 3vw;
                right: 3vw;
                display: grid;
                grid-template-columns: repeat(5, 1fr);
                grid-template-rows: repeat(3, 1fr);
            }
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* Mobiel: zigzagpad dat van onder naar boven loopt, tik om te onthullen */
        @media (max-width: 700px) {
            .trail {
                display: flex;
                flex-direction: column-reverse;
                padding: 1.5rem 0 0.5rem;
            }

            .slot {
                width: 100%;
                height: 92vw;
            }

            .paw {
                width: 26vw;
            }

            .slot:nth-child(odd) .paw {
                --ox: -0.9;
                --oy: 0;
                --or: -14deg;
            }

            .slot:nth-child(even) .paw {
                --ox: 0.9;
                --oy: 0;
                --or: 14deg;
            }

            .shot {
                inset: 4% 8%;
            }

            .nav-links {
                position: relative;
                left: auto;
                right: auto;
                bottom: auto;
                padding: 1.5rem 0 1.5rem;
                margin: 0 clamp(0.8rem, 3vw, 1.5rem);
            }

            .nav-link {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .paw,
            .shot {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <g id="paw-shape">
                <path d="M50 44 C28 44 10 64 10 80 C10 93 22 99 36 97 C44 96 56 96 64 97 C78 99 90 93 90 80 C90 64 72 44 50 44 Z"/>
                <ellipse cx="10" cy="38" rx="7.5" ry="10" transform="rotate(-25 10 38)"/>
                <ellipse cx="32" cy="16" rx="8.5" ry="12" transform="rotate(-8 32 16)"/>
                <ellipse cx="68" cy="16" rx="8.5" ry="12" transform="rotate(8 68 16)"/>
                <ellipse cx="90" cy="38" rx="7.5" ry="10" transform="rotate(25 90 38)"/>
            </g>
        </defs>
    </svg>

    <main class="trail" id="trail"></main>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-01.html" class="nav-link">← Edition 01</a>
        <a href="editie-03.html" class="nav-link">Edition 03 →</a>
    </nav>

    <script>
        (function () {
            var BASE = 'https://indi2601.github.io/dogdaysarenotover/';

            // Het pad, van onder (1) naar boven (11).
            // [kolom, rij, bestand]  in een raster van 5 kolommen x 3 rijen (rij 3 = onderaan)
            var PATH = [
                [1, 3, 'IMG_8804.jpeg'],
                [2, 3, 'IMG_8806.jpeg'],
                [3, 3, 'IMG_8817.jpeg'],
                [4, 3, 'IMG_8818.jpeg'],
                [5, 2, 'IMG_8821.jpeg'],
                [4, 2, 'IMG_8822.jpeg'],
                [3, 2, 'IMG_8879.jpeg'],
                [2, 2, 'IMG_8819.jpeg'],
                [1, 1, 'IMG_8936.jpeg'],
                [2, 1, 'IMG_8942.jpeg'],
                [3, 1, 'IMG_8945.jpeg']
            ];

            var RESET_DELAY = 3500;   // milliseconden tot alles terugspringt naar pootjes
            var SIDE = 0.55;          // hoe ver een pootje naast de looplijn staat (in pootbreedtes)

            var trail = document.getElementById('trail');
            var slots = [];

            PATH.forEach(function (step, i) {
                // Looprichting: naar het volgende pootje (het laatste volgt de vorige richting)
                var a = PATH[i];
                var b = PATH[i + 1] || null;
                var p = PATH[i - 1] || null;
                var dx, dy;

                if (b) { dx = b[0] - a[0]; dy = b[1] - a[1]; }
                else   { dx = a[0] - p[0]; dy = a[1] - p[1]; }

                var len = Math.sqrt(dx * dx + dy * dy) || 1;
                dx /= len;
                dy /= len;

                // Pootje wijst in de looprichting (tenen omhoog = 0 graden)
                var rot = Math.atan2(dy, dx) * 180 / Math.PI + 90;

                // Links en rechts van de looplijn, om en om
                var side = (i % 2 === 0) ? 1 : -1;
                var ox = -dy * side * SIDE;
                var oy = dx * side * SIDE;

                var num = (i + 1 < 10 ? '0' : '') + (i + 1);

                var slot = document.createElement('div');
                slot.className = 'slot';
                slot.style.gridColumn = step[0];
                slot.style.gridRow = step[1];
                slot.style.setProperty('--dx', ox.toFixed(3));
                slot.style.setProperty('--dy', oy.toFixed(3));
                slot.style.setProperty('--dr', rot.toFixed(1) + 'deg');

                slot.innerHTML =
                    '<figure class="shot">' +
                        '<img src="' + BASE + step[2] + '" alt="Dog ' + (i + 1) + '">' +
                        '<figcaption>No. ' + num + '</figcaption>' +
                    '</figure>' +
                    '<svg class="paw" viewBox="0 0 100 100" tabindex="0" role="img" aria-label="Dog ' + (i + 1) + '" style="animation-delay:' + (0.1 + i * 0.22).toFixed(2) + 's">' +
                        '<rect class="hit" x="0" y="0" width="100" height="100"/>' +
                        '<use href="#paw-shape" class="shape"/>' +
                    '</svg>';

                trail.appendChild(slot);
                slots.push(slot);
            });

            var shown = 0;
            var locked = false;

            function reveal(slot) {
                if (locked || slot.classList.contains('revealed')) return;
                slot.classList.add('revealed');
                shown++;
                if (shown === slots.length) {
                    locked = true;
                    setTimeout(reset, RESET_DELAY);
                }
            }

            function reset() {
                slots.forEach(function (s) { s.classList.remove('revealed'); });
                shown = 0;
                locked = false;
            }

            slots.forEach(function (slot) {
                var paw = slot.querySelector('.paw');
                paw.addEventListener('pointerover', function () { reveal(slot); });
                paw.addEventListener('focus', function () { reveal(slot); });
                paw.addEventListener('click', function () { reveal(slot); });
            });

            // Mobiel: begin onderaan, waar het pad begint
            if (window.matchMedia('(max-width: 700px)').matches) {
                window.addEventListener('load', function () {
                    window.scrollTo(0, document.documentElement.scrollHeight);
                });
            }
        })();
    </script>
</body>
</html>
