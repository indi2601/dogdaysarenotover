<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 02</title>
    <style>
        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #faf8f7;
            color: #6b4423;
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
            z-index: 10;
        }

        .editie-badge {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 3rem;
        }

        .gallery {
            width: 100%;
            max-width: 90vw;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 0.6rem;
            aspect-ratio: 1 / 2;
            max-height: 70vh;
        }

        .photo {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 2px;
            overflow: hidden;
            display: block;
        }

        .nav-link {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            margin-right: 2rem;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        footer {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: #6b4423;
            opacity: 0.6;
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(2, 1fr);
                gap: 0.4rem;
                aspect-ratio: 2 / 1;
            }

            main {
                padding-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 02</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="gallery">
            <div class="photo" style="background-image: linear-gradient(135deg, #e8a8a8 0%, #d48888 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #d9b5b5 0%, #c99595 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #e8a8a8 0%, #d48888 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #d9b5b5 0%, #c99595 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #d9b5b5 0%, #c99595 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #e8a8a8 0%, #d48888 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #d9b5b5 0%, #c99595 100%);"></div>
            <div class="photo" style="background-image: linear-gradient(135deg, #e8a8a8 0%, #d48888 100%);"></div>
        </div>
    </main>

    <footer>
        Editie 02/2026
    </footer>

    <a href="editie-01.html" class="nav-link">← Editie 01</a>
    <a href="editie-03.html" class="nav-link" style="left: auto; right: clamp(0.8rem, 2vw, 1.5rem);">Editie 03 →</a>
</body>
</html>
