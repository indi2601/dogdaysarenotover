<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 02</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            /* Formaat van een pootje in rust */
            --paw: clamp(120px, 23vmin, 260px);
        }

        body {
            min-height: 100vh;
            background-color: #faf8f7;
            color: var(--brown);
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            position: relative;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
            z-index: 20;
        }

        .editie-badge,
        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        /* Onzichtbare SVG met de pootvorm */
        .defs {
            position: absolute;
            width: 0;
            height: 0;
        }

        .paw {
            width: var(--paw);
            height: var(--paw);
            overflow: visible;
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: fadeIn 0.6s ease-out backwards;
        }

        /* Alleen de pootvorm zelf reageert op de muis */
        .paw image {
            pointer-events: auto;
        }

        .paw .outline {
            fill: none;
            stroke: var(--neon);
            stroke-width: 3.5;
            stroke-linejoin: round;
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .paw:nth-child(1) { animation-delay: 0.1s; }
        .paw:nth-child(2) { animation-delay: 0.15s; }
        .paw:nth-child(3) { animation-delay: 0.2s; }
        .paw:nth-child(4) { animation-delay: 0.25s; }
        .paw:nth-child(5) { animation-delay: 0.3s; }
        .paw:nth-child(6) { animation-delay: 0.35s; }
        .paw:nth-child(7) { animation-delay: 0.4s; }
        .paw:nth-child(8) { animation-delay: 0.45s; }

        /* Desktop: pootjes kriskras over het scherm, geen scroll */
        @media (min-width: 701px) {
            html,
            body {
                height: 100vh;
                overflow: hidden;
            }

            .paws {
                position: absolute;
                top: 4rem;
                bottom: 3.5rem;
                left: 2vw;
                right: 2vw;
            }

            .paw {
                position: absolute;
                left: var(--x);
                top: var(--y);
                transform: rotate(var(--r)) scale(1);
            }

            @media (hover: hover) {
                .paw:hover {
                    transform: rotate(0deg) scale(2.3);
                    z-index: 10;
                }

                .paw:hover .outline {
                    opacity: 1;
                }
            }
        }

        .nav-links {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
            z-index: 20;
        }

        .nav-link {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Mobiel: pootjes onder elkaar, pagina scrolt */
        @media (max-width: 700px) {
            .paws {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                padding: 3.5rem 0 4rem;
            }

            .paw {
                width: 80vw;
                height: 80vw;
                transform: rotate(calc(var(--r) / 2));
            }

            .nav-links {
                position: static;
                padding-top: 1rem;
            }

            .nav-link {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <!-- Pootvorm om foto's mee uit te knippen -->
            <clipPath id="paw-clip">
                <path d="M50 46 C33 46 21 60 21 73 C21 84 30 90 40 88 C46 87 54 87 60 88 C70 90 79 84 79 73 C79 60 67 46 50 46 Z"/>
                <ellipse cx="14" cy="46" rx="9" ry="13" transform="rotate(-28 14 46)"/>
                <ellipse cx="36" cy="20" rx="10" ry="14" transform="rotate(-9 36 20)"/>
                <ellipse cx="64" cy="20" rx="10" ry="14" transform="rotate(9 64 20)"/>
                <ellipse cx="86" cy="46" rx="9" ry="13" transform="rotate(28 86 46)"/>
            </clipPath>

            <!-- Zelfde vorm voor de outline -->
            <g id="paw-shape">
                <path d="M50 46 C33 46 21 60 21 73 C21 84 30 90 40 88 C46 87 54 87 60 88 C70 90 79 84 79 73 C79 60 67 46 50 46 Z"/>
                <ellipse cx="14" cy="46" rx="9" ry="13" transform="rotate(-28 14 46)"/>
                <ellipse cx="36" cy="20" rx="10" ry="14" transform="rotate(-9 36 20)"/>
                <ellipse cx="64" cy="20" rx="10" ry="14" transform="rotate(9 64 20)"/>
                <ellipse cx="86" cy="46" rx="9" ry="13" transform="rotate(28 86 46)"/>
            </g>
        </defs>
    </svg>

    <header>
        <div class="editie-badge">Edition 02</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main class="paws">
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:5%;  --y:14%; --r:-14deg;" role="img" aria-label="Dog 1">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8804.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:24%; --y:48%; --r:10deg;" role="img" aria-label="Dog 2">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8806.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:42%; --y:10%; --r:8deg;" role="img" aria-label="Dog 3">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8817.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:60%; --y:48%; --r:-12deg;" role="img" aria-label="Dog 4">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8818.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:78%; --y:12%; --r:15deg;" role="img" aria-label="Dog 5">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8821.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:6%;  --y:60%; --r:12deg;" role="img" aria-label="Dog 6">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8822.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:42%; --y:62%; --r:-8deg;" role="img" aria-label="Dog 7">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8879.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
        <svg class="paw" viewBox="-6 -6 112 112" style="--x:78%; --y:60%; --r:-10deg;" role="img" aria-label="Dog 8">
            <image href="https://indi2601.github.io/dogdaysarenotover/IMG_8819.jpeg" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#paw-clip)"/>
            <use href="#paw-shape" class="outline"/>
        </svg>
    </main>

    <nav class="nav-links">
        <a href="editie-01.html" class="nav-link">← Edition 01</a>
        <a href="editie-03.html" class="nav-link">Edition 03 →</a>
    </nav>
</body>
</html>
