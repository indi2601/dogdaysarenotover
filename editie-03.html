<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 03</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #faf8f7;
            color: #6b4423;
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
        }

        .editie-badge {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .content {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            line-height: 1.4;
            color: #6b4423;
            font-weight: 400;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.85;
            max-width: 85vw;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .content {
            animation: fadeIn 0.8s ease-out 0.2s backwards;
        }

        footer {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: #6b4423;
            opacity: 0.6;
        }

        .nav-link {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .content {
                font-size: clamp(1rem, 3vw, 1.8rem);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 03</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="content">Volgende editie komt eraan</div>
    </main>

    <footer>
        Editie 03/2026
    </footer>

    <a href="editie-02.html" class="nav-link">← Editie 02</a>
</body>
</html>
