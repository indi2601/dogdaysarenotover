
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dog Days Are Not Over — Edition 03</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --brown: #6b4423;
      --turquoise: #50F6D8;
      --bg: #FFFFFF;
      --border: rgba(107, 68, 35, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      color: var(--brown);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      position: relative;
    }

    a {
      color: var(--turquoise);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    a:hover {
      opacity: 0.65;
    }

    .page {
      display: grid;
      grid-template-columns: minmax(180px, 0.8fr) minmax(300px, 1.6fr) minmax(220px, 0.9fr);
      width: 100%;
      height: 100dvh;
      padding: 24px;
      gap: 24px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      padding-bottom: 48px;
    }

    .page-title {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 3.4rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .edition-label {
      margin-top: 12px;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .map-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      background: #f7f7f5;
      border: 1px solid var(--border);
    }

    #map {
      width: 100%;
      height: 100%;
      background: #f7f7f5;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      padding-bottom: 48px;
    }

    .location-counter {
      margin: 0 0 20px;
      font-size: clamp(2.5rem, 5vw, 5rem);
      line-height: 0.9;
      letter-spacing: -0.07em;
      font-weight: 400;
    }

    .location-category {
      margin-bottom: 12px;
      color: var(--brown);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .location-name {
      margin: 0 0 16px;
      font-size: clamp(1.5rem, 2.3vw, 2.7rem);
      font-weight: 400;
      line-height: 0.98;
      letter-spacing: -0.05em;
      overflow-wrap: anywhere;
    }

    .location-description {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.5;
      max-width: 34ch;
    }

    .location-address {
      margin-top: 16px;
      font-size: 0.75rem;
      line-height: 1.4;
      opacity: 0.7;
    }

    .location-navigation {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 24px;
    }

    .arrow-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--turquoise);
      border-radius: 50%;
      background: white;
      color: var(--turquoise);
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .arrow-button:hover,
    .arrow-button:focus-visible {
      background: var(--turquoise);
      color: white;
      outline: none;
    }

    .navigation-count {
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }

    .page-link {
      position: fixed;
      bottom: 20px;
      z-index: 1000;
      color: var(--turquoise);
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .page-link.previous {
      left: 24px;
    }

    .page-link.next {
      right: 24px;
    }

    .dog-marker {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px !important;
      height: 32px !important;
      border: 2px solid var(--turquoise);
      border-radius: 50%;
      background: #FFFFFF;
      color: var(--turquoise);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      cursor: pointer;
      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease;
    }

    .dog-marker:hover,
    .dog-marker.active {
      border-color: var(--turquoise);
      background: var(--turquoise);
      color: #FFFFFF;
      transform: scale(1.15);
    }

    .leaflet-container {
      font-family: inherit;
    }

    .leaflet-control-attribution {
      font-size: 9px !important;
    }

    .leaflet-control-attribution a {
      color: var(--brown);
    }

    @media (max-width: 800px) {
      .page {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 36% minmax(0, 1fr);
        padding: 14px;
        gap: 12px;
      }

      .left-panel {
        grid-column: 1 / -1;
        grid-row: 1;
        justify-content: flex-start;
        padding: 0;
      }

      .page-title {
        font-size: clamp(2rem, 8vw, 4rem);
      }

      .edition-label {
        margin-top: 8px;
      }

      .map-container {
        grid-column: 1;
        grid-row: 2;
        height: 100%;
      }

      .right-panel {
        grid-column: 2;
        grid-row: 2;
        padding: 0 0 38px;
      }

      .location-counter {
        margin-bottom: 12px;
        font-size: clamp(2.2rem, 10vw, 4rem);
      }

      .location-category {
        margin-bottom: 8px;
        font-size: 0.62rem;
      }

      .location-name {
        margin-bottom: 10px;
        font-size: clamp(1.35rem, 5vw, 2.2rem);
      }

      .location-description {
        font-size: 0.78rem;
        line-height: 1.4;
      }

      .location-address {
        margin-top: 10px;
        font-size: 0.68rem;
      }

      .location-navigation {
        padding-top: 12px;
      }

      .arrow-button {
        width: 36px;
        height: 36px;
      }

      .page-link {
        bottom: 12px;
        font-size: 0.65rem;
      }

      .page-link.previous {
        left: 14px;
      }

      .page-link.next {
        right: 14px;
      }
    }

    @media (max-width: 480px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto minmax(0, 42%) minmax(0, 1fr);
        padding: 14px;
        gap: 12px;
      }

      .left-panel {
        grid-column: 1;
        grid-row: 1;
      }

      .map-container {
        grid-column: 1;
        grid-row: 2;
      }

      .right-panel {
        grid-column: 1;
        grid-row: 3;
        padding-bottom: 32px;
      }

      .page-title {
        font-size: clamp(2rem, 10vw, 3.3rem);
      }

      .location-counter {
        margin-bottom: 8px;
        font-size: 2.5rem;
      }

      .location-category {
        margin-bottom: 6px;
      }

      .location-name {
        margin-bottom: 8px;
        font-size: 1.65rem;
      }

      .location-description {
        font-size: 0.8rem;
      }

      .location-address {
        margin-top: 6px;
      }

      .location-navigation {
        padding-top: 8px;
      }
    }

    @media (max-height: 650px) and (min-width: 801px) {
      .page {
        padding-top: 16px;
        padding-bottom: 16px;
        gap: 16px;
      }

      .left-panel,
      .right-panel {
        padding-bottom: 36px;
      }

      .location-counter {
        margin-bottom: 12px;
      }

      .location-name {
        margin-bottom: 10px;
      }

      .location-description {
        font-size: 0.82rem;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="left-panel">
      <div>
        <h1 class="page-title">Dog Map<br>Ghent</h1>
        <div class="edition-label">Dog Days Are Not Over — Edition 03</div>
      </div>
    </section>

    <section class="map-container" aria-label="Map of dog-friendly locations in Ghent">
      <div id="map"></div>
    </section>

    <section class="right-panel" aria-live="polite">
      <div>
        <div class="location-counter" id="location-counter">01</div>
        <div class="location-category" id="location-category"></div>
        <h2 class="location-name" id="location-name"></h2>
        <p class="location-description" id="location-description"></p>
        <div class="location-address" id="location-address"></div>
      </div>

      <div class="location-navigation">
        <button
          class="arrow-button"
          id="previous-location"
          type="button"
          aria-label="Previous location"
        >←</button>

        <span class="navigation-count" id="navigation-count">01 / 12</span>

        <button
          class="arrow-button"
          id="next-location"
          type="button"
          aria-label="Next location"
        >→</button>
      </div>
    </section>
  </main>

  <a class="page-link previous" href="editie-02.html">← Edition 02</a>
  <a class="page-link next" href="editie-04.html">Edition 04 →</a>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /*
      Replace the example locations below with your original 12 locations
      if they differ. Each location needs a name, coordinates, category,
      description and address.
    */
    const locations = [
      {
        name: "Citadelpark",
        lat: 51.0358,
        lng: 3.7218,
        category: "DOG-FRIENDLY PARK",
        description: "A green space to walk, explore and take a break with your dog.",
        address: "Citadelpark, Ghent"
      },
      {
        name: "Blaarmeersen",
        lat: 51.0475,
        lng: 3.6804,
        category: "DOG-FRIENDLY AREA",
        description: "An open recreational area with space to enjoy the outdoors.",
        address: "Strandlaan 24, Ghent"
      },
      {
        name: "Keizerpark",
        lat: 51.0446,
        lng: 3.7484,
        category: "DOG-FRIENDLY PARK",
        description: "A riverside green space for a relaxed walk through the city.",
        address: "Keizerpark, Ghent"
      },
      {
        name: "Baudelopark",
        lat: 51.0584,
        lng: 3.7335,
        category: "DOG-FRIENDLY PARK",
        description: "A compact city park for a short break during your walk.",
        address: "Baudelopark, Ghent"
      },
      {
        name: "Muinkpark",
        lat: 51.0394,
        lng: 3.7306,
        category: "DOG-FRIENDLY PARK",
        description: "A leafy neighbourhood park for a peaceful pause.",
        address: "Muinkpark, Ghent"
      },
      {
        name: "Portus Ganda",
        lat: 51.0561,
        lng: 3.7388,
        category: "WALKING ROUTE",
        description: "Follow the water along this scenic spot in the historic city.",
        address: "Portus Ganda, Ghent"
      },
      {
        name: "Groenevalleipark",
        lat: 51.0612,
        lng: 3.7076,
        category: "DOG-FRIENDLY PARK",
        description: "A green escape with room to enjoy a walk outdoors.",
        address: "Groenevalleipark, Ghent"
      },
      {
        name: "Kon. Albertpark",
        lat: 51.0386,
        lng: 3.7273,
        category: "DOG-FRIENDLY PARK",
        description: "A pleasant green stop near the city's main routes.",
        address: "Koning Albertpark, Ghent"
      },
      {
        name: "Rijsenbergpark",
        lat: 51.0394,
        lng: 3.7008,
        category: "DOG-FRIENDLY PARK",
        description: "A neighbourhood green space for an easy outdoor stroll.",
        address: "Rijsenbergpark, Ghent"
      },
      {
        name: "Bijgaardepark",
        lat: 51.0559,
        lng: 3.7491,
        category: "DOG-FRIENDLY PARK",
        description: "A park to discover while exploring the eastern side of the city.",
        address: "Bijgaardepark, Ghent"
      },
      {
        name: "Ledebergplein",
        lat: 51.0384,
        lng: 3.7466,
        category: "CITY WALK",
        description: "A handy urban stop when walking through Ledeberg.",
        address: "Ledebergplein, Ghent"
      },
      {
        name: "Park De Vijvers",
        lat: 51.0332,
        lng: 3.7504,
        category: "DOG-FRIENDLY AREA",
        description: "A green area for a little fresh air beyond the busy streets.",
        address: "Park De Vijvers, Ghent"
      }
    ];

    const map = L.map("map", {
      zoomControl: true,
      scrollWheelZoom: true
    });

    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution:
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const markers = [];
    let activeIndex = 0;

    const counter = document.getElementById("location-counter");
    const category = document.getElementById("location-category");
    const name = document.getElementById("location-name");
    const description = document.getElementById("location-description");
    const address = document.getElementById("location-address");
    const navigationCount = document.getElementById("navigation-count");

    function createMarker(location, index) {
      const markerIcon = L.divIcon({
        className: "",
        html: `<div class="dog-marker" data-index="${index}">${String(index + 1).padStart(2, "0")}</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const marker = L.marker([location.lat, location.lng], {
        icon: markerIcon,
        keyboard: true,
        title: location.name
      }).addTo(map);

      marker.on("click", () => showLocation(index));
      markers.push(marker);
    }

    function showLocation(index) {
      activeIndex = (index + locations.length) % locations.length;
      const location = locations[activeIndex];

      counter.textContent = String(activeIndex + 1).padStart(2, "0");
      category.textContent = location.category;
      name.textContent = location.name;
      description.textContent = location.description;
      address.textContent = location.address;
      navigationCount.textContent =
        `${String(activeIndex + 1).padStart(2, "0")} / ${String(locations.length).padStart(2, "0")}`;

      markers.forEach((marker, markerIndex) => {
        const markerElement = marker.getElement();
        if (!markerElement) return;

        const circle = markerElement.querySelector(".dog-marker");
        if (!circle) return;

        circle.classList.toggle("active", markerIndex === activeIndex);
      });

      const selected = locations[activeIndex];
      map.panTo([selected.lat, selected.lng], { animate: true });
    }

    locations.forEach(createMarker);

    const bounds = L.latLngBounds(
      locations.map(location => [location.lat, location.lng])
    );

    map.fitBounds(bounds, { padding: [30, 30] });

    document.getElementById("previous-location").addEventListener("click", () => {
      showLocation(activeIndex - 1);
    });

    document.getElementById("next-location").addEventListener("click", () => {
      showLocation(activeIndex + 1);
    });

    document.addEventListener("keydown", event => {
      if (event.key === "ArrowLeft") {
        showLocation(activeIndex - 1);
      } else if (event.key === "ArrowRight") {
        showLocation(activeIndex + 1);
      }
    });

    showLocation(0);

    window.addEventListener("resize", () => {
      map.invalidateSize();
    });
  </script>
</body>
</html>
