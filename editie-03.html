<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 03</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --cream: #f3e7cf;
            --edge: clamp(0.8rem, 2vw, 1.5rem);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background: var(--brown);
        }

        body {
            color: var(--cream);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #app {
            position: fixed;
            inset: 0;
            animation: fadeIn 0.5s ease-out;
        }

        .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

        .home {
            position: fixed;
            top: var(--edge);
            right: var(--edge);
            z-index: 30;
            display: block;
            width: clamp(52px, 5.5vw, 78px);
            aspect-ratio: 200 / 80;
            transform: rotate(-10deg);
            transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
            outline: none;
        }

        .home svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
            fill: var(--cream);
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
            transition: fill 0.25s ease;
        }

        .home:hover, .home:focus-visible { transform: rotate(0deg) scale(1.1); }
        .home:hover svg, .home:focus-visible svg { fill: var(--neon); }

        .t-sleep { --active-bg: var(--cream); --active-fg: var(--brown); }
        .t-walk  { --active-bg: var(--neon); --active-fg: var(--brown); }
        .t-eat   { --active-bg: var(--cream); --active-fg: var(--brown); }
        .t-pet   { --active-bg: var(--neon); --active-fg: var(--cream); }
        .t-play  { --active-bg: var(--neon); --active-fg: var(--brown); }

        /* Telefoon: de actieve activiteit krijgt kleur; alle andere slides blijven bruin. */
        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
            background: var(--brown);
        }
        .slides::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: var(--edge) var(--edge) 1.4rem;
            background: var(--brown);
            color: var(--cream);
            transition: background 0.25s ease, color 0.25s ease;
        }
        .slide.current { background: var(--active-bg); color: var(--active-fg); }

        .strip {
            display: flex;
            gap: 3px;
            height: 8px;
            width: 100%;
            flex: none;
        }
        .strip i { display: block; min-width: 2px; background: currentColor; opacity: 0.25; }
        .strip i.on { opacity: 1; }

        .slide .meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            margin-top: 1rem;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .slide .word {
            margin-top: auto;
            font-size: 22vw;
            line-height: 0.85;
            letter-spacing: -0.045em;
            text-transform: uppercase;
        }
        .slide .count {
            margin-top: 0.8rem;
            min-height: 1.3em;
            font-size: 1.3rem;
            line-height: 1.3;
            font-variant-numeric: tabular-nums;
        }

        /* Laptop: de balken vullen de volledige hoogte; alleen de huidige is gekleurd. */
        .board {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            background: var(--brown);
        }
        .top {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: var(--edge) var(--edge) 1rem;
            color: var(--cream);
            background: var(--brown);
        }
        .top-word {
            font-size: min(14vh, 14vw);
            line-height: 0.85;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: var(--neon);
            white-space: nowrap;
        }
        .top-tag {
            margin-top: 0.6rem;
            font-size: clamp(1rem, 1.9vw, 1.4rem);
            line-height: 1.2;
            font-variant-numeric: tabular-nums;
        }
        .stack {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }
        .band {
            flex: var(--d) 1 0;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            padding: 0.08em 0 0;
            background: var(--brown);
            color: var(--cream);
            font-size: clamp(0.7rem, 2.6vh, 2rem);
            line-height: 1;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            transition: flex-grow 0.45s ease, background 0.25s ease, color 0.25s ease;
        }
        .band.current { background: var(--active-bg); color: var(--active-fg); }
        .band .bt, .band .bw { width: 12ch; text-align: center; }

        .nowline {
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            margin-top: -3px;
            background: var(--neon);
            pointer-events: none;
            z-index: 5;
        }
        .nowline::before {
            content: "";
            position: absolute;
            left: var(--edge);
            top: 50%;
            width: 16px;
            height: 16px;
            margin-top: -8px;
            border-radius: 50%;
            background: var(--neon);
        }

        @media (max-width: 899px) {
            .top-word { font-size: min(14vh, 16vw); }
        }
        @media (prefers-reduced-motion: reduce) {
            #app, .band, .slide, .home { animation: none; transition: none; }
        }
    </style>
</head>
<body>
    <svg class="defs" aria-hidden="true" focusable="false">
        <defs>
            <g id="bone-shape">
                <rect x="40" y="26" width="120" height="28"/>
                <circle cx="34" cy="26" r="19"/><circle cx="34" cy="54" r="19"/>
                <circle cx="166" cy="26" r="19"/><circle cx="166" cy="54" r="19"/>
            </g>
        </defs>
    </svg>
    <a class="home" href="index.html" aria-label="Back to the index">
        <svg viewBox="0 0 200 80" aria-hidden="true"><use href="#bone-shape"/></svg>
    </a>
    <main id="app"></main>

    <script>
        (function () {
            var ACTS = [
                ['sleep', 'Sleep'], ['walk', 'Walk'], ['eat', 'Eat'],
                ['pet', 'Pet'], ['play', 'Play']
            ];
            var WORD = {};
            ACTS.forEach(function (a) { WORD[a[0]] = a[1]; });

            var ENTRIES = [
                [0, 'sleep'], [390, 'walk'], [435, 'eat'], [465, 'pet'],
                [540, 'sleep'], [660, 'walk'], [690, 'play'], [720, 'sleep'],
                [840, 'pet'], [960, 'walk'], [1005, 'play'], [1035, 'eat'],
                [1065, 'pet'], [1260, 'walk'], [1305, 'sleep']
            ];

            var app = document.getElementById('app');
            var mq = window.matchMedia('(min-width: 900px)');
            var mode = null;
            var BLOCKS = [];

            function two(n) { return (n < 10 ? '0' : '') + n; }
            function hm(m) { return two(Math.floor(m / 60)) + ':' + two(m % 60); }
            function range(b) { return hm(b.from) + '\u2013' + hm(b.to === 1440 ? 0 : b.to); }

            function build() {
                return ENTRIES.map(function (e, i) {
                    var to = i + 1 < ENTRIES.length ? ENTRIES[i + 1][0] : 1440;
                    return {
                        from: e[0], to: to, type: e[1], word: WORD[e[1]],
                        w: Math.min(2.5, Math.max(1, (to - e[0]) / 60))
                    };
                });
            }

            function nowInfo() {
                var d = new Date();
                var mins = d.getHours() * 60 + d.getMinutes();
                var idx = 0;
                for (var i = 0; i < BLOCKS.length; i++) {
                    if (mins >= BLOCKS[i].from && mins < BLOCKS[i].to) { idx = i; break; }
                }
                return { mins: mins, idx: idx, clock: two(d.getHours()) + ':' + two(d.getMinutes()) };
            }

            function dur(m) {
                var h = Math.floor(m / 60), r = m % 60;
                return h === 0 ? r + 'm' : h + 'h ' + two(r) + 'm';
            }

            function nextInfo(info) {
                var cur = BLOCKS[info.idx], n = BLOCKS.length;
                for (var k = 1; k <= n; k++) {
                    var j = (info.idx + k) % n;
                    if (BLOCKS[j].type !== cur.type || n === 1) {
                        return { word: BLOCKS[j].word, wait: (BLOCKS[j].from - info.mins + 1440) % 1440 };
                    }
                }
                return { word: cur.word, wait: 0 };
            }

            function until(i, mins) { return (BLOCKS[i].from - mins + 1440) % 1440; }

            function nowPercent(info) {
                var total = 0, before = 0;
                BLOCKS.forEach(function (b, i) {
                    total += b.w;
                    if (i < info.idx) before += b.w;
                });
                var b = BLOCKS[info.idx];
                var frac = (info.mins - b.from) / (b.to - b.from);
                return (before + frac * b.w) / total * 100;
            }

            function strip(active) {
                var html = '<div class="strip" aria-hidden="true">';
                BLOCKS.forEach(function (b, i) {
                    html += '<i class="' + (i === active ? 'on' : '') + '" style="flex-grow:' + (b.to - b.from) + '"></i>';
                });
                return html + '</div>';
            }

            function renderPhone() {
                var html = '<div class="slides" id="slides">';
                BLOCKS.forEach(function (b, i) {
                    html += '<section class="slide t-' + b.type + (i === nowInfo().idx ? ' current' : '') + '">' +
                        strip(i) +
                        '<div class="meta"><span>' + range(b) + '</span><span class="status"></span></div>' +
                        '<div class="word">' + b.word + '</div><div class="count"></div></section>';
                });
                app.innerHTML = html + '</div>';
                var slides = document.getElementById('slides');
                var idx = nowInfo().idx;
                slides.scrollLeft = idx * slides.clientWidth;
                requestAnimationFrame(function () { slides.scrollLeft = idx * slides.clientWidth; });
                updatePhone();
            }

            function updatePhone() {
                var info = nowInfo(), nx = nextInfo(info);
                var list = app.querySelectorAll('.slide');
                for (var i = 0; i < list.length; i++) {
                    list[i].classList.toggle('current', i === info.idx);
                    var status = list[i].querySelector('.status');
                    var count = list[i].querySelector('.count');
                    if (i === info.idx) {
                        status.textContent = 'Now ' + info.clock;
                        count.textContent = 'next: ' + nx.word.toLowerCase() + ' in ' + dur(nx.wait);
                    } else {
                        count.textContent = '';
                        status.textContent = BLOCKS[i].from > info.mins ? 'In ' + dur(until(i, info.mins)) : 'Earlier';
                    }
                }
            }

            function renderLaptop() {
                var info = nowInfo(), bands = '';
                BLOCKS.forEach(function (b, i) {
                    bands += '<div class="band t-' + b.type + (i === info.idx ? ' current' : '') + '" style="--d:' + b.w.toFixed(3) + '">' +
                        '<span class="bt">' + range(b) + '</span><span class="bw">' + b.word + '</span></div>';
                });
                app.innerHTML = '<div class="board"><header class="top">' +
                    '<div class="top-word" id="r-word"></div><div class="top-tag" id="r-tag"></div>' +
                    '</header><div class="stack" id="stack">' + bands + '<div class="nowline" id="nowline"></div></div></div>';
                updateLaptop();
            }

            function updateLaptop() {
                var info = nowInfo(), b = BLOCKS[info.idx], nx = nextInfo(info);
                document.getElementById('r-word').textContent = b.word;
                document.getElementById('r-tag').textContent = 'next: ' + nx.word.toLowerCase() + ' in ' + dur(nx.wait);
                var bands = app.querySelectorAll('.band');
                for (var i = 0; i < bands.length; i++) bands[i].classList.toggle('current', i === info.idx);
                document.getElementById('nowline').style.top = nowPercent(info).toFixed(3) + '%';
            }

            function render() {
                var next = mq.matches ? 'laptop' : 'phone';
                if (next === mode) return;
                mode = next;
                if (mode === 'laptop') renderLaptop(); else renderPhone();
            }

            function tick() {
                if (mode === 'laptop') updateLaptop();
                else updatePhone();
            }

            BLOCKS = build();
            if (mq.addEventListener) mq.addEventListener('change', render);
            else if (mq.addListener) mq.addListener(render);
            render();
            setInterval(tick, 15000);
        })();
    </script>
</body>
</html>
