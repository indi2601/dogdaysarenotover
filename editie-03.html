<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 03</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --white: #FFFFFF;
            --bar: 5.4rem;
            --edge: clamp(0.8rem, 2vw, 1.5rem);
            --line: 4px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: var(--white);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        #app {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--bar);
            animation: fadeIn 0.5s ease-out;
        }

        /* ---------- Eén combinatie per soort: alleen bruin, wit en roze ---------- */

        .t-sleep   { --bg: var(--brown); --fg: var(--white); }
        .t-walk    { --bg: var(--white); --fg: var(--brown); }
        .t-eat     { --bg: var(--brown); --fg: var(--neon); }
        .t-play    { --bg: var(--neon);  --fg: var(--brown); }
        .t-cuddle  { --bg: var(--white); --fg: var(--neon); }
        .t-rest    { --bg: var(--neon);  --fg: var(--white); }

        /* ---------- Navigatie (zelfde als editie 1, 2 en 4) ---------- */

        .nav-links {
            position: fixed;
            bottom: var(--edge);
            left: var(--edge);
            right: var(--edge);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .nav-link {
            font-family: inherit;
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            transition: opacity 0.25s ease;
            outline: none;
            pointer-events: auto;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* =========================================================
           LEZING 1: TELEFOON
           Eén moment tegelijk, beeldvullend. Vegen is bladeren.
           ========================================================= */

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
        }

        .slides::-webkit-scrollbar {
            display: none;
        }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            padding: var(--edge) var(--edge) 1.4rem;
            background: var(--bg);
            color: var(--fg);
        }

        .strip {
            display: flex;
            gap: 3px;
            height: 8px;
            width: 100%;
            flex: none;
        }

        .strip i {
            display: block;
            background: currentColor;
            opacity: 0.25;
            min-width: 2px;
        }

        .strip i.on {
            opacity: 1;
        }

        .slide .meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 0.2rem;
            margin-top: 1rem;
            font-size: 1.3rem;
            font-variant-numeric: tabular-nums;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .slide .word {
            margin-top: auto;
            font-size: 22vw;
            line-height: 0.85;
            letter-spacing: -0.045em;
            text-transform: uppercase;
        }

        /* =========================================================
           LEZING 2: LAPTOP
           De hele dag in één affiche.
           ========================================================= */

        .board {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .top {
            flex: 0 0 20vh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
            padding: var(--edge) var(--edge) 0;
            background: var(--white);
        }

        .top-tag {
            font-size: clamp(1rem, 1.9vw, 1.4rem);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            font-variant-numeric: tabular-nums;
        }

        .top-word {
            font-size: 14vh;
            line-height: 0.85;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: var(--neon);
            margin-top: 0.5rem;
            white-space: nowrap;
        }

        .top-word.preview {
            color: var(--brown);
        }

        .stack {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            outline: var(--line) solid var(--brown);
            outline-offset: calc(var(--line) * -1);
        }

        .band {
            flex: var(--d) 1 0;
            min-height: 0;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 2rem;
            padding: 0 calc(var(--edge) + var(--line));
            background: var(--bg);
            color: var(--fg);
            box-shadow: inset 0 var(--line) 0 var(--brown);
            font-size: clamp(0.7rem, 2.6vh, 2rem);
            line-height: 1;
            letter-spacing: 0;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            cursor: default;
            outline: none;
            animation: fadeIn 0.6s ease-out backwards;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .band:first-child {
            box-shadow: none;
        }

        .band .bt {
            width: 11ch;
            text-align: left;
        }

        .band .bw {
            width: 8ch;
            text-align: left;
        }

        .band:hover,
        .band:focus-visible {
            background: var(--fg);
            color: var(--bg);
        }

        /* Tijdbalk: dik, zonder outline. Kleur wisselt als de baan dezelfde kleur heeft. */
        .nowline {
            --nl: var(--brown);
            position: absolute;
            left: 0;
            right: 0;
            height: 6px;
            margin-top: -3px;
            background: var(--nl);
            pointer-events: none;
            z-index: 5;
        }

        .nowline::before {
            content: "";
            position: absolute;
            left: var(--edge);
            top: 50%;
            width: 16px;
            height: 16px;
            margin-top: -8px;
            border-radius: 50%;
            background: var(--nl);
        }

        /* =========================================================
           EDITOR: ritme aanpassen per hond
           ========================================================= */

        .editor {
            position: fixed;
            inset: 0;
            z-index: 40;
            background: var(--white);
            color: var(--brown);
            overflow-y: auto;
            padding: var(--edge) var(--edge) 6rem;
        }

        .editor[hidden] {
            display: none;
        }

        .editor h2 {
            font-size: clamp(2.4rem, 8vw, 6rem);
            font-weight: 400;
            line-height: 0.88;
            letter-spacing: -0.045em;
            text-transform: uppercase;
            color: var(--neon);
        }

        .rows {
            margin-top: 1.5rem;
            max-width: 34rem;
            border-top: 2px solid var(--brown);
        }

        .erow {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0;
            border-bottom: 2px solid var(--brown);
        }

        .editor input,
        .editor select {
            font-family: inherit;
            font-size: 1.15rem;
            color: var(--brown);
            background: var(--white);
            border: 2px solid var(--brown);
            border-radius: 4px;
            padding: 0.45rem 0.6rem;
            outline: none;
        }

        .editor input:focus,
        .editor select:focus {
            border-color: var(--neon);
        }

        .editor select {
            flex: 1;
        }

        .editor .x {
            font-family: inherit;
            font-size: 1.6rem;
            line-height: 1;
            color: var(--neon);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0 0.3rem;
        }

        .editor .x:hover {
            opacity: 0.7;
        }

        .editor-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        @media (max-width: 899px) {
            .nav-link {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #app,
            .band {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main id="app"></main>

    <section class="editor" id="editor" hidden aria-label="Edit rhythm">
        <h2>Your dog's<br>rhythm</h2>
        <div class="rows" id="rows"></div>
        <div class="editor-actions">
            <button type="button" class="nav-link" id="e-add">+ Add</button>
            <button type="button" class="nav-link" id="e-reset">Reset</button>
            <button type="button" class="nav-link" id="e-cancel">Cancel</button>
            <button type="button" class="nav-link" id="e-save">Save</button>
        </div>
    </section>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-02.html" class="nav-link">← Edition 02</a>
        <button type="button" class="nav-link" id="edit">edit rhythm</button>
        <a href="editie-04.html" class="nav-link">Edition 04 →</a>
    </nav>

    <script>
        (function () {
            var ACTS = [
                ['sleep', 'Sleep'], ['rest', 'Rest'], ['walk', 'Walk'],
                ['eat', 'Eat'], ['play', 'Play'], ['cuddle', 'Cuddle']
            ];
            var WORD = {};
            ACTS.forEach(function (a) { WORD[a[0]] = a[1]; });

            // Elke activiteit begint op [minuten sinds middernacht] en loopt tot de volgende begint.
            // Richtlijn voor een volwassen hond: ongeveer 12 uur slaap, 7 uur rust, 5 uur actief.
            var DEFAULT = [
                [0,    'sleep'],   // 00:00
                [390,  'walk'],    // 06:30
                [435,  'eat'],     // 07:15
                [465,  'rest'],    // 07:45
                [540,  'sleep'],   // 09:00
                [660,  'walk'],    // 11:00
                [690,  'play'],    // 11:30
                [720,  'sleep'],   // 12:00
                [840,  'rest'],    // 14:00
                [960,  'play'],    // 16:00
                [990,  'walk'],    // 16:30
                [1035, 'eat'],     // 17:15
                [1065, 'rest'],    // 17:45
                [1170, 'cuddle'],  // 19:30
                [1200, 'rest'],    // 20:00
                [1320, 'walk'],    // 22:00
                [1350, 'sleep']    // 22:30
            ];

            var KEY = 'dogdays-rhythm-v2';
            var app = document.getElementById('app');
            var mq = window.matchMedia('(min-width: 900px)');
            var mode = null;
            var previewIdx = -1;
            var entries = load();
            var BLOCKS = build(entries);

            function two(n) { return (n < 10 ? '0' : '') + n; }
            function hm(m) { return two(Math.floor(m / 60)) + ':' + two(m % 60); }
            function range(b) { return hm(b.from) + '\u2013' + hm(b.to === 1440 ? 0 : b.to); }

            /* ---------- Ritme laden en opbouwen ---------- */

            function load() {
                try {
                    var raw = JSON.parse(localStorage.getItem(KEY));
                    if (Array.isArray(raw) && raw.length) {
                        var ok = raw.every(function (e) {
                            return Array.isArray(e) && typeof e[0] === 'number' && e[0] >= 0 && e[0] < 1440 && WORD[e[1]];
                        });
                        if (ok) return raw;
                    }
                } catch (err) {}
                return DEFAULT.map(function (e) { return e.slice(); });
            }

            function build(list) {
                var s = list.slice().sort(function (a, b) { return a[0] - b[0]; });
                var clean = [];
                s.forEach(function (e) {
                    if (!clean.length || clean[clean.length - 1][0] !== e[0]) clean.push(e);
                });
                var out = [];
                if (clean[0][0] > 0) {
                    out.push({ from: 0, to: clean[0][0], type: clean[clean.length - 1][1] });
                }
                clean.forEach(function (e, i) {
                    var to = i + 1 < clean.length ? clean[i + 1][0] : 1440;
                    out.push({ from: e[0], to: to, type: e[1] });
                });
                out.forEach(function (b) {
                    b.word = WORD[b.type];
                    // Hoogte van de baan: niet te klein en niet te groot, zodat de tekst past
                    b.w = Math.min(2.5, Math.max(1, (b.to - b.from) / 60));
                });
                return out;
            }

            function nowInfo() {
                var d = new Date();
                var mins = d.getHours() * 60 + d.getMinutes();
                var idx = 0;
                for (var i = 0; i < BLOCKS.length; i++) {
                    if (mins >= BLOCKS[i].from && mins < BLOCKS[i].to) { idx = i; break; }
                }
                return { mins: mins, idx: idx, clock: two(d.getHours()) + ':' + two(d.getMinutes()) };
            }

            function dur(m) {
                var h = Math.floor(m / 60), r = m % 60;
                if (h === 0) return r + 'm';
                return h + 'h ' + two(r) + 'm';
            }

            // Eerstvolgende blok met een andere activiteit dan nu
            function nextInfo(info) {
                var cur = BLOCKS[info.idx];
                var n = BLOCKS.length;
                for (var k = 1; k <= n; k++) {
                    var j = (info.idx + k) % n;
                    if (BLOCKS[j].type !== cur.type || n === 1) {
                        var wait = (BLOCKS[j].from - info.mins + 1440) % 1440;
                        return { word: BLOCKS[j].word, wait: wait };
                    }
                }
                return { word: cur.word, wait: 0 };
            }

            function until(i, mins) {
                return (BLOCKS[i].from - mins + 1440) % 1440;
            }

            // Plek van de tijdbalk, rekening houdend met de hoogte van de banen
            function nowPercent(info) {
                var total = 0, before = 0;
                BLOCKS.forEach(function (b, i) {
                    total += b.w;
                    if (i < info.idx) before += b.w;
                });
                var b = BLOCKS[info.idx];
                var frac = (info.mins - b.from) / (b.to - b.from);
                return (before + frac * b.w) / total * 100;
            }

            /* ---------- Telefoon ---------- */

            function strip(active) {
                var s = '<div class="strip" aria-hidden="true">';
                BLOCKS.forEach(function (b, k) {
                    s += '<i class="' + (k === active ? 'on' : '') + '" style="flex-grow:' + (b.to - b.from) + '"></i>';
                });
                return s + '</div>';
            }

            function renderPhone() {
                var html = '<div class="slides" id="slides">';
                BLOCKS.forEach(function (b, i) {
                    html +=
                        '<section class="slide t-' + b.type + '">' +
                            strip(i) +
                            '<div class="meta"><span>' + range(b) + '</span><span class="status"></span><span class="count"></span></div>' +
                            '<div class="word">' + b.word + '</div>' +
                        '</section>';
                });
                html += '</div>';
                app.innerHTML = html;

                var slides = document.getElementById('slides');
                var idx = nowInfo().idx;
                slides.scrollLeft = idx * slides.clientWidth;
                requestAnimationFrame(function () { slides.scrollLeft = idx * slides.clientWidth; });
                updatePhone();
            }

            function updatePhone() {
                var info = nowInfo();
                var nx = nextInfo(info);
                app.querySelectorAll('.slide').forEach(function (s, i) {
                    var st = s.querySelector('.status');
                    var ct = s.querySelector('.count');
                    if (i === info.idx) {
                        st.textContent = 'Now ' + info.clock;
                        ct.textContent = 'Next: ' + nx.word + ' in ' + dur(nx.wait);
                    } else {
                        ct.textContent = '';
                        if (BLOCKS[i].from > info.mins) st.textContent = 'In ' + dur(until(i, info.mins));
                        else st.textContent = 'Earlier';
                    }
                });
            }

            /* ---------- Laptop ---------- */

            function renderLaptop() {
                var bands = '';
                BLOCKS.forEach(function (b, i) {
                    bands +=
                        '<div class="band t-' + b.type + '" tabindex="0" data-i="' + i + '" ' +
                        'style="--d:' + b.w.toFixed(3) + ';animation-delay:' + (i * 0.03).toFixed(2) + 's">' +
                            '<span class="bt">' + range(b) + '</span><span class="bw">' + b.word + '</span>' +
                        '</div>';
                });

                app.innerHTML =
                    '<div class="board">' +
                        '<div class="top">' +
                            '<div class="top-tag" id="r-tag"></div>' +
                            '<div class="top-word" id="r-word"></div>' +
                        '</div>' +
                        '<div class="stack" id="stack">' + bands +
                            '<div class="nowline" id="nowline"></div>' +
                        '</div>' +
                    '</div>';

                app.querySelectorAll('.band').forEach(function (el) {
                    var i = parseInt(el.getAttribute('data-i'), 10);
                    function on() { previewIdx = i; updateLaptop(); }
                    function off() { previewIdx = -1; updateLaptop(); }
                    el.addEventListener('mouseenter', on);
                    el.addEventListener('mouseleave', off);
                    el.addEventListener('focus', on);
                    el.addEventListener('blur', off);
                });

                updateLaptop();
            }

            function updateLaptop() {
                var info = nowInfo();
                var shown = previewIdx >= 0 ? previewIdx : info.idx;
                var isNow = shown === info.idx;
                var b = BLOCKS[shown];
                var nx = nextInfo(info);

                document.getElementById('r-tag').textContent = isNow
                    ? 'Now ' + info.clock + ' \u00B7 Next: ' + nx.word + ' in ' + dur(nx.wait)
                    : range(b);

                var w = document.getElementById('r-word');
                w.textContent = b.word;
                w.classList.toggle('preview', !isNow);

                // Tijdbalk: bruin, maar roze als de baan zelf bruin is
                var nl = document.getElementById('nowline');
                var cur = BLOCKS[info.idx].type;
                var onBrown = (cur === 'sleep' || cur === 'eat');
                nl.style.setProperty('--nl', onBrown ? '#ff2fa8' : '#6b4423');
                nl.style.top = nowPercent(info).toFixed(3) + '%';
            }

            /* ---------- Kiezen en bijwerken ---------- */

            function render() {
                var next = mq.matches ? 'laptop' : 'phone';
                if (next === mode) return;
                mode = next;
                previewIdx = -1;
                if (mode === 'laptop') renderLaptop(); else renderPhone();
            }

            function tick() {
                if (mode === 'laptop') updateLaptop(); else updatePhone();
            }

            if (mq.addEventListener) mq.addEventListener('change', render);
            else mq.addListener(render);

            /* ---------- Editor ---------- */

            var editor = document.getElementById('editor');
            var rowsEl = document.getElementById('rows');
            var draft = [];

            function drawRows() {
                var html = '';
                draft.forEach(function (e, i) {
                    var opts = '';
                    ACTS.forEach(function (a) {
                        opts += '<option value="' + a[0] + '"' + (a[0] === e[1] ? ' selected' : '') + '>' + a[1] + '</option>';
                    });
                    html +=
                        '<div class="erow" data-i="' + i + '">' +
                            '<input type="time" value="' + hm(e[0]) + '" aria-label="Start time">' +
                            '<select aria-label="Activity">' + opts + '</select>' +
                            '<button type="button" class="x" aria-label="Remove">\u00D7</button>' +
                        '</div>';
                });
                rowsEl.innerHTML = html;

                rowsEl.querySelectorAll('.erow').forEach(function (row) {
                    var i = parseInt(row.getAttribute('data-i'), 10);
                    row.querySelector('input').addEventListener('change', function (ev) {
                        var p = ev.target.value.split(':');
                        if (p.length === 2) draft[i][0] = parseInt(p[0], 10) * 60 + parseInt(p[1], 10);
                    });
                    row.querySelector('select').addEventListener('change', function (ev) {
                        draft[i][1] = ev.target.value;
                    });
                    row.querySelector('.x').addEventListener('click', function () {
                        if (draft.length > 1) { draft.splice(i, 1); drawRows(); }
                    });
                });
            }

            function openEditor() {
                draft = entries.map(function (e) { return e.slice(); });
                drawRows();
                editor.hidden = false;
                editor.scrollTop = 0;
            }

            function closeEditor() { editor.hidden = true; }

            document.getElementById('edit').addEventListener('click', openEditor);
            document.getElementById('e-cancel').addEventListener('click', closeEditor);
            document.getElementById('e-add').addEventListener('click', function () {
                draft.push([720, 'walk']);
                drawRows();
            });
            document.getElementById('e-reset').addEventListener('click', function () {
                draft = DEFAULT.map(function (e) { return e.slice(); });
                drawRows();
            });
            document.getElementById('e-save').addEventListener('click', function () {
                var valid = draft.filter(function (e) { return !isNaN(e[0]) && e[0] >= 0 && e[0] < 1440; });
                if (!valid.length) return;
                entries = valid;
                try { localStorage.setItem(KEY, JSON.stringify(entries)); } catch (err) {}
                BLOCKS = build(entries);
                closeEditor();
                mode = null;
                render();
            });

            render();
            setInterval(tick, 15000);
        })();
    </script>
</body>
</html>
