<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 03</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --background: #FFFFFF;
            --gap: clamp(0.5rem, 0.9vw, 0.9rem);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--background);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        #app {
            width: 100%;
            height: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        /* ---------- Navigatie (zelfde als editie 1 en 2) ---------- */

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .nav-link {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
            pointer-events: auto;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* =========================================================
           LEZING 1: TELEFOON
           Eén moment tegelijk, beeldvullend. Vegen is bladeren.
           ========================================================= */

        .clock {
            position: fixed;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            z-index: 10;
            font-size: 1rem;
            font-variant-numeric: tabular-nums;
        }

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
        }

        .slides::-webkit-scrollbar {
            display: none;
        }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 4rem 1.4rem 5rem;
        }

        .slide .tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            min-height: 1.2em;
            margin-bottom: 0.8rem;
        }

        .slide.now .tag {
            color: var(--neon);
        }

        .slide .word {
            font-size: clamp(4.5rem, 21vw, 9rem);
            line-height: 0.9;
            letter-spacing: -0.05em;
            overflow-wrap: anywhere;
        }

        .slide.now .word {
            color: var(--neon);
        }

        .slide .line {
            font-size: 1.15rem;
            line-height: 1.3;
            margin-top: 1.2rem;
            max-width: 22rem;
        }

        .slide .meta {
            font-size: 0.85rem;
            margin-top: 1.6rem;
            opacity: 0.85;
            font-variant-numeric: tabular-nums;
        }

        .slide .count {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            font-size: 1rem;
            font-variant-numeric: tabular-nums;
        }

        .slide {
            position: relative;
        }

        @media (max-width: 899px) {
            .nav-links {
                bottom: 0;
                left: 0;
                right: 0;
                padding: 0.9rem clamp(1rem, 5vw, 1.5rem);
                background: linear-gradient(to top, #fff 70%, rgba(255, 255, 255, 0));
            }

            .nav-link {
                font-size: 1rem;
            }
        }

        /* =========================================================
           LEZING 2: LAPTOP
           De hele dag in één blik: twee rijen, 00-12 en 12-24.
           ========================================================= */

        @media (min-width: 900px) {
            .day {
                position: absolute;
                top: 1.5rem;
                bottom: 4.5rem;
                left: 3vw;
                right: 3vw;
                display: flex;
                flex-direction: column;
                gap: var(--gap);
            }

            .readout {
                flex: 1.4;
                min-height: 0;
                display: flex;
                justify-content: space-between;
                align-items: flex-start;
                gap: 2rem;
                padding-bottom: 0.5rem;
            }

            .readout-main {
                min-width: 0;
            }

            .readout-tag {
                font-size: clamp(0.8rem, 1.2vw, 1rem);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                margin-bottom: 0.5rem;
            }

            .readout-word {
                font-size: clamp(5rem, 17vh, 15rem);
                line-height: 0.85;
                letter-spacing: -0.05em;
                color: var(--neon);
                white-space: nowrap;
            }

            .readout-word.preview {
                color: var(--brown);
            }

            .readout-line {
                font-size: clamp(1rem, 1.8vw, 1.6rem);
                margin-top: 1rem;
            }

            .readout-side {
                text-align: right;
                flex: none;
            }

            .readout-time {
                font-size: clamp(2.5rem, 7vw, 7rem);
                line-height: 0.9;
                letter-spacing: -0.04em;
                font-variant-numeric: tabular-nums;
            }

            .readout-next {
                font-size: clamp(0.85rem, 1.3vw, 1.1rem);
                margin-top: 0.8rem;
            }

            .row {
                flex: 1;
                min-height: 0;
                display: grid;
                grid-template-columns: repeat(12, 1fr);
                gap: var(--gap);
            }

            .block {
                position: relative;
                min-width: 0;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                padding: 0.6rem 0.7rem;
                border: 2px solid var(--brown);
                border-radius: 4px;
                background: #fff;
                color: var(--brown);
                cursor: default;
                outline: none;
                animation: fadeIn 0.6s ease-out backwards;
                transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
            }

            .block .range {
                font-size: clamp(0.65rem, 0.95vw, 0.85rem);
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
            }

            .block .bw {
                font-size: clamp(0.9rem, 1.7vw, 1.5rem);
                line-height: 1;
                letter-spacing: -0.02em;
                white-space: nowrap;
            }

            .block.wide .bw {
                font-size: clamp(1.4rem, 3vw, 2.8rem);
            }

            .block:hover,
            .block:focus-visible {
                border-color: var(--neon);
                color: var(--neon);
            }

            .block.now {
                background: var(--neon);
                border-color: var(--neon);
                color: #fff;
            }

            .block.now .range::after {
                content: " · now";
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #app,
            .block {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main id="app"></main>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-02.html" class="nav-link">← Edition 02</a>
        <a href="editie-04.html" class="nav-link">Edition 04 →</a>
    </nav>

    <script>
        (function () {
            // De dag van een hond. from/to zijn uren (0 tot 24).
            // Pas gerust woorden en zinnen aan.
            var BLOCKS = [
                { from: 0,  to: 6,  word: 'Sleep',   line: 'Dreaming about squirrels. Do not disturb.' },
                { from: 6,  to: 7,  word: 'Walk',    line: 'Bladder says now. Right now.' },
                { from: 7,  to: 8,  word: 'Eat',     line: 'Breakfast. Yesterday\u2019s dinner is forgotten.' },
                { from: 8,  to: 10, word: 'Walk',    line: 'Sniff every single lamppost.' },
                { from: 10, to: 12, word: 'Nap',     line: 'Recovering from the walk.' },
                { from: 12, to: 13, word: 'Eat',     line: 'A small snack. Just a tiny one. Please.' },
                { from: 13, to: 15, word: 'Nap',     line: 'Hunting the one sunbeam in the room.' },
                { from: 15, to: 16, word: 'Play',    line: 'Ball. Ball. Ball. Ball.' },
                { from: 16, to: 18, word: 'Walk',    line: 'The long walk. The good one.' },
                { from: 18, to: 19, word: 'Eat',     line: 'Dinner. Now. Immediately.' },
                { from: 19, to: 21, word: 'Cuddle',  line: 'The couch. Your lap. Both.' },
                { from: 21, to: 22, word: 'Zoomies', line: 'Sudden energy. Mind the furniture.' },
                { from: 22, to: 24, word: 'Sleep',   line: 'Lights out. Back to the squirrels.' }
            ];

            var app = document.getElementById('app');
            var mq = window.matchMedia('(min-width: 900px)');
            var mode = null;
            var previewIdx = -1;

            function two(n) { return (n < 10 ? '0' : '') + n; }
            function hh(h) { return two(h % 24) + ':00'; }
            function range(b) { return hh(b.from) + '\u2013' + hh(b.to); }

            function nowInfo() {
                var d = new Date();
                var mins = d.getHours() * 60 + d.getMinutes();
                var idx = 0;
                for (var i = 0; i < BLOCKS.length; i++) {
                    if (mins >= BLOCKS[i].from * 60 && mins < BLOCKS[i].to * 60) { idx = i; break; }
                }
                return { d: d, mins: mins, idx: idx, clock: two(d.getHours()) + ':' + two(d.getMinutes()) };
            }

            function dur(m) {
                var h = Math.floor(m / 60), r = m % 60;
                if (h === 0) return r + 'm';
                return h + 'h ' + (r < 10 ? '0' : '') + r + 'm';
            }

            // minuten tot het begin van blok i (kan morgen zijn)
            function until(i, mins) {
                return (BLOCKS[i].from * 60 - mins + 1440) % 1440;
            }

            /* ---------- Telefoon ---------- */

            function renderPhone() {
                var html = '<div class="clock" id="clock"></div><div class="slides" id="slides">';
                BLOCKS.forEach(function (b, i) {
                    html +=
                        '<section class="slide" data-i="' + i + '">' +
                            '<div class="count">' + two(i + 1) + ' / ' + two(BLOCKS.length) + '</div>' +
                            '<div class="tag"></div>' +
                            '<div class="word">' + b.word + '.</div>' +
                            '<p class="line">' + b.line + '</p>' +
                            '<div class="meta"></div>' +
                        '</section>';
                });
                html += '</div>';
                app.innerHTML = html;

                var slides = document.getElementById('slides');
                var info = nowInfo();
                slides.scrollLeft = info.idx * slides.clientWidth;
                updatePhone();
            }

            function updatePhone() {
                var info = nowInfo();
                var clock = document.getElementById('clock');
                if (clock) clock.textContent = info.clock;

                var slides = app.querySelectorAll('.slide');
                slides.forEach(function (s, i) {
                    var b = BLOCKS[i];
                    var isNow = i === info.idx;
                    s.classList.toggle('now', isNow);
                    var tag = s.querySelector('.tag');
                    var meta = s.querySelector('.meta');
                    if (isNow) {
                        tag.textContent = 'Right now';
                        var next = (i + 1) % BLOCKS.length;
                        meta.textContent = 'Next: ' + BLOCKS[next].word + ' in ' + dur(until(next, info.mins));
                    } else {
                        tag.textContent = range(b);
                        if (b.from * 60 > info.mins) {
                            meta.textContent = 'Starts in ' + dur(until(i, info.mins));
                        } else {
                            meta.textContent = 'Earlier today';
                        }
                    }
                });
            }

            /* ---------- Laptop ---------- */

            function blockHtml(b, i) {
                var wide = (b.to - b.from) >= 3 ? ' wide' : '';
                return '<div class="block' + wide + '" tabindex="0" data-i="' + i + '" ' +
                        'style="grid-column: span ' + (b.to - b.from) + '; animation-delay:' + (i * 0.04).toFixed(2) + 's">' +
                            '<span class="range">' + range(b) + '</span>' +
                            '<span class="bw">' + b.word + '</span>' +
                        '</div>';
            }

            function renderLaptop() {
                var am = '', pm = '';
                BLOCKS.forEach(function (b, i) {
                    if (b.from < 12) am += blockHtml(b, i); else pm += blockHtml(b, i);
                });

                app.innerHTML =
                    '<div class="day">' +
                        '<div class="readout">' +
                            '<div class="readout-main">' +
                                '<div class="readout-tag" id="r-tag"></div>' +
                                '<div class="readout-word" id="r-word"></div>' +
                                '<div class="readout-line" id="r-line"></div>' +
                            '</div>' +
                            '<div class="readout-side">' +
                                '<div class="readout-time" id="r-time"></div>' +
                                '<div class="readout-next" id="r-next"></div>' +
                            '</div>' +
                        '</div>' +
                        '<div class="row">' + am + '</div>' +
                        '<div class="row">' + pm + '</div>' +
                    '</div>';

                app.querySelectorAll('.block').forEach(function (el) {
                    var i = parseInt(el.getAttribute('data-i'), 10);
                    function on() { previewIdx = i; updateLaptop(); }
                    function off() { previewIdx = -1; updateLaptop(); }
                    el.addEventListener('mouseenter', on);
                    el.addEventListener('mouseleave', off);
                    el.addEventListener('focus', on);
                    el.addEventListener('blur', off);
                });

                updateLaptop();
            }

            function updateLaptop() {
                var info = nowInfo();
                var shown = previewIdx >= 0 ? previewIdx : info.idx;
                var b = BLOCKS[shown];
                var isNow = shown === info.idx;

                document.getElementById('r-tag').textContent = isNow ? 'Your dog wants, right now' : 'Later: ' + range(b);
                var w = document.getElementById('r-word');
                w.textContent = b.word + '.';
                w.classList.toggle('preview', !isNow);
                document.getElementById('r-line').textContent = b.line;
                document.getElementById('r-time').textContent = info.clock;

                var next = (info.idx + 1) % BLOCKS.length;
                document.getElementById('r-next').textContent =
                    'Next: ' + BLOCKS[next].word + ' in ' + dur(until(next, info.mins));

                app.querySelectorAll('.block').forEach(function (el, k) {
                    var i = parseInt(el.getAttribute('data-i'), 10);
                    el.classList.toggle('now', i === info.idx);
                });
            }

            /* ---------- Kiezen en bijwerken ---------- */

            function render() {
                var next = mq.matches ? 'laptop' : 'phone';
                if (next === mode) return;
                mode = next;
                previewIdx = -1;
                if (mode === 'laptop') renderLaptop(); else renderPhone();
            }

            function tick() {
                if (mode === 'laptop') updateLaptop(); else updatePhone();
            }

            if (mq.addEventListener) mq.addEventListener('change', render);
            else mq.addListener(render);

            render();
            setInterval(tick, 20000);
        })();
    </script>
</body>
</html>
