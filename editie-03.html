<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Dog Days Are Not Over – Edition 03</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background-color: #faf8f7;
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        #fur {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
            -webkit-user-select: none;
            user-select: none;
        }

        .hint {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(1.6rem, 4.5vw, 3.4rem);
            text-align: center;
            pointer-events: none;
            transition: opacity 0.6s ease;
            z-index: 2;
        }

        .hint.hide {
            opacity: 0;
        }

        .hint .touch {
            display: none;
        }

        /* Laptop: percentage readout */
        .meter {
            position: fixed;
            right: clamp(0.8rem, 2vw, 1.5rem);
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            opacity: 0.6;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        /* Phone: thin progress bar */
        .bar {
            position: fixed;
            left: 0;
            bottom: 0;
            height: 5px;
            width: 0;
            background: var(--brown);
            display: none;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .done .meter,
        .done .bar {
            opacity: 0;
        }

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: center;
            gap: clamp(1.5rem, 3vw, 2rem);
            z-index: 6;
        }

        .nav-link {
            font-family: inherit;
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            white-space: nowrap;
            background: none;
            border: none;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .again[hidden] {
            display: none;
        }

        /* Phone / touch: a different reading of the same material */
        @media (max-width: 700px), (pointer: coarse) {
            .hint .mouse {
                display: none;
            }

            .hint .touch {
                display: inline;
            }

            .meter {
                display: none;
            }

            .bar {
                display: block;
            }

            .nav-link {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="fur"></canvas>

    <div class="hint" id="hint">
        <span class="mouse">click and drag to grow fur</span>
        <span class="touch">swipe to pet the dog</span>
    </div>

    <div class="meter" id="meter">0% fur</div>
    <div class="bar" id="bar"></div>

    <nav class="nav-links">
        <a href="editie-02.html" class="nav-link">← Edition 02</a>
        <button type="button" class="nav-link again" id="again" hidden>↻ Again</button>
    </nav>

    <script>
        (function () {
            'use strict';

            var canvas = document.getElementById('fur');
            var ctx = canvas.getContext('2d');
            var hint = document.getElementById('hint');
            var meter = document.getElementById('meter');
            var bar = document.getElementById('bar');
            var again = document.getElementById('again');

            var W = 0, H = 0, dpr = 1;
            var GX = 44, GY = 30, TOTAL = GX * GY;
            var grid = new Uint8Array(TOTAL);
            var covered = 0;
            var THRESHOLD = 0.93;            // how much must be covered before the face appears

            var drawing = false, complete = false;
            var last = null, vx = 0, vy = 1, lastBuzz = 0;
            var base = null, layers = null, geo = null;
            var animStart = 0, rafId = 0;
            var gaze = { x: 0, y: 0, tx: 0, ty: 0 };

            // Fur palette: dark to light
            var PAL = [
                [52, 30, 14], [78, 47, 22], [104, 66, 34], [134, 90, 48],
                [166, 118, 66], [194, 148, 92], [220, 184, 132], [238, 214, 172]
            ];

            function isPhone() {
                return window.matchMedia('(max-width: 700px), (pointer: coarse)').matches;
            }

            function cl(v) { return Math.max(0, Math.min(255, v | 0)); }
            function clamp01(v) { return Math.max(0, Math.min(1, v)); }
            function ease(p) { return p * p * (3 - 2 * p); }

            /* ---------- Fur while drawing ---------- */

            function furColor(x, y, alpha) {
                var tone = 0.5 + 0.26 * Math.sin(x / 170) * Math.cos(y / 140) + 0.12 * Math.sin((x + y) / 55);
                var t = 0.55 * ((Math.random() + Math.random()) / 2) + 0.45 * tone;
                t = Math.max(0, Math.min(0.999, t));
                var f = t * (PAL.length - 1);
                var i = Math.floor(f), m = f - i;
                var a = PAL[i], b = PAL[i + 1];
                var r = a[0] + (b[0] - a[0]) * m + (Math.random() - 0.5) * 14;
                var g = a[1] + (b[1] - a[1]) * m + (Math.random() - 0.5) * 14;
                var bl = a[2] + (b[2] - a[2]) * m + (Math.random() - 0.5) * 14;
                return 'rgba(' + cl(r) + ',' + cl(g) + ',' + cl(bl) + ',' + alpha.toFixed(2) + ')';
            }

            function stamp(x, y, ang, r, count) {
                var g = ctx.createRadialGradient(x, y, 0, x, y, r);
                g.addColorStop(0, 'rgba(110,72,40,0.08)');
                g.addColorStop(1, 'rgba(110,72,40,0)');
                ctx.fillStyle = g;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.lineCap = 'round';
                var sc = 0.75 + r / 110;
                for (var i = 0; i < count; i++) {
                    var a = Math.random() * Math.PI * 2;
                    var d = Math.sqrt(Math.random()) * r;
                    var sx = x + Math.cos(a) * d;
                    var sy = y + Math.sin(a) * d;
                    var dir = ang + (Math.random() - 0.5) * 0.8;
                    var len = (14 + Math.random() * 30) * sc;
                    var bend = (Math.random() - 0.5) * len * 0.7;
                    var ex = sx + Math.cos(dir) * len;
                    var ey = sy + Math.sin(dir) * len + len * 0.1;
                    var mx = (sx + ex) / 2 - Math.sin(dir) * bend;
                    var my = (sy + ey) / 2 + Math.cos(dir) * bend;
                    var w = 0.5 + Math.random() * 1.1;

                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo(mx, my, ex, ey);
                    if (Math.random() < 0.45) {
                        ctx.strokeStyle = 'rgba(30,16,6,0.12)';
                        ctx.lineWidth = w + 0.9;
                        ctx.stroke();
                    }
                    ctx.strokeStyle = furColor(sx, sy, 0.55 + Math.random() * 0.4);
                    ctx.lineWidth = w;
                    ctx.stroke();
                }
            }

            function rad() {
                var m = Math.min(W, H);
                return isPhone() ? Math.max(52, m * 0.15) : Math.max(46, m * 0.07);
            }

            function mark(x, y, r) {
                var cw = W / GX, ch = H / GY;
                var x0 = Math.max(0, Math.floor((x - r) / cw));
                var x1 = Math.min(GX - 1, Math.floor((x + r) / cw));
                var y0 = Math.max(0, Math.floor((y - r) / ch));
                var y1 = Math.min(GY - 1, Math.floor((y + r) / ch));
                var lim = r * r * 0.8;
                for (var gy = y0; gy <= y1; gy++) {
                    for (var gx = x0; gx <= x1; gx++) {
                        var dx = (gx + 0.5) * cw - x;
                        var dy = (gy + 0.5) * ch - y;
                        if (dx * dx + dy * dy <= lim) {
                            var i = gy * GX + gx;
                            if (!grid[i]) { grid[i] = 1; covered++; }
                        }
                    }
                }
            }

            function paint(x, y, ang) {
                var r = rad();
                stamp(x, y, ang, r, isPhone() ? 18 : 22);
                mark(x, y, r);
            }

            function updateProgress() {
                var p = covered / TOTAL;
                var shown = Math.min(100, Math.round(p / THRESHOLD * 100));
                meter.textContent = shown + '% fur';
                bar.style.width = shown + '%';
                return p;
            }

            function buzz() {
                if (!isPhone() || !navigator.vibrate) return;
                var now = performance.now();
                if (now - lastBuzz > 70) {
                    navigator.vibrate(6);
                    lastBuzz = now;
                }
            }

            /* ---------- Pointer input ---------- */

            canvas.addEventListener('pointerdown', function (e) {
                if (complete) return;
                e.preventDefault();
                drawing = true;
                try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
                last = { x: e.clientX, y: e.clientY };
                vx = 0; vy = 1;
                hint.classList.add('hide');
                paint(e.clientX, e.clientY, Math.PI / 2);
                checkDone();
            });

            canvas.addEventListener('pointermove', function (e) {
                setGaze(e.clientX, e.clientY);
                if (!drawing || complete) return;
                var dx = e.clientX - last.x;
                var dy = e.clientY - last.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                var sp = rad() * 0.4;
                if (dist < sp) return;

                vx = vx * 0.5 + (dx / dist) * 0.5;
                vy = vy * 0.5 + (dy / dist) * 0.5;
                var ang = Math.atan2(vy, vx);
                var n = Math.floor(dist / sp);
                for (var i = 1; i <= n; i++) {
                    paint(last.x + (dx / dist) * sp * i, last.y + (dy / dist) * sp * i, ang);
                }
                last = { x: last.x + (dx / dist) * sp * n, y: last.y + (dy / dist) * sp * n };
                buzz();
                checkDone();
            });

            function stop() { drawing = false; }
            canvas.addEventListener('pointerup', stop);
            canvas.addEventListener('pointercancel', stop);

            function checkDone() {
                if (updateProgress() >= THRESHOLD && !complete) finish();
            }

            /* ---------- Finish: fill gaps, then reveal the face ---------- */

            function finish() {
                complete = true;
                drawing = false;

                var cw = W / GX, ch = H / GY;
                for (var gy = 0; gy < GY; gy++) {
                    for (var gx = 0; gx < GX; gx++) {
                        if (!grid[gy * GX + gx]) {
                            stamp((gx + 0.5) * cw, (gy + 0.5) * ch, Math.PI / 2 + (Math.random() - 0.5), Math.max(cw, ch) * 0.8, 26);
                        }
                    }
                }

                base = document.createElement('canvas');
                base.width = canvas.width;
                base.height = canvas.height;
                base.getContext('2d').drawImage(canvas, 0, 0);

                buildLayers();
                document.body.classList.add('done');
                again.hidden = false;
                animStart = performance.now();
                kick();
            }

            /* ---------- Face: drawn in device pixels ---------- */

            function computeGeo() {
                var Wd = canvas.width, Hd = canvas.height;
                var s = isPhone() ? Math.min(Wd * 0.34, Hd * 0.26) : Math.min(Wd * 0.34, Hd * 0.36);
                return { s: s, cx: Wd / 2, cy: Hd * 0.5 };
            }

            function mkLayer() {
                var l = document.createElement('canvas');
                l.width = canvas.width;
                l.height = canvas.height;
                return l;
            }

            function buildLayers() {
                geo = computeGeo();
                layers = { ears: mkLayer(), nose: mkLayer(), mouth: mkLayer() };
                buildEars(layers.ears.getContext('2d'), geo);
                buildNose(layers.nose.getContext('2d'), geo);
                buildMouth(layers.mouth.getContext('2d'), geo);
            }

            function strandsIn(c, test, box, tries, ang, spread, lmin, lmax, rgb, lw, alpha) {
                c.lineCap = 'round';
                for (var i = 0; i < tries; i++) {
                    var x = box[0] + Math.random() * (box[2] - box[0]);
                    var y = box[1] + Math.random() * (box[3] - box[1]);
                    if (!test(x, y)) continue;
                    var b = typeof ang === 'function' ? ang(x, y) : ang;
                    var dir = b + (Math.random() - 0.5) * spread;
                    var len = lmin + Math.random() * (lmax - lmin);
                    var bend = (Math.random() - 0.5) * len * 0.5;
                    var ex = x + Math.cos(dir) * len;
                    var ey = y + Math.sin(dir) * len;
                    var mx = (x + ex) / 2 - Math.sin(dir) * bend;
                    var my = (y + ey) / 2 + Math.cos(dir) * bend;
                    var l = 0.7 + Math.random() * 0.7;
                    c.strokeStyle = 'rgba(' + cl(rgb[0] * l) + ',' + cl(rgb[1] * l) + ',' + cl(rgb[2] * l) + ',' + (alpha * (0.6 + Math.random() * 0.4)).toFixed(2) + ')';
                    c.lineWidth = lw * (0.6 + Math.random() * 0.8);
                    c.beginPath();
                    c.moveTo(x, y);
                    c.quadraticCurveTo(mx, my, ex, ey);
                    c.stroke();
                }
            }

            /* Ears */
            function earPath(g, sign) {
                var p = new Path2D();
                var s = g.s, cx = g.cx, cy = g.cy;
                function X(u) { return cx + sign * u * s; }
                function Y(v) { return cy + v * s; }
                p.moveTo(X(0.52), Y(-0.8));
                p.bezierCurveTo(X(0.95), Y(-0.98), X(1.38), Y(-0.55), X(1.34), Y(-0.05));
                p.bezierCurveTo(X(1.31), Y(0.40), X(1.12), Y(0.78), X(0.92), Y(0.72));
                p.bezierCurveTo(X(0.72), Y(0.66), X(0.62), Y(0.20), X(0.58), Y(-0.12));
                p.bezierCurveTo(X(0.55), Y(-0.35), X(0.52), Y(-0.55), X(0.52), Y(-0.8));
                p.closePath();
                return p;
            }

            function buildEars(c, g) {
                var s = g.s, k = dpr;
                [-1, 1].forEach(function (sign) {
                    var path = earPath(g, sign);
                    var y0 = g.cy - 0.9 * s, y1 = g.cy + 0.8 * s;
                    var grad = c.createLinearGradient(0, y0, 0, y1);
                    grad.addColorStop(0, '#5c3a1e');
                    grad.addColorStop(1, '#2b1809');

                    c.save();
                    c.shadowColor = 'rgba(0,0,0,0.45)';
                    c.shadowBlur = s * 0.08;
                    c.shadowOffsetY = s * 0.02;
                    c.fillStyle = grad;
                    c.fill(path);
                    c.restore();

                    var xa = g.cx + sign * 0.5 * s, xb = g.cx + sign * 1.4 * s;
                    var box = [Math.min(xa, xb), g.cy - 1.0 * s, Math.max(xa, xb), g.cy + 0.8 * s];
                    var test = function (x, y) { return c.isPointInPath(path, x, y); };
                    var ang = Math.PI / 2 - sign * 0.2;

                    strandsIn(c, test, box, s * 60, ang, 0.9, s * 0.05, s * 0.13, [62, 36, 17], 1.4 * k, 0.85);
                    strandsIn(c, test, box, s * 28, ang, 1.0, s * 0.05, s * 0.12, [95, 60, 30], 1.2 * k, 0.7);
                    strandsIn(c, test, box, s * 10, ang, 1.0, s * 0.04, s * 0.09, [150, 105, 60], 1.0 * k, 0.45);
                });
            }

            /* Muzzle + nose */
            function nosePath(g) {
                var p = new Path2D();
                var s = g.s, cx = g.cx, cy = g.cy;
                function X(u) { return cx + u * s; }
                function Y(v) { return cy + v * s; }
                p.moveTo(X(-0.20), Y(0.26));
                p.bezierCurveTo(X(-0.20), Y(0.20), X(0.20), Y(0.20), X(0.20), Y(0.26));
                p.bezierCurveTo(X(0.20), Y(0.36), X(0.09), Y(0.46), X(0), Y(0.47));
                p.bezierCurveTo(X(-0.09), Y(0.46), X(-0.20), Y(0.36), X(-0.20), Y(0.26));
                p.closePath();
                return p;
            }

            function buildNose(c, g) {
                var s = g.s, cx = g.cx, cy = g.cy, k = dpr;
                var my = cy + 0.52 * s;

                // Light fur on the muzzle
                c.save();
                c.translate(cx, my);
                c.scale(1, 0.77);
                var mg = c.createRadialGradient(0, 0, 0, 0, 0, 0.6 * s);
                mg.addColorStop(0, 'rgba(238,216,178,0.95)');
                mg.addColorStop(0.55, 'rgba(222,190,140,0.82)');
                mg.addColorStop(1, 'rgba(200,160,110,0)');
                c.fillStyle = mg;
                c.beginPath();
                c.arc(0, 0, 0.6 * s, 0, Math.PI * 2);
                c.fill();
                c.restore();

                var mtest = function (x, y) {
                    var a = (x - cx) / (0.55 * s), b = (y - my) / (0.42 * s);
                    return a * a + b * b < 1;
                };
                var mbox = [cx - 0.6 * s, my - 0.45 * s, cx + 0.6 * s, my + 0.45 * s];
                var fan = function (x) { return Math.PI / 2 + ((x - cx) / s) * 0.35; };
                strandsIn(c, mtest, mbox, s * 40, fan, 0.8, s * 0.04, s * 0.1, [226, 200, 158], 1.1 * k, 0.7);
                strandsIn(c, mtest, mbox, s * 18, fan, 0.8, s * 0.04, s * 0.09, [180, 140, 92], 1.0 * k, 0.5);
                strandsIn(c, mtest, mbox, s * 10, fan, 0.8, s * 0.04, s * 0.09, [250, 238, 215], 0.9 * k, 0.55);

                // Nose
                var np = nosePath(g);
                var ng = c.createRadialGradient(cx - 0.05 * s, cy + 0.29 * s, 0, cx, cy + 0.33 * s, 0.26 * s);
                ng.addColorStop(0, '#3a3a3c');
                ng.addColorStop(1, '#070707');
                c.save();
                c.shadowColor = 'rgba(0,0,0,0.5)';
                c.shadowBlur = s * 0.03;
                c.shadowOffsetY = s * 0.015;
                c.fillStyle = ng;
                c.fill(np);
                c.restore();

                // Leathery texture
                c.fillStyle = 'rgba(255,255,255,0.10)';
                for (var i = 0; i < s * 3; i++) {
                    var x = cx + (Math.random() - 0.5) * 0.42 * s;
                    var y = cy + 0.2 * s + Math.random() * 0.28 * s;
                    if (c.isPointInPath(np, x, y)) {
                        c.beginPath();
                        c.arc(x, y, (0.4 + Math.random() * 0.8) * k, 0, Math.PI * 2);
                        c.fill();
                    }
                }

                // Nostrils
                c.fillStyle = 'rgba(0,0,0,0.95)';
                [-1, 1].forEach(function (sg) {
                    c.beginPath();
                    c.ellipse(cx + sg * 0.085 * s, cy + 0.385 * s, 0.038 * s, 0.018 * s, sg * 0.5, 0, Math.PI * 2);
                    c.fill();
                });
                c.strokeStyle = 'rgba(0,0,0,0.9)';
                c.lineWidth = 0.012 * s;
                c.lineCap = 'round';
                c.beginPath();
                c.moveTo(cx, cy + 0.40 * s);
                c.lineTo(cx, cy + 0.47 * s);
                c.stroke();

                // Wet highlight
                c.save();
                c.filter = 'blur(' + Math.max(1, s * 0.008) + 'px)';
                c.fillStyle = 'rgba(255,255,255,0.5)';
                c.beginPath();
                c.ellipse(cx - 0.07 * s, cy + 0.275 * s, 0.07 * s, 0.025 * s, -0.2, 0, Math.PI * 2);
                c.fill();
                c.restore();
            }

            /* Mouth + tongue */
            function buildMouth(c, g) {
                var s = g.s, cx = g.cx, cy = g.cy;
                function X(u) { return cx + u * s; }
                function Y(v) { return cy + v * s; }

                var m = new Path2D();
                m.moveTo(X(-0.33), Y(0.62));
                m.bezierCurveTo(X(-0.22), Y(0.72), X(-0.06), Y(0.70), X(0), Y(0.58));
                m.bezierCurveTo(X(0.06), Y(0.70), X(0.22), Y(0.72), X(0.33), Y(0.62));
                m.bezierCurveTo(X(0.28), Y(0.92), X(-0.28), Y(0.92), X(-0.33), Y(0.62));
                m.closePath();

                var mg = c.createLinearGradient(0, Y(0.58), 0, Y(0.9));
                mg.addColorStop(0, '#4a1a1a');
                mg.addColorStop(1, '#1c0808');
                c.fillStyle = mg;
                c.fill(m);

                // Tongue, clipped to the mouth
                c.save();
                c.clip(m);
                var t = new Path2D();
                t.moveTo(X(-0.15), Y(0.66));
                t.bezierCurveTo(X(-0.17), Y(0.94), X(0.17), Y(0.94), X(0.15), Y(0.66));
                t.closePath();
                var tg = c.createRadialGradient(X(0), Y(0.72), 0, X(0), Y(0.78), 0.2 * s);
                tg.addColorStop(0, '#ee8d93');
                tg.addColorStop(1, '#bb4756');
                c.fillStyle = tg;
                c.fill(t);
                c.strokeStyle = 'rgba(120,30,45,0.55)';
                c.lineWidth = 0.008 * s;
                c.lineCap = 'round';
                c.beginPath();
                c.moveTo(X(0), Y(0.68));
                c.lineTo(X(0), Y(0.82));
                c.stroke();
                c.fillStyle = 'rgba(255,255,255,0.28)';
                c.beginPath();
                c.ellipse(X(-0.045), Y(0.75), 0.04 * s, 0.018 * s, -0.4, 0, Math.PI * 2);
                c.fill();
                c.restore();

                // Lip lines
                c.strokeStyle = '#150805';
                c.lineWidth = 0.017 * s;
                c.lineCap = 'round';
                c.lineJoin = 'round';
                c.beginPath();
                c.moveTo(X(0), Y(0.47));
                c.lineTo(X(0), Y(0.58));
                c.stroke();
                c.beginPath();
                c.moveTo(X(-0.33), Y(0.62));
                c.bezierCurveTo(X(-0.22), Y(0.72), X(-0.06), Y(0.70), X(0), Y(0.58));
                c.bezierCurveTo(X(0.06), Y(0.70), X(0.22), Y(0.72), X(0.33), Y(0.62));
                c.stroke();
                c.strokeStyle = 'rgba(20,8,4,0.5)';
                c.lineWidth = 0.01 * s;
                c.beginPath();
                c.moveTo(X(-0.33), Y(0.62));
                c.bezierCurveTo(X(-0.28), Y(0.92), X(0.28), Y(0.92), X(0.33), Y(0.62));
                c.stroke();

                // Whisker pores
                c.fillStyle = 'rgba(30,16,8,0.55)';
                [-1, 1].forEach(function (sg) {
                    for (var j = 0; j < 6; j++) {
                        c.beginPath();
                        c.arc(X(sg * (0.17 + 0.05 * j)), Y(0.47 + 0.03 * (j % 2) + 0.01 * j), 0.008 * s, 0, Math.PI * 2);
                        c.fill();
                    }
                });
            }

            /* Eyes: drawn live, so the pupils can follow the pointer */
            function drawEyes(c, g, a) {
                if (a <= 0) return;
                var s = g.s, k = dpr;
                var lx = gaze.x * s * 0.028;
                var ly = gaze.y * s * 0.02;
                c.save();
                c.globalAlpha = a;

                [-1, 1].forEach(function (sg) {
                    var ex = g.cx + sg * 0.42 * s;
                    var ey = g.cy - 0.12 * s;

                    // Soft shadow around the socket
                    var sh = c.createRadialGradient(ex, ey, 0, ex, ey, 0.22 * s);
                    sh.addColorStop(0, 'rgba(25,12,5,0.6)');
                    sh.addColorStop(0.6, 'rgba(25,12,5,0.28)');
                    sh.addColorStop(1, 'rgba(25,12,5,0)');
                    c.fillStyle = sh;
                    c.beginPath();
                    c.arc(ex, ey, 0.22 * s, 0, Math.PI * 2);
                    c.fill();

                    // Tan eyebrow tufts
                    c.strokeStyle = 'rgba(214,172,112,0.8)';
                    c.lineCap = 'round';
                    c.lineWidth = 1.6 * k;
                    for (var j = 0; j < 6; j++) {
                        var bx = ex + (j - 2.5) * 0.04 * s;
                        var by = ey - 0.2 * s - Math.abs(j - 2.5) * 0.008 * s;
                        c.beginPath();
                        c.moveTo(bx, by);
                        c.lineTo(bx + sg * 0.012 * s, by - 0.045 * s);
                        c.stroke();
                    }

                    var ix = ex - sg * 0.12 * s, iy = ey;
                    var ox = ex + sg * 0.12 * s, oy = ey + 0.03 * s;
                    var top = new Path2D();
                    top.moveTo(ix, iy);
                    top.bezierCurveTo(ex - sg * 0.07 * s, ey - 0.11 * s, ex + sg * 0.06 * s, ey - 0.11 * s, ox, oy);
                    var eye = new Path2D();
                    eye.moveTo(ix, iy);
                    eye.bezierCurveTo(ex - sg * 0.07 * s, ey - 0.11 * s, ex + sg * 0.06 * s, ey - 0.11 * s, ox, oy);
                    eye.bezierCurveTo(ex + sg * 0.06 * s, ey + 0.095 * s, ex - sg * 0.07 * s, ey + 0.09 * s, ix, iy);
                    eye.closePath();

                    c.save();
                    c.clip(eye);
                    c.fillStyle = '#1b0f07';
                    c.fillRect(ex - 0.2 * s, ey - 0.2 * s, 0.4 * s, 0.4 * s);

                    var px = ex + lx, py = ey + ly + 0.008 * s;
                    var ig = c.createRadialGradient(px, py, 0, px, py, 0.088 * s);
                    ig.addColorStop(0, '#d49a45');
                    ig.addColorStop(0.35, '#a0661f');
                    ig.addColorStop(0.75, '#5b3510');
                    ig.addColorStop(1, '#1d0f05');
                    c.fillStyle = ig;
                    c.beginPath();
                    c.arc(px, py, 0.088 * s, 0, Math.PI * 2);
                    c.fill();

                    c.fillStyle = '#000';
                    c.beginPath();
                    c.arc(px, py, 0.042 * s, 0, Math.PI * 2);
                    c.fill();

                    // Shadow from the upper lid
                    var lg = c.createLinearGradient(0, ey - 0.1 * s, 0, ey + 0.01 * s);
                    lg.addColorStop(0, 'rgba(0,0,0,0.7)');
                    lg.addColorStop(1, 'rgba(0,0,0,0)');
                    c.fillStyle = lg;
                    c.fillRect(ex - 0.2 * s, ey - 0.12 * s, 0.4 * s, 0.14 * s);

                    // Highlights
                    c.fillStyle = 'rgba(255,255,255,0.95)';
                    c.beginPath();
                    c.arc(px - 0.03 * s, py - 0.03 * s, 0.018 * s, 0, Math.PI * 2);
                    c.fill();
                    c.fillStyle = 'rgba(255,255,255,0.6)';
                    c.beginPath();
                    c.arc(px + 0.027 * s, py + 0.025 * s, 0.008 * s, 0, Math.PI * 2);
                    c.fill();
                    c.restore();

                    // Eyelids
                    c.strokeStyle = '#120804';
                    c.lineWidth = 0.017 * s;
                    c.lineCap = 'round';
                    c.stroke(top);
                    c.strokeStyle = 'rgba(120,70,60,0.55)';
                    c.lineWidth = 0.008 * s;
                    c.beginPath();
                    c.moveTo(ix, iy);
                    c.bezierCurveTo(ex - sg * 0.07 * s, ey + 0.09 * s, ex + sg * 0.06 * s, ey + 0.095 * s, ox, oy);
                    c.stroke();
                });
                c.restore();
            }

            /* ---------- Reveal loop ---------- */

            function setGaze(x, y) {
                if (!complete) return;
                gaze.tx = Math.max(-1, Math.min(1, (x - W / 2) / (W / 2)));
                gaze.ty = Math.max(-1, Math.min(1, (y - H / 2) / (H / 2)));
                kick();
            }

            function frame(now) {
                rafId = 0;
                if (!complete || !base) return;
                var t = now - animStart;
                var c = ctx;
                c.setTransform(1, 0, 0, 1, 0, 0);
                c.globalAlpha = 1;
                c.clearRect(0, 0, canvas.width, canvas.height);
                c.drawImage(base, 0, 0);

                c.globalAlpha = ease(clamp01(t / 900));
                c.drawImage(layers.ears, 0, 0);

                c.globalAlpha = 1;
                drawEyes(c, geo, ease(clamp01((t - 900) / 900)));

                c.globalAlpha = ease(clamp01((t - 1800) / 800));
                c.drawImage(layers.nose, 0, 0);

                c.globalAlpha = ease(clamp01((t - 2600) / 900));
                c.drawImage(layers.mouth, 0, 0);
                c.globalAlpha = 1;

                gaze.x += (gaze.tx - gaze.x) * 0.18;
                gaze.y += (gaze.ty - gaze.y) * 0.18;
                var moving = Math.abs(gaze.tx - gaze.x) > 0.002 || Math.abs(gaze.ty - gaze.y) > 0.002;
                if (t < 3600 || moving) rafId = requestAnimationFrame(frame);
            }

            function kick() {
                if (!rafId && complete) rafId = requestAnimationFrame(frame);
            }

            /* ---------- Reset ---------- */

            again.addEventListener('click', function () {
                complete = false;
                drawing = false;
                if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
                grid.fill(0);
                covered = 0;
                base = null;
                layers = null;
                gaze.x = gaze.y = gaze.tx = gaze.ty = 0;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.globalAlpha = 1;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                document.body.classList.remove('done');
                again.hidden = true;
                hint.classList.remove('hide');
                updateProgress();
            });

            /* ---------- Resize ---------- */

            function resize() {
                var src = complete && base ? base : canvas;
                var tmp = document.createElement('canvas');
                tmp.width = src.width;
                tmp.height = src.height;
                tmp.getContext('2d').drawImage(src, 0, 0);

                W = window.innerWidth;
                H = window.innerHeight;
                dpr = Math.min(window.devicePixelRatio || 1, 2);
                canvas.width = Math.round(W * dpr);
                canvas.height = Math.round(H * dpr);

                ctx.setTransform(1, 0, 0, 1, 0, 0);
                if (tmp.width > 0 && tmp.height > 0) {
                    ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
                }

                if (complete) {
                    base = document.createElement('canvas');
                    base.width = canvas.width;
                    base.height = canvas.height;
                    base.getContext('2d').drawImage(tmp, 0, 0, base.width, base.height);
                    buildLayers();
                    animStart = performance.now() - 10000;
                    kick();
                } else {
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                }
            }

            var resizeTimer = 0;
            window.addEventListener('resize', function () {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(resize, 120);
            });

            resize();
            updateProgress();
        })();
    </script>
</body>
</html>
