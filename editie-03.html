<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 03</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --background: #FFFFFF;
            --gap: clamp(0.5rem, 0.9vw, 0.9rem);
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: var(--background);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        /* ---------- Navigatie (zelfde als editie 1 en 2) ---------- */

        .nav-links {
            position: fixed;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .nav-link {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
            pointer-events: auto;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        #app {
            animation: fadeIn 0.5s ease-out;
        }

        /* =========================================================
           LEZING 1: TELEFOON. Lijst, nieuwste eerst, kleine beelden
           ========================================================= */

        .list {
            list-style: none;
            padding: 1.5rem clamp(1rem, 5vw, 1.5rem) 5rem;
        }

        .list-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--brown);
        }

        .row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(107, 68, 35, 0.35);
            animation: fadeIn 0.5s ease-out backwards;
        }

        .row img {
            width: 76px;
            height: 76px;
            flex: none;
            object-fit: cover;
            border: 2px solid var(--brown);
            border-radius: 4px;
            display: block;
        }

        .row-num {
            color: var(--neon);
            font-size: 2.2rem;
            line-height: 1;
            width: 3.2rem;
            flex: none;
            font-variant-numeric: tabular-nums;
        }

        .row-text {
            min-width: 0;
            flex: 1;
        }

        .row-name {
            font-size: 1.35rem;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .row-bark {
            font-size: 0.85rem;
            margin-top: 0.35rem;
            opacity: 0.85;
        }

        .dots {
            display: flex;
            gap: 4px;
            margin-top: 0.5rem;
        }

        .dots i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: 1.5px solid var(--neon);
            display: block;
        }

        .dots i.on {
            background: var(--neon);
        }

        /* Onderin de telefoon: witte balk zodat de lijst er netjes achter verdwijnt */
        @media (max-width: 899px) {
            .nav-links {
                bottom: 0;
                left: 0;
                right: 0;
                padding: 0.9rem clamp(1rem, 5vw, 1.5rem);
                background: linear-gradient(to top, #fff 70%, rgba(255, 255, 255, 0));
            }

            .nav-link {
                font-size: 1rem;
            }
        }

        /* =========================================================
           LEZING 2: LAPTOP. Raster, gesorteerd op volume, groot nummer
           ========================================================= */

        @media (min-width: 900px) {
            html,
            body {
                height: 100%;
                overflow: hidden;
            }

            .grid {
                position: absolute;
                top: 1.5rem;
                bottom: 4.5rem;
                left: 3vw;
                right: 3vw;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                grid-template-rows: repeat(3, 1fr);
                gap: var(--gap);
            }

            .tile {
                position: relative;
                overflow: hidden;
                border: 2px solid var(--brown);
                border-radius: 4px;
                background: #fff;
                outline: none;
                cursor: default;
                animation: fadeIn 0.6s ease-out backwards;
            }

            .tile img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .tile::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient(to bottom, rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0) 45%);
                pointer-events: none;
            }

            .tile-num {
                position: absolute;
                top: 0.2rem;
                left: 0.7rem;
                z-index: 2;
                color: var(--neon);
                font-size: clamp(2.6rem, 6.5vw, 6.5rem);
                line-height: 1;
                letter-spacing: -0.04em;
                font-variant-numeric: tabular-nums;
                pointer-events: none;
            }

            .tile-name {
                position: absolute;
                top: 0.9rem;
                right: 0.8rem;
                z-index: 2;
                color: #fff;
                font-size: clamp(0.7rem, 1.1vw, 0.95rem);
                pointer-events: none;
            }

            .tile-bark {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 3;
                padding: 0.5rem 0.8rem;
                background: #fff;
                color: var(--neon);
                font-size: clamp(0.9rem, 1.6vw, 1.4rem);
                transform: translateY(101%);
                transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
            }

            .tile:hover img,
            .tile:focus-visible img {
                transform: scale(1.06);
            }

            .tile:hover .tile-bark,
            .tile:focus-visible .tile-bark {
                transform: translateY(0);
            }

            .tile-note {
                border: none;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 0 0.2rem 0.2rem;
                font-size: clamp(0.8rem, 1.4vw, 1.1rem);
                line-height: 1.3;
            }

            .tile-note .scale {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                margin-top: 0.8rem;
                color: var(--neon);
                font-size: 0.8rem;
            }

            .tile-note .scale span {
                flex: 1;
                height: 2px;
                background: var(--neon);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #app,
            .row,
            .tile {
                animation: none;
            }

            .tile img,
            .tile-bark {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main id="app"></main>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-02.html" class="nav-link">← Edition 02</a>
        <a href="editie-04.html" class="nav-link">Edition 04 →</a>
    </nav>

    <script>
        (function () {
            var BASE = 'https://indi2601.github.io/dogdaysarenotover/';

            // Het materiaal: 11 honden, in volgorde van ontmoeting (1 = eerste, 11 = laatste).
            // loud: blafvolume van 1 (zacht) tot 5 (luid). Pas namen, blaf en volume gerust aan.
            var DOGS = [
                { id: 1,  file: 'IMG_8804.jpeg', name: 'Biscuit', bark: 'Waf! Waf-waf!',               loud: 2 },
                { id: 2,  file: 'IMG_8806.jpeg', name: 'Mochi',   bark: 'Waf-waf! WOOF!',              loud: 3 },
                { id: 3,  file: 'IMG_8817.jpeg', name: 'Pepper',  bark: 'WAF! WAF! WAF! Waf-waf-waf!', loud: 5 },
                { id: 4,  file: 'IMG_8818.jpeg', name: 'Olive',   bark: 'Waf! Woef! Hrr-waf!',         loud: 2 },
                { id: 5,  file: 'IMG_8821.jpeg', name: 'Nacho',   bark: 'WOOF! Waf! WOOF!',            loud: 4 },
                { id: 6,  file: 'IMG_8822.jpeg', name: 'Waffle',  bark: 'Waf! Waf! Waf-waf!',          loud: 1 },
                { id: 7,  file: 'IMG_8879.jpeg', name: 'Juno',    bark: 'WAF! WAF-waf!',               loud: 3 },
                { id: 8,  file: 'IMG_8819.jpeg', name: 'Milo',    bark: 'Waf! Waf-waf!',               loud: 1 },
                { id: 9,  file: 'IMG_8936.jpeg', name: 'Fenna',   bark: 'WAF-WAF-WAF-WAF!',            loud: 5 },
                { id: 10, file: 'IMG_8942.jpeg', name: 'Rocco',   bark: 'WOOF! Waf! WOOF!',            loud: 4 },
                { id: 11, file: 'IMG_8945.jpeg', name: 'Sunny',   bark: 'Waf-waf! WOOF!',              loud: 3 }
            ];

            var app = document.getElementById('app');
            var mq = window.matchMedia('(min-width: 900px)');

            function two(n) { return (n < 10 ? '0' : '') + n; }

            function dots(level) {
                var s = '';
                for (var i = 1; i <= 5; i++) s += '<i class="' + (i <= level ? 'on' : '') + '"></i>';
                return '<div class="dots" aria-label="Volume ' + level + ' of 5">' + s + '</div>';
            }

            // Telefoon: lijst, nieuwste bovenaan
            function renderPhone() {
                var items = DOGS.slice().sort(function (a, b) { return b.id - a.id; });
                var html = '<ul class="list"><li class="list-label">' + DOGS.length + ' dogs · newest first</li>';
                items.forEach(function (d, i) {
                    html +=
                        '<li class="row" style="animation-delay:' + (i * 0.04).toFixed(2) + 's">' +
                            '<span class="row-num">' + two(d.id) + '</span>' +
                            '<img src="' + BASE + d.file + '" alt="' + d.name + '" loading="lazy">' +
                            '<div class="row-text">' +
                                '<div class="row-name">' + d.name + '</div>' +
                                '<div class="row-bark">' + d.bark + '</div>' +
                                dots(d.loud) +
                            '</div>' +
                        '</li>';
                });
                html += '</ul>';
                app.innerHTML = html;
            }

            // Laptop: raster, van zacht naar luid, groot nummer op het beeld
            function renderLaptop() {
                var items = DOGS.slice().sort(function (a, b) { return a.loud - b.loud || a.id - b.id; });
                var html = '<div class="grid">';
                items.forEach(function (d, i) {
                    html +=
                        '<div class="tile" tabindex="0" style="animation-delay:' + (i * 0.05).toFixed(2) + 's">' +
                            '<img src="' + BASE + d.file + '" alt="' + d.name + '">' +
                            '<span class="tile-num">' + two(d.id) + '</span>' +
                            '<span class="tile-name">' + d.name + '</span>' +
                            '<div class="tile-bark">' + d.bark + '</div>' +
                        '</div>';
                });
                html +=
                    '<div class="tile tile-note">' +
                        '<div>' + DOGS.length + ' dogs.<br>Sorted by volume.<br>Hover for the bark.</div>' +
                        '<div class="scale">quiet <span></span> loud</div>' +
                    '</div>';
                html += '</div>';
                app.innerHTML = html;
            }

            var current = null;

            function render() {
                var mode = mq.matches ? 'laptop' : 'phone';
                if (mode === current) return;
                current = mode;
                if (mode === 'laptop') renderLaptop(); else renderPhone();
                window.scrollTo(0, 0);
            }

            if (mq.addEventListener) mq.addEventListener('change', render);
            else mq.addListener(render);

            render();
        })();
    </script>
</body>
</html>
