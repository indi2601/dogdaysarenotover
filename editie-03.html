<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Edition 03</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
            --cream: #f3e7cf;
            --pale: #ffc9e6;
            --tan: #d9b98f;
            --white: #FFFFFF;
            --bar: 5.4rem;
            --edge: clamp(0.8rem, 2vw, 1.5rem);
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            background: var(--white);
            color: var(--brown);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        #app {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: var(--bar);
            animation: fadeIn 0.5s ease-out;
        }

        /* ---------- Eén kleur per soort ---------- */

        .t-sleep   { --bg: var(--brown); --fg: var(--cream); }
        .t-walk    { --bg: var(--cream); --fg: var(--brown); }
        .t-eat     { --bg: var(--neon);  --fg: var(--white); }
        .t-play    { --bg: var(--pale);  --fg: var(--neon); }
        .t-cuddle  { --bg: var(--tan);   --fg: var(--brown); }
        .t-zoomies { --bg: var(--brown); --fg: var(--neon); }

        /* ---------- Navigatie (zelfde als editie 1, 2 en 4) ---------- */

        .nav-links {
            position: fixed;
            bottom: var(--edge);
            left: var(--edge);
            right: var(--edge);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }

        .nav-link {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--neon);
            text-transform: none;
            letter-spacing: 0;
            text-decoration: none;
            white-space: nowrap;
            transition: opacity 0.25s ease;
            outline: none;
            pointer-events: auto;
        }

        .nav-link:hover,
        .nav-link:focus,
        .nav-link:focus-visible {
            opacity: 0.7;
            outline: none;
        }

        /* =========================================================
           LEZING 1: TELEFOON
           Eén moment tegelijk, beeldvullend. Vegen is bladeren.
           ========================================================= */

        .slides {
            display: flex;
            width: 100%;
            height: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x mandatory;
            overscroll-behavior-x: contain;
            scrollbar-width: none;
        }

        .slides::-webkit-scrollbar {
            display: none;
        }

        .slide {
            flex: 0 0 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding: var(--edge) var(--edge) 1.4rem;
            background: var(--bg);
            color: var(--fg);
        }

        .strip {
            display: flex;
            gap: 3px;
            height: 6px;
            width: 100%;
            flex: none;
        }

        .strip i {
            display: block;
            background: currentColor;
            opacity: 0.25;
            min-width: 2px;
        }

        .strip i.on {
            opacity: 1;
        }

        .slide .meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 0.15rem;
            margin-top: 1rem;
            font-size: 1.05rem;
            font-variant-numeric: tabular-nums;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .slide .word {
            margin-top: auto;
            font-size: 18vw;
            line-height: 0.85;
            letter-spacing: -0.045em;
            text-transform: uppercase;
        }

        /* =========================================================
           LEZING 2: LAPTOP
           De hele dag in één affiche. Baanhoogte = duur van het moment.
           ========================================================= */

        .board {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .top {
            flex: 0 0 22vh;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding: var(--edge) var(--edge) 0;
            background: var(--white);
        }

        .top-tag {
            font-size: clamp(0.8rem, 1.5vw, 1.05rem);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-variant-numeric: tabular-nums;
        }

        .top-word {
            font-size: 15vh;
            line-height: 0.85;
            letter-spacing: -0.05em;
            text-transform: uppercase;
            color: var(--neon);
            margin-top: 0.5rem;
            white-space: nowrap;
        }

        .top-word.preview {
            color: var(--brown);
        }

        .stack {
            position: relative;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .band {
            flex: var(--d) 1 0;
            min-height: 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1.5rem;
            padding: 0 var(--edge);
            background: var(--bg);
            color: var(--fg);
            font-size: clamp(0.6rem, 2.2vh, 1.4rem);
            line-height: 1;
            letter-spacing: 0;
            text-transform: uppercase;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            overflow: hidden;
            cursor: default;
            outline: none;
            animation: fadeIn 0.6s ease-out backwards;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .band .bt {
            width: 11ch;
            text-align: right;
        }

        .band .bw {
            width: 9ch;
            text-align: right;
        }

        .band:hover,
        .band:focus-visible {
            background: var(--fg);
            color: var(--bg);
        }

        /* Minimalistische lijn van de huidige tijd */
        .nowline {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            margin-top: -1px;
            background: #fff;
            mix-blend-mode: difference;
            pointer-events: none;
            z-index: 5;
        }

        .nowline::before {
            content: "";
            position: absolute;
            left: var(--edge);
            top: 50%;
            width: 9px;
            height: 9px;
            margin-top: -4.5px;
            border-radius: 50%;
            background: #fff;
        }

        @media (max-width: 899px) {
            .nav-link {
                font-size: 1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            #app,
            .band {
                animation: none;
                transition: none;
            }
        }
    </style>
</head>

<body>
    <main id="app"></main>

    <nav class="nav-links" aria-label="Edition navigation">
        <a href="editie-02.html" class="nav-link">← Edition 02</a>
        <a href="editie-04.html" class="nav-link">Edition 04 →</a>
    </nav>

    <script>
        (function () {
            // De dag van een hond. from/to zijn uren (0 tot 24).
            // De blokken moeten samen 0 tot 24 uur dekken.
            var BLOCKS = [
                { from: 0,  to: 6,  word: 'Sleep',   type: 'sleep' },
                { from: 6,  to: 7,  word: 'Walk',    type: 'walk' },
                { from: 7,  to: 8,  word: 'Eat',     type: 'eat' },
                { from: 8,  to: 10, word: 'Walk',    type: 'walk' },
                { from: 10, to: 12, word: 'Sleep',   type: 'sleep' },
                { from: 12, to: 13, word: 'Eat',     type: 'eat' },
                { from: 13, to: 15, word: 'Sleep',   type: 'sleep' },
                { from: 15, to: 16, word: 'Play',    type: 'play' },
                { from: 16, to: 18, word: 'Walk',    type: 'walk' },
                { from: 18, to: 19, word: 'Eat',     type: 'eat' },
                { from: 19, to: 21, word: 'Cuddle',  type: 'cuddle' },
                { from: 21, to: 22, word: 'Zoomies', type: 'zoomies' },
                { from: 22, to: 24, word: 'Sleep',   type: 'sleep' }
            ];

            var app = document.getElementById('app');
            var mq = window.matchMedia('(min-width: 900px)');
            var mode = null;
            var previewIdx = -1;

            function two(n) { return (n < 10 ? '0' : '') + n; }
            function hh(h) { return two(h % 24) + ':00'; }
            function range(b) { return hh(b.from) + '\u2013' + hh(b.to); }

            function nowInfo() {
                var d = new Date();
                var mins = d.getHours() * 60 + d.getMinutes();
                var idx = 0;
                for (var i = 0; i < BLOCKS.length; i++) {
                    if (mins >= BLOCKS[i].from * 60 && mins < BLOCKS[i].to * 60) { idx = i; break; }
                }
                return { mins: mins, idx: idx, clock: two(d.getHours()) + ':' + two(d.getMinutes()) };
            }

            function dur(m) {
                var h = Math.floor(m / 60), r = m % 60;
                if (h === 0) return r + 'm';
                return h + 'h ' + (r < 10 ? '0' : '') + r + 'm';
            }

            function until(i, mins) {
                return (BLOCKS[i].from * 60 - mins + 1440) % 1440;
            }

            /* ---------- Telefoon ---------- */

            function strip(active) {
                var s = '<div class="strip" aria-hidden="true">';
                BLOCKS.forEach(function (b, k) {
                    s += '<i class="' + (k === active ? 'on' : '') + '" style="flex-grow:' + (b.to - b.from) + '"></i>';
                });
                return s + '</div>';
            }

            function renderPhone() {
                var html = '<div class="slides" id="slides">';
                BLOCKS.forEach(function (b, i) {
                    html +=
                        '<section class="slide t-' + b.type + '">' +
                            strip(i) +
                            '<div class="meta"><span>' + range(b) + '</span><span class="status"></span></div>' +
                            '<div class="word">' + b.word + '</div>' +
                        '</section>';
                });
                html += '</div>';
                app.innerHTML = html;

                var slides = document.getElementById('slides');
                var idx = nowInfo().idx;
                slides.scrollLeft = idx * slides.clientWidth;
                requestAnimationFrame(function () { slides.scrollLeft = idx * slides.clientWidth; });
                updatePhone();
            }

            function updatePhone() {
                var info = nowInfo();
                app.querySelectorAll('.slide').forEach(function (s, i) {
                    var st = s.querySelector('.status');
                    if (i === info.idx) st.textContent = 'Now ' + info.clock;
                    else if (BLOCKS[i].from * 60 > info.mins) st.textContent = 'In ' + dur(until(i, info.mins));
                    else st.textContent = 'Earlier';
                });
            }

            /* ---------- Laptop ---------- */

            function renderLaptop() {
                var bands = '';
                BLOCKS.forEach(function (b, i) {
                    bands +=
                        '<div class="band t-' + b.type + '" tabindex="0" data-i="' + i + '" ' +
                        'style="--d:' + (b.to - b.from) + ';animation-delay:' + (i * 0.04).toFixed(2) + 's">' +
                            '<span class="bt">' + range(b) + '</span><span class="bw">' + b.word + '</span>' +
                        '</div>';
                });

                app.innerHTML =
                    '<div class="board">' +
                        '<div class="top">' +
                            '<div class="top-tag" id="r-tag"></div>' +
                            '<div class="top-word" id="r-word"></div>' +
                        '</div>' +
                        '<div class="stack" id="stack">' + bands +
                            '<div class="nowline" id="nowline"></div>' +
                        '</div>' +
                    '</div>';

                app.querySelectorAll('.band').forEach(function (el) {
                    var i = parseInt(el.getAttribute('data-i'), 10);
                    function on() { previewIdx = i; updateLaptop(); }
                    function off() { previewIdx = -1; updateLaptop(); }
                    el.addEventListener('mouseenter', on);
                    el.addEventListener('mouseleave', off);
                    el.addEventListener('focus', on);
                    el.addEventListener('blur', off);
                });

                updateLaptop();
            }

            function updateLaptop() {
                var info = nowInfo();
                var shown = previewIdx >= 0 ? previewIdx : info.idx;
                var isNow = shown === info.idx;
                var b = BLOCKS[shown];
                var next = (info.idx + 1) % BLOCKS.length;

                document.getElementById('r-tag').textContent = isNow
                    ? 'Now ' + info.clock + ' \u00B7 Next: ' + BLOCKS[next].word + ' in ' + dur(until(next, info.mins))
                    : range(b);

                var w = document.getElementById('r-word');
                w.textContent = b.word;
                w.classList.toggle('preview', !isNow);

                document.getElementById('nowline').style.top = (info.mins / 1440 * 100).toFixed(3) + '%';
            }

            /* ---------- Kiezen en bijwerken ---------- */

            function render() {
                var next = mq.matches ? 'laptop' : 'phone';
                if (next === mode) return;
                mode = next;
                previewIdx = -1;
                if (mode === 'laptop') renderLaptop(); else renderPhone();
            }

            function tick() {
                if (mode === 'laptop') updateLaptop(); else updatePhone();
            }

            if (mq.addEventListener) mq.addEventListener('change', render);
            else mq.addListener(render);

            render();
            setInterval(tick, 20000);
        })();
    </script>
</body>
</html>
