<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dog Days Are Not Over – Edition 06</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@font-face{font-family:'Neue Haas Grotesk';src:url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--brown:#6b4423;--pink:#ff2fa8;--cream:#f3e7cf;--edge:clamp(.8rem,2vw,1.5rem)}
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}body{background:var(--cream);color:var(--brown);font-family:'Neue Haas Grotesk',sans-serif}button,a{font:inherit;color:inherit}button{cursor:pointer}.filters,.defs{position:absolute;width:0;height:0;overflow:hidden}
.layout{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(300px,38%) minmax(0,1fr);background:var(--cream)}
.intro{position:relative;z-index:2;min-width:0;padding:clamp(1.4rem,4vh,3rem) clamp(1.25rem,4vw,4rem);display:flex;flex-direction:column;background:var(--cream)}h1{font-size:clamp(5rem,15vw,14rem);line-height:.75;font-weight:400;letter-spacing:-.08em}.place-number{margin-top:clamp(2rem,7vh,5rem);color:var(--pink);font-size:clamp(6rem,15vw,13rem);line-height:.78;letter-spacing:-.08em;font-weight:400}.place-name{margin-top:1.2rem;font-size:clamp(1.8rem,4vw,3.8rem);line-height:.95;letter-spacing:-.045em;font-weight:400;overflow-wrap:anywhere;max-width:12ch}.controls{display:flex;align-items:center;gap:.8rem;margin-top:auto;padding-top:2rem}.arrow{width:3.2rem;height:3.2rem;border:1.5px solid var(--brown);border-radius:50%;background:transparent;color:var(--brown);font-size:1.6rem;line-height:1;transition:background .2s,color .2s}.arrow:hover,.arrow:focus-visible{background:var(--brown);color:var(--cream);outline:none}.arrow:disabled{opacity:.3;cursor:default}.counter{font-size:.9rem;font-variant-numeric:tabular-nums;margin:0 .4rem}.home{position:fixed;top:var(--edge);right:var(--edge);z-index:1000;width:clamp(52px,5.5vw,78px);aspect-ratio:200/80;transform:rotate(-10deg);transition:transform .3s}.home:hover{transform:rotate(0) scale(1.08)}.home svg{width:100%;height:100%;overflow:visible;fill:var(--brown);filter:drop-shadow(0 2px 3px rgba(60,35,15,.25))}
.map-wrap{min-width:0;min-height:0;padding:clamp(.8rem,2vw,1.5rem) clamp(.8rem,2vw,1.5rem) clamp(.8rem,2vw,1.5rem) 0}.map{width:100%;height:100%;overflow:hidden;background:var(--cream);border:1px solid rgba(107,68,35,.35)}.leaflet-tile-pane{filter:grayscale(1) sepia(.58) saturate(.65) hue-rotate(345deg) brightness(1.04) contrast(.92)}.leaflet-container{background:var(--cream);font-family:'Neue Haas Grotesk',sans-serif}.leaflet-control-attribution{background:rgba(243,231,207,.9)!important;color:var(--brown)!important;font-size:9px!important}.leaflet-control-attribution a{color:var(--brown)!important}.leaflet-control-zoom a{background:var(--cream)!important;color:var(--brown)!important;border-color:rgba(107,68,35,.4)!important}.leaflet-control-zoom{border:1px solid rgba(107,68,35,.4)!important;box-shadow:none!important;border-radius:0!important}.dog-marker{width:17px;height:17px;border-radius:50%;background:var(--pink);border:2px solid var(--cream);box-shadow:0 1px 5px rgba(60,35,15,.38);transition:transform .2s}.dog-marker.active{transform:scale(1.35);box-shadow:0 0 0 4px rgba(255,47,168,.2),0 1px 5px rgba(60,35,15,.38)}
@media(max-width:800px){.layout{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(38vh,44vh)}.intro{padding:1.1rem 1.25rem 1rem;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;column-gap:1rem;align-items:start}h1{font-size:clamp(4rem,19vw,8rem)}.place-number{grid-column:1;grid-row:2;align-self:end;margin-top:.3rem;font-size:clamp(5rem,22vw,9rem)}.place-name{grid-column:1;grid-row:3;align-self:end;margin-top:.45rem;margin-bottom:.3rem;font-size:clamp(1.4rem,7vw,2.4rem);max-width:15ch}.controls{grid-column:2;grid-row:3;align-self:end;gap:.45rem;padding:0;margin:0 0 .25rem}.arrow{width:2.55rem;height:2.55rem;font-size:1.35rem}.counter{display:none}.map-wrap{padding:0 .7rem .7rem}.home{width:54px}}
@media(max-width:380px){.place-name{font-size:1.25rem}.arrow{width:2.3rem;height:2.3rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false"><defs><g id="bone-shape"><rect x="40" y="26" width="120" height="28"/><circle cx="34" cy="26" r="19"/><circle cx="34" cy="54" r="19"/><circle cx="166" cy="26" r="19"/><circle cx="166" cy="54" r="19"/></g></defs></svg>
<a class="home" href="index.html" aria-label="Back to the index"><svg viewBox="0 0 200 80" aria-hidden="true"><use href="#bone-shape"/></svg></a>
<main class="layout"><section class="intro" aria-label="Walking route locations"><h1>WALK</h1><div class="place-number" id="place-number">01</div><h2 class="place-name" id="place-name"></h2><nav class="controls" aria-label="Browse locations"><button class="arrow" id="prev" aria-label="Previous location">←</button><span class="counter" id="counter" aria-live="polite"></span><button class="arrow" id="next" aria-label="Next location">→</button></nav></section><div class="map-wrap"><div class="map" id="map" role="application" aria-label="Map of dog-friendly locations in Ghent"></div></div></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
 const locations=[
  {name:'Parkbos Dog Area',coords:[51.0060,3.6870]},

  {name:'Azaleapark Dog Area',coords:[51.0610,3.7460]},
  {name:'Barkstraat Dog Area',coords:[51.1680,3.8170]},
  {name:'Bloemekenspark Dog Area',coords:[51.0770,3.7040]},
  {name:'Delphine-Boelparkje Dog Area',coords:[51.0450,3.7500]},
  {name:'Dracenastraat Dog Area',coords:[51.0560,3.7300]},
  {name:'Europalaan Dog Area',coords:[51.0470,3.7060]},
  {name:'Evarist De Buckstraat Dog Area',coords:[51.0620,3.7520]},
  {name:'Gebroeders De Smetstraat Dog Area',coords:[51.0670,3.7300]},
  {name:'Gentbrugse Meersen Dog Area',coords:[51.0350,3.7680]},

  {name:'Groenevalleipark Dog Area',coords:[51.0590,3.7040]},

  {name:'Jan Samijnstraat Dog Area',coords:[51.0390,3.7650]},
  {name:'Jean Jaureslaan Dog Area',coords:[51.0390,3.7590]},
  {name:'Kikvorsstraat Dog Area',coords:[51.0570,3.7000]},
  {name:'Kriekerijstraat Dog Area',coords:[51.0640,3.7510]},
  {name:'Lange Velden Dog Area',coords:[51.1010,3.7000]},

  {name:'Wondelgem Dog Area',coords:[51.0900,3.7100]},

  {name:'Gentbrugge Puppy Area',coords:[51.0400,3.7600]},
  {name:'Sleutelbloempark',coords:[51.0740,3.7500]},
  {name:'Ter Durmenpark',coords:[51.0800,3.7800]},
  {name:'Ghent Dog Area',coords:[51.0543,3.7174]},
  {name:'Ghent Dog Area 2',coords:[51.0543,3.7174]},
  {name:'Ghent Dog Area 3',coords:[51.0543,3.7174]},
  {name:'Ghent Dog Area 4',coords:[51.0543,3.7174]}
 ];
 const map=L.map('map',{zoomControl:true,scrollWheelZoom:false}).setView([51.0543,3.7174],12);
 L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
 const markers=locations.map((place,i)=>{const marker=L.marker(place.coords,{icon:L.divIcon({className:'',html:'<div class="dog-marker" id="marker-'+i+'"></div>',iconSize:[17,17],iconAnchor:[8.5,8.5]}),title:place.name,alt:place.name}).addTo(map);marker.on('click',()=>show(i));return marker});
 let current=0;const number=document.getElementById('place-number'),name=document.getElementById('place-name'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');
 function show(index,pan=true){current=(index+locations.length)%locations.length;number.textContent=String(current+1).padStart(2,'0');name.textContent=locations[current].name;counter.textContent=(current+1)+' / '+locations.length;prev.disabled=current===0;next.disabled=current===locations.length-1;markers.forEach((marker,i)=>{const dot=marker.getElement()?.querySelector('.dog-marker');if(dot)dot.classList.toggle('active',i===current)});if(pan)map.panTo(locations[current].coords,{animate:true,duration:.35})}
 prev.addEventListener('click',()=>{if(current>0)show(current-1)});next.addEventListener('click',()=>{if(current<locations.length-1)show(current+1)});document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'&&current<locations.length-1)show(current+1);if(event.key==='ArrowLeft'&&current>0)show(current-1)});show(0,false);window.addEventListener('resize',()=>map.invalidateSize());
})();
</script>
