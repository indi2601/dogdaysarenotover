    }

      position: absolute;

      left: 32px;
      right: 32px;

    }

    .edition-label {
      font-size: 14px;
      line-height: 1.2;
      text-align: right;
    }

    .archive-title {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      padding: 0 20px;
      text-align: center;
      font-size: clamp(24px, 4vw, 48px);
      line-height: 1;
      font-weight: 400;
      z-index: 2;
    }

    .archive-subtitle {
      position: absolute;
      top: calc(15% + 58px);
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      padding: 0 20px;
      text-align: center;
      font-size: 12px;
      line-height: 1.4;
      z-index: 2;
    }

    .paw-field {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .paw {
      position: absolute;
      width: clamp(42px, 7vw, 92px);
      aspect-ratio: 1;
      color: #50F6D8;
      opacity: 0.95;
      transform: rotate(var(--rotation, 0deg));
    }

    .paw svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .paw path {
      fill: currentColor;
    }

    .paw:nth-child(1)  { left: 8%;  top: 30%; --rotation: -25deg; }
    .paw:nth-child(2)  { left: 21%; top: 44%; --rotation: 18deg; }

    .paw:nth-child(8)  { left: 31%; top: 70%; --rotation: -22deg; }
    .paw:nth-child(9)  { left: 53%; top: 65%; --rotation: 15deg; }
    .paw:nth-child(10) { left: 73%; top: 69%; --rotation: -10deg; }

    .edition-nav {
      position: fixed;
      left: 32px;
      right: 32px;
      bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 400;
    }

    .edition-nav a {
      color: #6b4423;
      text-decoration: none;
      text-transform: none;
    }

    .edition-nav a:hover {
      color: #50F6D8;
    }

    @media (max-width: 600px) {
      header {
        top: 20px;
        left: 20px;
        right: 20px;
      }

      .site-title,
      .edition-label {
        font-size: 12px;
      }

      .archive-title {
        top: 17%;
        font-size: 30px;
      }

      .archive-subtitle {
        top: calc(17% + 42px);
        font-size: 11px;
      }

      .paw {
        width: clamp(34px, 10vw, 58px);
      }

      .paw:nth-child(1)  { left: 8%;  top: 32%; }
      .paw:nth-child(2)  { left: 38%; top: 38%; }
      .paw:nth-child(3)  { left: 70%; top: 31%; }

      .paw:nth-child(9)  { left: 64%; top: 78%; }
      .paw:nth-child(10) { display: none; }

      .edition-nav {
        left: 20px;
        right: 20px;
        bottom: 20px;
        font-size: 12px;
      }
    }

    @media (max-height: 500px) {
      .archive-title {
        top: 14%;
        font-size: 28px;
      }

      .archive-subtitle {
        top: calc(14% + 34px);
      }

        width: 40px;
      }
    }
