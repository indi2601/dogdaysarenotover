<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dog Days Are Not Over – Edition 05</title>
<style>
@font-face {
    font-family: 'Neue Haas Grotesk';
    src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
}

:root {
    --brown: #6b4423;
    --neon: #ff2fa8;
    --background: #fff;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { min-height: 100%; scroll-behavior: smooth; }
body {
    min-height: 100%;
    background: var(--background);
    color: var(--brown);
    font-family: 'Neue Haas Grotesk', sans-serif;
    overscroll-behavior-y: contain;
}

/* The long page turns scrolling into eating: each scroll step lowers the food. */
.eating-stage { height: 300vh; height: 300dvh; position: relative; }
.scene {
    position: sticky;
    top: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 420px;
    overflow: hidden;
    background: var(--background);
}
.title {
    position: absolute;
    top: clamp(1.25rem, 3vh, 2.5rem);
    left: 50%;
    transform: translateX(-50%);
    color: var(--brown);
    font-size: 14vh;
    line-height: .8;
    font-weight: 400;
    letter-spacing: -.06em;
    text-align: center;
    z-index: 2;
}
.bowl-wrap {
    position: absolute;
    inset: 18vh 0 7vh;
    display: grid;
    place-items: center;
}
.bowl {
    display: block;
    width: min(94vw, 1050px);
    height: min(76vh, 680px);
    overflow: visible;
}
.scroll-cue {
    position: absolute;
    left: 50%;
    bottom: clamp(4.5rem, 8vh, 6rem);
    transform: translateX(-50%);
    color: var(--brown);
    font-size: .85rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    white-space: nowrap;
    opacity: .75;
}
.nav-links {
    position: fixed;
    bottom: clamp(.8rem, 2vw, 1.5rem);
    left: clamp(.8rem, 2vw, 1.5rem);
    right: clamp(.8rem, 2vw, 1.5rem);
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 20;
    pointer-events: none;
}
.nav-link {
    font-family: inherit;
    font-size: clamp(.8rem, 1.5vw, 1.05rem);
    font-weight: 400;
    color: var(--neon);
    text-decoration: none;
    white-space: nowrap;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    transition: opacity .25s ease;
    pointer-events: auto;
}
.nav-link:hover, .nav-link:focus-visible { opacity: .7; outline: none; }

@media (max-width: 700px) {
    .eating-stage { height: 260vh; height: 260dvh; }
    .scene { min-height: 380px; }
    .title { top: 8vh; font-size: 22vw; }
    .bowl-wrap { inset: 23vh 0 10vh; }
    .bowl { width: 112vw; height: auto; max-height: 58vh; }
    .scroll-cue { bottom: 5.2rem; font-size: .72rem; }
    .nav-links { bottom: max(.8rem, env(safe-area-inset-bottom)); }
    .nav-link { font-size: 1rem; }
}
@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { transition: none !important; }
}
</style>
</head>
<body>
<main class="eating-stage" id="eating-stage">
    <section class="scene" aria-label="A dog’s-eye view of a bowl of food being eaten as you scroll">
        <h1 class="title">EAT</h1>
        <div class="bowl-wrap">
            <svg class="bowl" viewBox="0 0 1000 700" role="img" aria-labelledby="bowl-title bowl-description">
                <title id="bowl-title">Dog food bowl</title>
                <desc id="bowl-description">A realistic, stylized bowl of kibble. Scroll down to eat the food.</desc>
                <defs>
                    <linearGradient id="ceramic" x1="0" y1="0" x2="0.85" y2="1">
                        <stop offset="0" stop-color="#fff"/>
                        <stop offset=".28" stop-color="#f3eee7"/>
                        <stop offset=".68" stop-color="#d5c6b5"/>
                        <stop offset="1" stop-color="#a98769"/>
                    </linearGradient>
                    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#fff"/>
                        <stop offset=".45" stop-color="#e8ddd0"/>
                        <stop offset="1" stop-color="#b99d82"/>
                    </linearGradient>
                    <linearGradient id="food" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#a66d37"/>
                        <stop offset="1" stop-color="#57351d"/>
                    </linearGradient>
                    <radialGradient id="bowl-shadow" cx="50%" cy="30%" r="70%">
                        <stop offset="0" stop-color="#4a2d18" stop-opacity=".35"/>
                        <stop offset="1" stop-color="#4a2d18" stop-opacity="0"/>
                    </radialGradient>
                    <linearGradient id="kibble" x1="0" y1="0" x2=".8" y2="1">
                        <stop offset="0" stop-color="#c58b4b"/>
                        <stop offset=".45" stop-color="#96602f"/>
                        <stop offset="1" stop-color="#603a20"/>
                    </linearGradient>
                    <clipPath id="inside-bowl">
                        <path d="M195 270 C225 235 775 235 805 270 C790 355 750 455 690 505 C625 555 375 555 310 505 C250 455 210 355 195 270Z"/>
                    </clipPath>
                    <clipPath id="food-clip">
                        <path id="food-shape" d="M220 345 C320 310 680 310 780 345 L735 485 C675 525 325 525 265 485Z"/>
                    </clipPath>
                    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
                        <feGaussianBlur stdDeviation="17"/>
                    </filter>
                </defs>

                <!-- Soft grounding shadow -->
                <ellipse cx="500" cy="570" rx="330" ry="44" fill="#6b4423" opacity=".16" filter="url(#soft-shadow)"/>
                <!-- Bowl body -->
                <path d="M160 265 C185 420 255 570 350 612 C425 645 575 645 650 612 C745 570 815 420 840 265Z" fill="url(#ceramic)" stroke="#8c6a4b" stroke-width="5"/>
                <path d="M198 315 C225 444 280 548 365 578 C430 603 570 603 635 578 C720 548 775 444 802 315" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="9"/>
                <ellipse cx="500" cy="585" rx="153" ry="30" fill="none" stroke="#8c6a4b" stroke-opacity=".48" stroke-width="7"/>
                <!-- Interior and changing food level -->
                <ellipse cx="500" cy="282" rx="330" ry="100" fill="#55371f"/>
                <g clip-path="url(#inside-bowl)">
                    <path id="food-fill" d="M220 345 C320 310 680 310 780 345 L735 485 C675 525 325 525 265 485Z" fill="url(#food)"/>
                    <g id="kibble-layer" clip-path="url(#food-clip)">
                        <g fill="url(#kibble)" stroke="#58371e" stroke-width="4">
                            <path d="M290 367 Q298 348 318 354 L337 361 Q347 378 333 390 L312 398 Q293 391 290 367Z"/>
                            <path d="M365 341 Q373 322 393 329 L413 338 Q422 354 407 367 L384 373 Q366 365 365 341Z"/>
                            <path d="M444 360 Q448 339 469 338 L492 344 Q505 359 494 376 L473 387 Q452 383 444 360Z"/>
                            <path d="M534 338 Q545 321 563 329 L583 340 Q590 358 574 369 L552 371 Q536 359 534 338Z"/>
                            <path d="M615 363 Q621 343 641 345 L663 354 Q673 371 660 386 L637 393 Q619 385 615 363Z"/>
                            <path d="M700 382 Q708 365 727 369 L745 381 Q750 397 735 409 L715 414 Q699 403 700 382Z"/>
                            <path d="M327 428 Q337 409 356 415 L375 426 Q379 444 363 454 L342 457 Q326 447 327 428Z"/>
                            <path d="M408 409 Q419 391 438 398 L456 410 Q461 428 445 438 L424 442 Q407 430 408 409Z"/>
                            <path d="M492 428 Q500 407 521 411 L541 423 Q546 440 530 452 L508 456 Q492 447 492 428Z"/>
                            <path d="M574 407 Q585 390 604 398 L622 411 Q625 429 608 439 L588 441 Q573 430 574 407Z"/>
                            <path d="M666 438 Q676 420 694 425 L711 437 Q714 454 698 464 L678 465 Q664 455 666 438Z"/>
                            <path d="M286 451 Q296 434 315 439 L331 451 Q333 467 318 477 L299 477 Q285 468 286 451Z"/>
                        </g>
                        <g fill="#f0c184" opacity=".45">
                            <ellipse cx="306" cy="363" rx="9" ry="3" transform="rotate(-22 306 363)"/>
                            <ellipse cx="381" cy="338" rx="9" ry="3" transform="rotate(-18 381 338)"/>
                            <ellipse cx="460" cy="348" rx="9" ry="3" transform="rotate(-12 460 348)"/>
                            <ellipse cx="550" cy="337" rx="8" ry="3" transform="rotate(-20 550 337)"/>
                            <ellipse cx="632" cy="355" rx="9" ry="3" transform="rotate(-16 632 355)"/>
                            <ellipse cx="344" cy="421" rx="8" ry="3" transform="rotate(-18 344 421)"/>
                            <ellipse cx="426" cy="404" rx="8" ry="3" transform="rotate(-14 426 404)"/>
                            <ellipse cx="510" cy="418" rx="9" ry="3" transform="rotate(-15 510 418)"/>
                            <ellipse cx="589" cy="402" rx="8" ry="3" transform="rotate(-20 589 402)"/>
                            <ellipse cx="681" cy="435" rx="8" ry="3" transform="rotate(-17 681 435)"/>
                        </g>
                    </g>
                    <path id="food-surface" d="M220 345 C320 310 680 310 780 345 C680 390 320 390 220 345Z" fill="#a66d37" stroke="#d5a26c" stroke-width="5"/>
                    <path d="M280 348 C360 326 640 326 720 348" fill="none" stroke="#e1b77f" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
                </g>
                <!-- Broad ceramic lip drawn over the contents -->
                <ellipse cx="500" cy="280" rx="355" ry="116" fill="url(#rim)" stroke="#8c6a4b" stroke-width="6"/>
                <ellipse cx="500" cy="282" rx="326" ry="91" fill="#4a301b" stroke="#fff" stroke-opacity=".75" stroke-width="5"/>
                <!-- Repeat the visible food surface above the dark interior of the rim. -->
                <path id="visible-food-surface" d="M220 345 C320 310 680 310 780 345 C680 390 320 390 220 345Z" fill="#a66d37" stroke="#d5a26c" stroke-width="5"/>
                <path d="M280 348 C360 326 640 326 720 348" fill="none" stroke="#e1b77f" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
                <ellipse cx="500" cy="280" rx="355" ry="116" fill="none" stroke="#8c6a4b" stroke-width="6"/>
            </svg>
        </div>
        <p class="scroll-cue" id="scroll-cue">Scroll to eat</p>
    </section>
</main>

<nav class="nav-links" aria-label="Edition navigation">
    <a href="editie-04.html" class="nav-link">← edition 04</a>
    <button type="button" class="nav-link" id="reset">reset</button>
    <a href="editie-06.html" class="nav-link">edition 06 →</a>
</nav>

<script>
(function () {
    const stage = document.getElementById('eating-stage');
    const foodFill = document.getElementById('food-fill');
    const foodShape = document.getElementById('food-shape');
    const foodSurface = document.getElementById('food-surface');
    const visibleFoodSurface = document.getElementById('visible-food-surface');
    const kibbleLayer = document.getElementById('kibble-layer');
    const cue = document.getElementById('scroll-cue');
    const resetButton = document.getElementById('reset');

    const fullFood = { top: 335, bottom: 525 };
    const emptyFood = { top: 490, bottom: 525 };
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

    function updateFood() {
        const maxScroll = Math.max(1, stage.offsetHeight - window.innerHeight);
        const progress = clamp(window.scrollY / maxScroll, 0, 1);
        const top = fullFood.top + (emptyFood.top - fullFood.top) * progress;
        const low = fullFood.bottom;
        const left = top - 35;
        const right = top - 35;
        const path = `M220 ${top} C320 ${left} 680 ${left} 780 ${top} L735 ${low - 40} C675 ${low} 325 ${low} 265 ${low - 40}Z`;
        const surface = `M220 ${top} C320 ${left - 35} 680 ${left - 35} 780 ${top} C680 ${top + 45} 320 ${top + 45} 220 ${top}Z`;

        foodFill.setAttribute('d', path);
        foodShape.setAttribute('d', path);
        foodSurface.setAttribute('d', surface);
        visibleFoodSurface.setAttribute('d', surface);
        kibbleLayer.style.opacity = String(clamp(1 - progress * 1.08, 0, 1));
        cue.style.opacity = String(progress > .96 ? 0 : .75);
        cue.textContent = progress > .96 ? 'All gone' : 'Scroll to eat';
    }

    let ticking = false;
    window.addEventListener('scroll', () => {
        if (ticking) return;
        ticking = true;
        window.requestAnimationFrame(() => { updateFood(); ticking = false; });
    }, { passive: true });
    window.addEventListener('resize', updateFood);

    resetButton.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    });

    updateFood();
})();
</script>
</body>
</html>
