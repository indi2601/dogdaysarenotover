<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 01</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Eén scherm hoog: 100vh zorgt dat de body precies één schermhoogte is */
            height: 100vh;
            
            /* Voorkomt scrollen */
            overflow: hidden;
            
            /* Flexbox voor centrering en spacing */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Lichtroze achtergrond */
            background-color: #f5e6e8;
            
            /* Bruine tekst */
            color: #5a4a47;
            
            padding: clamp(1rem, 5vw, 3rem);
            font-family: 'IBM Plex Sans', sans-serif;
        }

        header {
            position: absolute;
            top: clamp(1rem, 3vw, 2rem);
            left: clamp(1rem, 3vw, 2rem);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            color: #5a4a47;
        }

        .editie-badge {
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            font-weight: 600;
            color: #ff1493;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: clamp(0.5rem, 1vw, 0.8rem);
        }

        main {
            width: 100%;
            max-width: 90vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .breeds-list {
            /* Responsive layout */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(1.5rem, 4vw, 3rem);
            
            width: 100%;
            max-width: 85vw;
        }

        .breed {
            /* Responsive lettergrootte met afwisseling */
            font-size: clamp(1.2rem, 3.5vw, 2.2rem);
            line-height: clamp(1.3, 4vw, 1.6);
            
            color: #5a4a47;
            white-space: nowrap;
            cursor: default;
        }

        /* Afwisseling tussen bold, regular en light */
        .breed:nth-child(1) { 
            font-weight: 700; /* Bold */
        }
        .breed:nth-child(2) { 
            font-weight: 300; /* Light */
        }
        .breed:nth-child(3) { 
            font-weight: 600; /* Semi-bold */
        }
        .breed:nth-child(4) { 
            font-weight: 400; /* Regular */
        }
        .breed:nth-child(5) { 
            font-weight: 700; /* Bold */
        }
        .breed:nth-child(6) { 
            font-weight: 300; /* Light */
        }
        .breed:nth-child(7) { 
            font-weight: 600; /* Semi-bold */
        }
        .breed:nth-child(8) { 
            font-weight: 400; /* Regular */
        }

        /* Subtle animation bij laden */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .breed {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .breed:nth-child(1) { animation-delay: 0.1s; }
        .breed:nth-child(2) { animation-delay: 0.2s; }
        .breed:nth-child(3) { animation-delay: 0.3s; }
        .breed:nth-child(4) { animation-delay: 0.4s; }
        .breed:nth-child(5) { animation-delay: 0.5s; }
        .breed:nth-child(6) { animation-delay: 0.6s; }
        .breed:nth-child(7) { animation-delay: 0.7s; }
        .breed:nth-child(8) { animation-delay: 0.8s; }

        footer {
            position: absolute;
            bottom: clamp(1rem, 3vw, 2rem);
            right: clamp(1rem, 3vw, 2rem);
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            color: #5a4a47;
            opacity: 0.6;
        }

        .nav-link {
            position: absolute;
            bottom: clamp(1rem, 3vw, 2rem);
            left: clamp(1rem, 3vw, 2rem);
            font-size: clamp(0.85rem, 1.8vw, 1.1rem);
            font-weight: 600;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Op mobiel: zorg dat rassen op meerdere lijnen kunnen */
        @media (max-width: 768px) {
            .breed {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 01</div>
        <div>Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="breeds-list">
            <span class="breed">Bearded Collie</span>
            <span class="breed">Boomer</span>
            <span class="breed">Chihuahua</span>
            <span class="breed">Cocker Spaniel</span>
            <span class="breed">Coton de Tuléar</span>
            <span class="breed">Labradoodle</span>
            <span class="breed">Pomeranian</span>
            <span class="breed">Pug</span>
        </div>
    </main>

    <footer>
        Editie 01/2026
    </footer>

    <a href="editie-02.html" class="nav-link">→ Editie 02</a>
</body>
</html>
