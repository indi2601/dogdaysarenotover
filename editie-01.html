<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --brown: #6b4423;
            --neon: #ff2fa8;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #faf8f7;
            color: var(--brown);
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
        }

        .editie-badge,
        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: var(--brown);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .breeds-list {
            display: flex;
            flex-direction: column;
            gap: clamp(1.2rem, 3vw, 2.2rem);
            width: 100%;
            max-width: 95vw;
        }

        .breed-group {
            display: flex;
            gap: clamp(1rem, 2.5vw, 1.8rem);
            flex-wrap: wrap;
            justify-content: center;
        }

        .breed {
            font-size: clamp(2rem, 5.6vw, 4rem);
            line-height: 1.2;
            color: var(--brown);
            cursor: default;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            display: inline-block;
            padding: clamp(0.5rem, 1.2vw, 1rem) clamp(0.8rem, 1.6vw, 1.4rem);
            border: 2px solid var(--brown);
            border-radius: 4px;
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .breed {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .breed:nth-child(1) { animation-delay: 0.1s; }
        .breed:nth-child(2) { animation-delay: 0.15s; }
        .breed:nth-child(3) { animation-delay: 0.2s; }
        .breed:nth-child(4) { animation-delay: 0.25s; }

        /* Laag waarin de blafjes op de plek van de cursor verschijnen */
        .barks-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .woof {
            position: absolute;
            transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
            font-size: clamp(0.9rem, 1.8vw, 1.4rem);
            line-height: 1.2;
            color: var(--neon);
            white-space: nowrap;
            text-shadow:
                0 0 4px rgba(255, 47, 168, 0.9),
                0 0 12px rgba(255, 47, 168, 0.6);
            animation: woofIn 0.25s ease-out backwards;
            transition: opacity 0.4s ease;
        }

        .woof.out {
            opacity: 0;
        }

        @keyframes woofIn {
            from {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(0.6);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) scale(1);
            }
        }

        .nav-link {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .breed {
                font-size: clamp(1.5rem, 6.5vw, 2.2rem);
            }

            .breeds-list {
                gap: clamp(1rem, 2.5vw, 1.6rem);
            }

            .woof {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 01</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="breeds-list">
            <div class="breed-group">
                <span class="breed" tabindex="0" data-bark="WAF! WAF-waf!">bearded collie</span>
                <span class="breed" tabindex="0" data-bark="Waf! Waf! Waf-waf!">boomer</span>
                <span class="breed" tabindex="0" data-bark="WAF! WAF! WAF! Waf-waf-waf!">chihuahua</span>
                <span class="breed" tabindex="0" data-bark="Waf-waf! WOOF!">cocker spaniel</span>
            </div>
            <div class="breed-group">
                <span class="breed" tabindex="0" data-bark="Waf! Waf-waf!">coton de tuléar</span>
                <span class="breed" tabindex="0" data-bark="WOOF! Waf! WOOF!">labradoodle</span>
                <span class="breed" tabindex="0" data-bark="WAF-WAF-WAF-WAF!">pomeranian</span>
                <span class="breed" tabindex="0" data-bark="Waf! Woef! Hrr-waf!">pug</span>
            </div>
        </div>
    </main>

    <div class="barks-layer" id="barks" aria-hidden="true"></div>

    <a href="editie-02.html" class="nav-link">→ Editie 02</a>

    <script>
        (function () {
            var layer = document.getElementById('barks');
            var breeds = document.querySelectorAll('.breed');

            var MAX_BARKS = 30;      // maximaal aantal blafjes tegelijk
            var STEP = 55;           // pixels bewegen voordat er een nieuw blafje bijkomt

            var active = [];
            var lastX = 0;
            var lastY = 0;

            function spawn(text, x, y) {
                var el = document.createElement('div');
                el.className = 'woof';
                el.textContent = text;
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.setProperty('--rot', (Math.random() * 16 - 8).toFixed(1) + 'deg');
                layer.appendChild(el);
                active.push(el);

                if (active.length > MAX_BARKS) {
                    removeNow(active.shift());
                }
                lastX = x;
                lastY = y;
            }

            function removeNow(el) {
                if (el && el.parentNode) el.parentNode.removeChild(el);
            }

            function clearNow() {
                active.forEach(removeNow);
                active = [];
            }

            function fadeAll() {
                var old = active;
                active = [];
                old.forEach(function (el) { el.classList.add('out'); });
                setTimeout(function () { old.forEach(removeNow); }, 450);
            }

            breeds.forEach(function (el) {
                var text = el.getAttribute('data-bark');

                el.addEventListener('pointerenter', function (e) {
                    clearNow();
                    spawn(text, e.clientX, e.clientY);
                });

                el.addEventListener('pointermove', function (e) {
                    var dx = e.clientX - lastX;
                    var dy = e.clientY - lastY;
                    if (Math.sqrt(dx * dx + dy * dy) >= STEP) {
                        spawn(text, e.clientX, e.clientY);
                    }
                });

                el.addEventListener('pointerleave', fadeAll);

                // Toetsenbord: blafje midden op het ras
                el.addEventListener('focus', function () {
                    var r = el.getBoundingClientRect();
                    clearNow();
                    spawn(text, r.left + r.width / 2, r.top + r.height / 2);
                });
                el.addEventListener('blur', fadeAll);
            });
        })();
    </script>
</body>
</html>
