<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #faf8f7;
            color: #6b4423;
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: flex-start;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            display: flex;
            align-items: baseline;
            gap: clamp(0.5rem, 1vw, 1rem);
        }

        .editie-badge {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        .title-text {
            font-size: clamp(0.9rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #6b4423;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .breeds-list {
            display: flex;
            flex-direction: column;
            gap: clamp(1.4rem, 3.5vw, 2.4rem);
            width: 100%;
            max-width: 95vw;
        }

        .breed-group {
            display: flex;
            gap: clamp(1rem, 2.5vw, 1.8rem);
            flex-wrap: wrap;
            justify-content: center;
        }

        .breed {
            font-size: clamp(1.6rem, 4.6vw, 3rem);
            line-height: 1.2;
            color: #6b4423;
            cursor: default;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            display: inline-block;
            padding: clamp(0.5rem, 1.2vw, 1rem) clamp(0.8rem, 1.6vw, 1.4rem);
            border: 1px solid #d4a5a5;
            border-radius: clamp(0.3rem, 0.8vw, 0.6rem);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .breed {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .breed:nth-child(1) { animation-delay: 0.1s; }
        .breed:nth-child(2) { animation-delay: 0.15s; }
        .breed:nth-child(3) { animation-delay: 0.2s; }
        .breed:nth-child(4) { animation-delay: 0.25s; }
        .breed:nth-child(5) { animation-delay: 0.3s; }
        .breed:nth-child(6) { animation-delay: 0.35s; }
        .breed:nth-child(7) { animation-delay: 0.4s; }
        .breed:nth-child(8) { animation-delay: 0.45s; }

        footer {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: #6b4423;
            opacity: 0.6;
        }

        .nav-link {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .breed {
                font-size: clamp(1.2rem, 5vw, 1.8rem);
            }

            .breeds-list {
                gap: clamp(1rem, 2.5vw, 1.6rem);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 01</div>
        <div class="title-text">Dog Days Are Not Over</div>
    </header>

    <main>
        <div class="breeds-list">
            <div class="breed-group">
                <span class="breed">bearded collie</span>
                <span class="breed">boomer</span>
                <span class="breed">chihuahua</span>
                <span class="breed">cocker spaniel</span>
            </div>
            <div class="breed-group">
                <span class="breed">coton de tuléar</span>
                <span class="breed">labradoodle</span>
                <span class="breed">pomeranian</span>
                <span class="breed">pug</span>
            </div>
        </div>
    </main>

    <footer>
        Editie 01/2026
    </footer>

    <a href="editie-02.html" class="nav-link">→ Editie 02</a>
</body>
</html>
