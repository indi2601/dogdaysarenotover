<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background-color: #f5e6e8;
            color: #6b4423;
            padding: clamp(0.8rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        header {
            position: absolute;
            top: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.9rem, 2vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #6b4423;
            line-height: 1.2;
        }

        .editie-badge {
            font-size: clamp(0.6rem, 1.2vw, 0.8rem);
            font-weight: 400;
            color: #ff1493;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: clamp(0.3rem, 0.8vw, 0.5rem);
        }

        main {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: clamp(1.5rem, 6vw, 4rem);
            line-height: clamp(1.1, 1.3, 1.4);
            margin-bottom: clamp(1.5rem, 4vw, 3rem);
            color: #6b4423;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
            max-width: 95vw;
            word-wrap: break-word;
        }

        .breeds-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(0.8rem, 2.5vw, 2rem);
            width: 100%;
            max-width: 95vw;
        }

        .breed {
            font-size: clamp(0.9rem, 2.5vw, 1.8rem);
            line-height: 1.2;
            color: #6b4423;
            white-space: nowrap;
            cursor: default;
            font-weight: 400;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .breed {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .breed:nth-child(1) { animation-delay: 0.1s; }
        .breed:nth-child(2) { animation-delay: 0.2s; }
        .breed:nth-child(3) { animation-delay: 0.3s; }
        .breed:nth-child(4) { animation-delay: 0.4s; }
        .breed:nth-child(5) { animation-delay: 0.5s; }
        .breed:nth-child(6) { animation-delay: 0.6s; }
        .breed:nth-child(7) { animation-delay: 0.7s; }
        .breed:nth-child(8) { animation-delay: 0.8s; }

        footer {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            right: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.6rem, 1.2vw, 0.85rem);
            color: #6b4423;
            opacity: 0.6;
        }

        .nav-link {
            position: absolute;
            bottom: clamp(0.8rem, 2vw, 1.5rem);
            left: clamp(0.8rem, 2vw, 1.5rem);
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        @media (max-width: 500px) {
            .breed {
                white-space: normal;
                max-width: 80vw;
            }

            h1 {
                margin-bottom: clamp(1rem, 3vw, 2rem);
            }

            .breeds-list {
                gap: clamp(0.6rem, 1.5vw, 1rem);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 01</div>
        <div>Dog Days Are Not Over</div>
    </header>

    <main>
        <h1>Dog Days Are Not Over</h1>
        
        <div class="breeds-list">
            <span class="breed">Bearded Collie</span>
            <span class="breed">Boomer</span>
            <span class="breed">Chihuahua</span>
            <span class="breed">Cocker Spaniel</span>
            <span class="breed">Coton de Tuléar</span>
            <span class="breed">Labradoodle</span>
            <span class="breed">Pomeranian</span>
            <span class="breed">Pug</span>
        </div>
    </main>

    <footer>
        Editie 01/2026
    </footer>

    <a href="editie-02.html" class="nav-link">→ Editie 02</a>
</body>
</html>
