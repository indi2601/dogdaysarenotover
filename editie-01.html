<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Days Are Not Over – Editie 01</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @font-face {
            font-family: 'Neue Haas Grotesk';
            src: url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/npm/fontsource-neue-haas-grotesk@1.0.0/files/neue-haas-grotesk-regular.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        body {
            /* Eén scherm hoog: 100vh zorgt dat de body precies één schermhoogte is */
            height: 100vh;
            
            /* Voorkomt scrollen */
            overflow: hidden;
            
            /* Flexbox voor centrering en spacing */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            
            /* Lichtroze achtergrond */
            background-color: #f5e6e8;
            
            /* Gesatureerder bruin */
            color: #6b4423;
            
            padding: clamp(1rem, 5vw, 3rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        header {
            position: absolute;
            top: clamp(1rem, 3vw, 2rem);
            left: clamp(1rem, 3vw, 2rem);
            font-family: 'Neue Haas Grotesk', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #6b4423;
        }

        .editie-badge {
            font-family: 'Neue Haas Grotesk', sans-serif;
            font-size: clamp(0.7rem, 1.5vw, 0.9rem);
            font-weight: 400;
            color: #ff1493;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: clamp(0.5rem, 1vw, 0.8rem);
        }

        main {
            width: 100%;
            max-width: 90vw;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-family: 'Neue Haas Grotesk', sans-serif;
            /* Responsive lettergrootte */
            font-size: clamp(2rem, 7vw, 5rem);
            
            /* Regelafstand die meegroeit */
            line-height: clamp(1.1, 10vw, 1.2);
            
            margin-bottom: clamp(2rem, 5vw, 3.5rem);
            color: #6b4423;
            font-weight: 400;
            letter-spacing: 0.02em;
            text-transform: uppercase;
        }

        .breeds-list {
            /* Responsive layout */
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: clamp(1.5rem, 4vw, 3rem);
            
            width: 100%;
            max-width: 85vw;
        }

        .breed {
            /* Responsive lettergrootte */
            font-size: clamp(1.2rem, 3.5vw, 2.2rem);
            line-height: clamp(1.3, 4vw, 1.6);
            
            color: #6b4423;
            white-space: nowrap;
            cursor: default;
            font-weight: 400;
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        /* Subtle animation bij laden */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .breed {
            animation: fadeIn 0.6s ease-out backwards;
        }

        .breed:nth-child(1) { animation-delay: 0.1s; }
        .breed:nth-child(2) { animation-delay: 0.2s; }
        .breed:nth-child(3) { animation-delay: 0.3s; }
        .breed:nth-child(4) { animation-delay: 0.4s; }
        .breed:nth-child(5) { animation-delay: 0.5s; }
        .breed:nth-child(6) { animation-delay: 0.6s; }
        .breed:nth-child(7) { animation-delay: 0.7s; }
        .breed:nth-child(8) { animation-delay: 0.8s; }

        footer {
            position: absolute;
            bottom: clamp(1rem, 3vw, 2rem);
            right: clamp(1rem, 3vw, 2rem);
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            color: #6b4423;
            opacity: 0.6;
        }

        .nav-link {
            position: absolute;
            bottom: clamp(1rem, 3vw, 2rem);
            left: clamp(1rem, 3vw, 2rem);
            font-size: clamp(0.85rem, 1.8vw, 1.1rem);
            font-weight: 400;
            color: #ff1493;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.3s ease;
            font-family: 'Neue Haas Grotesk', sans-serif;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        /* Op mobiel: zorg dat rassen op meerdere lijnen kunnen */
        @media (max-width: 768px) {
            .breed {
                white-space: normal;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="editie-badge">Editie 01</div>
        <div>Dog Days Are Not Over</div>
    </header>

    <main>
        <h1>Dog Days Are Not Over</h1>
        
        <div class="breeds-list">
            <span class="breed">Bearded Collie</span>
            <span class="breed">Boomer</span>
            <span class="breed">Chihuahua</span>
            <span class="breed">Cocker Spaniel</span>
            <span class="breed">Coton de Tuléar</span>
            <span class="breed">Labradoodle</span>
            <span class="breed">Pomeranian</span>
            <span class="breed">Pug</span>
        </div>
    </main>

    <footer>
        Editie 01/2026
    </footer>

    <a href="editie-02.html" class="nav-link">→ Editie 02</a>
</body>
</html>
